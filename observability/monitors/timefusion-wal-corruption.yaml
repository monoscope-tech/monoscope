title: "TF page: WAL corruption / replay failures"
severity: critical
active: true

condition:
  query: >-
    severity.severity_text == "error" and (body has "WAL REPLAY FAILED" or body has "WAL
    corruption")
  alert_threshold: 1
  trigger_less_than: false

evaluation:
  check_interval_mins: 5
  time_window_mins: 15
  threshold_sustained_for_mins: 0

notify:
  subject: TimeFusion WAL entries failing to deserialize or replay
  message: >-
    WAL replay/corruption errors detected — silent data loss risk. Inspect
    {data_dir}/wal/quarantine/ on the host for the offending bytes.
  email_all: true
