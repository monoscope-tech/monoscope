title: "TF warn: flush failures"
severity: warning
active: true

condition:
  query: >-
    severity.severity_text == "error" and body has "flush failed"
  alert_threshold: 1
  trigger_less_than: false

evaluation:
  check_interval_mins: 5
  time_window_mins: 15
  threshold_sustained_for_mins: 0

notify:
  subject: TimeFusion Delta flush cycles erroring
  message: >-
    Flush failures detected — Delta commits erroring. Check S3/R2 connectivity and
    commit coordination. Leading indicator of the bucket-age page.
  email_all: true
