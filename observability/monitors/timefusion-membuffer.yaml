title: "TF warn: MemBuffer pressure > 80%"
severity: warning
active: true

condition:
  query: >-
    metrics
    | where metric_name == "timefusion.mem_buffer.pressure_pct"
    | summarize max(value)
  alert_threshold: 80
  trigger_less_than: false

evaluation:
  check_interval_mins: 5
  time_window_mins: 10
  threshold_sustained_for_mins: 2

notify:
  subject: TimeFusion approaching buffer memory hard limit
  message: >-
    MemBuffer pressure above 80% of budget for 2+ min — flush is lagging. Leading
    indicator of insert rejections (Memory limit exceeded).
  email_all: true
