title: "TF warn: WAL disk usage > 60GB"
severity: warning
active: true

condition:
  query: >-
    metrics
    | where metric_name == "timefusion.wal.disk_bytes"
    | summarize max(value)
  alert_threshold: 64424509440 # 60 GiB
  trigger_less_than: false

evaluation:
  check_interval_mins: 15
  time_window_mins: 30
  threshold_sustained_for_mins: 0

notify:
  subject: TimeFusion WAL directory growing beyond expected steady state
  message: >-
    WAL dir above 60GB — steady state should be ~retention+20min of ingest (~30GB at
    6MB/s). Either the mtime reaper stopped, walrus leaked across rapid restarts, or
    ingest spiked. Check timefusion.wal.gc_deleted_files and the WAL GC log lines.
  email_all: true
