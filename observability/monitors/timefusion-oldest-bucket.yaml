title: "TF page: MemBuffer oldest bucket age > 2x flush interval"
severity: critical
active: true

condition:
  query: >-
    metrics
    | where metric_name == "timefusion.mem_buffer.oldest_bucket_age_seconds"
    | summarize max(value)
  alert_threshold: 1200
  trigger_less_than: false

evaluation:
  check_interval_mins: 5
  time_window_mins: 10
  threshold_sustained_for_mins: 5

notify:
  subject: TimeFusion MemBuffer not flushing
  message: >-
    Oldest bucket older than 2x flush interval (1200s) for 5+ min. Data is not reaching
    Delta; ingest will eventually reject. Check flush task / S3 connectivity / lock
    convoy.
  email_all: true
