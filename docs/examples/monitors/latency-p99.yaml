title: P99 latency
severity: warning
active: true

condition:
  query: >-
    summarize percentile(duration, 99) by bin_auto(timestamp)
  alert_threshold: 1500
  warning_threshold: 1000
  trigger_less_than: false

evaluation:
  check_interval_mins: 5
  time_window_mins: 30
  threshold_sustained_for_mins: 15

notify:
  subject: P99 latency exceeded
  message: >-
    Tail latency has breached the configured threshold.
  email_all: false
  emails:
    - perf@example.com
  slack_channels:
    - "#perf"
  notify_after_mins: 60
