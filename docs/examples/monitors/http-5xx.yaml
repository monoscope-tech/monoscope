title: HTTP 5xx rate
severity: error
active: true

condition:
  query: >-
    where status_code >= 500
    | summarize count(*) by bin_auto(timestamp)
  alert_threshold: 10
  warning_threshold: 5
  trigger_less_than: false

evaluation:
  check_interval_mins: 5
  time_window_mins: 15
  threshold_sustained_for_mins: 10

notify:
  subject: 5xx rate elevated
  message: >-
    Server-side error rate has exceeded the alert threshold.
  email_all: false
  emails:
    - oncall@example.com
  slack_channels:
    - "#alerts"
  notify_after_mins: 30
