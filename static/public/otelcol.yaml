receivers:
  otlp:
    protocols:
      grpc:
        endpoint: :4317
        max_recv_msg_size_mib: 16
        include_metadata: true
      http:
        endpoint: :80
        include_metadata: true
        cors:
          allowed_origins:
            - '*'
          allowed_headers:
            - '*'

processors:
  batch:
    send_batch_size: 1024
    send_batch_max_size: 1024
    timeout: 5s
  memory_limiter:
    check_interval: 1s
    limit_mib: 1400
    spike_limit_mib: 300
  groupbytrace:
    wait_duration: 5s
    num_traces: 1000
    num_workers: 4
  attributes:
    actions:
      - key: http.headers
        from_context: http.headers
        action: insert
      - key: grpc.metadata
        from_context: grpc.metadata
        action: insert
      # Extract x-api-key from headers/metadata into a resource-level attribute
      # so the backend can resolve project keys from the Kafka path
      - key: x-api-key
        from_context: metadata.x-api-key
        action: insert
  resource:
    attributes:
      - key: http.headers
        from_attribute: http.headers
        action: upsert
      - key: grpc.metadata
        from_attribute: grpc.metadata
        action: upsert
      - key: x-api-key
        from_attribute: x-api-key
        action: upsert
  # Translate every incoming signal to the latest OTel semantic conventions
  # schema, regardless of the version the customer SDK emitted. This keeps
  # downstream queries / dashboards stable as the spec evolves.
  schema:
    prefetch:
      - https://opentelemetry.io/schemas/1.41.0
    targets:
      - https://opentelemetry.io/schemas/1.41.0

  # Tier-1 log parsing. Cheap, deterministic OTTL transforms applied to every
  # incoming log record. Anything requiring stateful parsing, balanced-brace
  # extraction, or learned templates lives in the Haskell tier-2 worker.
  #
  # Invariants this processor preserves:
  #   - never overwrite a value the SDK set deliberately (uses `insert` merge,
  #     and gates every set on the destination being unset)
  #   - the raw body is always recoverable via attributes["log.original"]
  #   - parse failures are silent (error_mode: silent) — customer log bodies
  #     are arbitrary and truncated/malformed JSON is normal, not operator-
  #     actionable. `ignore` would log a warn *per record*. Tier 2 still sees
  #     the untouched body.
  #
  # Paths are context-qualified (`log.body`, not `body`). The implicit form
  # still works but the collector rewrites it at startup and logs every
  # statement it touched; it is slated for removal upstream.
  transform/tier1:
    error_mode: silent
    log_statements:
      - context: log
        statements:
          # Preserve raw body before any mutation. String-bodied logs only;
          # already-structured (map) bodies are passed through untouched.
          - set(log.attributes["log.original"], log.body) where IsString(log.body) and log.attributes["log.original"] == nil

          # Whole-body JSON. Only objects (`{...}`) — arrays and scalars are
          # not log records. The closing-brace guard skips bodies truncated by
          # an upstream logger, which would otherwise fail deep inside
          # ParseJSON after scanning the whole (often multi-KB) string.
          # `insert` guarantees we don't clobber SDK attrs.
          - set(log.cache["parsed"], ParseJSON(log.body)) where IsString(log.body) and IsMatch(log.body, "^\\s*\\{") and IsMatch(log.body, "\\}\\s*$")
          - merge_maps(log.attributes, log.cache["parsed"], "insert") where log.cache["parsed"] != nil

          # Whole-body logfmt. Skip if JSON already parsed, require at least
          # one `key=value` pair at the start so we don't false-match on
          # free-form prose, and exclude anything JSON-shaped — embedded
          # `key="{...}"` payloads match the logfmt prefix but split into
          # thousands of failing pairs.
          - set(log.cache["parsed"], ParseKeyValue(log.body, "=", " ")) where log.cache["parsed"] == nil and IsString(log.body) and IsMatch(log.body, "^[A-Za-z0-9_.-]+=\\S") and not IsMatch(log.body, "^\\s*[\\{\\[]")
          - merge_maps(log.attributes, log.cache["parsed"], "insert") where log.cache["parsed"] != nil

          # Severity text — pull from the usual aliases when the SDK didn't
          # set the dedicated severity_text field.
          - set(log.severity_text, String(log.attributes["level"]))     where log.severity_text == "" and log.attributes["level"] != nil
          - set(log.severity_text, String(log.attributes["severity"]))  where log.severity_text == "" and log.attributes["severity"] != nil
          - set(log.severity_text, String(log.attributes["log.level"])) where log.severity_text == "" and log.attributes["log.level"] != nil

          # Severity number. Only fill when SDK left it UNSPECIFIED (0).
          # Anchored prefix match so "informational" → INFO, "errno" → ERROR.
          - set(log.severity_number, SEVERITY_NUMBER_TRACE) where log.severity_number == 0 and IsMatch(log.severity_text, "(?i)^trace")
          - set(log.severity_number, SEVERITY_NUMBER_DEBUG) where log.severity_number == 0 and IsMatch(log.severity_text, "(?i)^(debug|dbg)")
          - set(log.severity_number, SEVERITY_NUMBER_INFO)  where log.severity_number == 0 and IsMatch(log.severity_text, "(?i)^(info|inf|notice)")
          - set(log.severity_number, SEVERITY_NUMBER_WARN)  where log.severity_number == 0 and IsMatch(log.severity_text, "(?i)^(warn|warning)")
          - set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.severity_number == 0 and IsMatch(log.severity_text, "(?i)^(err|error|severe)")
          - set(log.severity_number, SEVERITY_NUMBER_FATAL) where log.severity_number == 0 and IsMatch(log.severity_text, "(?i)^(fatal|crit|critical|emerg|panic|alert)")

          # Timestamp extraction — only when SDK didn't set `time`. We probe
          # the common attribute names, then try RFC3339 / RFC3339Nano /
          # `YYYY-MM-DD HH:MM:SS`. Time() returns the zero value on miss, so
          # successive attempts are safe.
          - set(log.cache["ts"], log.attributes["timestamp"])  where log.time_unix_nano == 0 and log.attributes["timestamp"] != nil
          - set(log.cache["ts"], log.attributes["@timestamp"]) where log.time_unix_nano == 0 and log.cache["ts"] == nil and log.attributes["@timestamp"] != nil
          - set(log.cache["ts"], log.attributes["ts"])         where log.time_unix_nano == 0 and log.cache["ts"] == nil and log.attributes["ts"] != nil
          - set(log.cache["ts"], log.attributes["time"])       where log.time_unix_nano == 0 and log.cache["ts"] == nil and log.attributes["time"] != nil
          - set(log.time, Time(log.cache["ts"], "%Y-%m-%dT%H:%M:%S.%fZ")) where log.cache["ts"] != nil and log.time_unix_nano == 0
          - set(log.time, Time(log.cache["ts"], "%Y-%m-%dT%H:%M:%SZ"))    where log.cache["ts"] != nil and log.time_unix_nano == 0
          - set(log.time, Time(log.cache["ts"], "%Y-%m-%d %H:%M:%S"))     where log.cache["ts"] != nil and log.time_unix_nano == 0
          # Sanity guard: parsed timestamps more than 24h from observed_time
          # mean a bad client clock or wrong format — fall back to observed.
          - set(log.time_unix_nano, log.observed_time_unix_nano) where log.time_unix_nano != 0 and (log.time_unix_nano - log.observed_time_unix_nano > 86400000000000 or log.observed_time_unix_nano - log.time_unix_nano > 86400000000000)

          # Promote a "message-ish" field to body. Body is the canonical OTel
          # field for the log line's text; we want the human-readable string
          # there, not the raw JSON (which stays in attributes["log.original"]).
          # The guard `body == attributes["log.original"]` ensures only the
          # first match wins — once body is replaced, every later statement
          # short-circuits.
          #
          # Intentionally limited to the top 10 most-common aliases — the full
          # ~100-key list (Utils.messageKeys) would add ~10µs per record, and
          # the long-tail aliases are still handled at display time by
          # extractMessageFromLog. These ten must stay a *prefix* of
          # Utils.messageKeys (priority order matters); enforced by
          # test/collector/check-drift.sh.
          - set(log.body, log.attributes["msg"]) where log.body == log.attributes["log.original"] and IsString(log.attributes["msg"])
          - set(log.body, log.attributes["message"]) where log.body == log.attributes["log.original"] and IsString(log.attributes["message"])
          - set(log.body, log.attributes["@message"]) where log.body == log.attributes["log.original"] and IsString(log.attributes["@message"])
          - set(log.body, log.attributes["@m"]) where log.body == log.attributes["log.original"] and IsString(log.attributes["@m"])
          - set(log.body, log.attributes["short_message"]) where log.body == log.attributes["log.original"] and IsString(log.attributes["short_message"])
          - set(log.body, log.attributes["full_message"]) where log.body == log.attributes["log.original"] and IsString(log.attributes["full_message"])
          - set(log.body, log.attributes["raw_message"]) where log.body == log.attributes["log.original"] and IsString(log.attributes["raw_message"])
          - set(log.body, log.attributes["original_message"]) where log.body == log.attributes["log.original"] and IsString(log.attributes["original_message"])
          - set(log.body, log.attributes["event"]) where log.body == log.attributes["log.original"] and IsString(log.attributes["event"])
          - set(log.body, log.attributes["text"]) where log.body == log.attributes["log.original"] and IsString(log.attributes["text"])

          # Drop the keys we promoted into first-class fields. Keeps the
          # attribute set tight and avoids double-display in the UI.
          - delete_key(log.attributes, "level")
          - delete_key(log.attributes, "severity")
          - delete_key(log.attributes, "log.level")
          - delete_key(log.attributes, "timestamp")
          - delete_key(log.attributes, "@timestamp")
          - delete_key(log.attributes, "ts")
          - delete_key(log.attributes, "msg")
          - delete_key(log.attributes, "message")

exporters:
  debug:
    verbosity: detailed
  kafka:
    partition_traces_by_id: true
    partition_metrics_by_resource_attributes: true
    partition_logs_by_trace_id: true
    sending_queue:
      queue_size: 1000000
      num_consumers: 6
    producer:
      max_message_bytes: 20000000
      compression: zstd
    brokers:
      - redpanda-0.s.past3.tech:19092
      - redpanda-1.s.past3.tech:29092
      - redpanda-2.s.past3.tech:39092
    auth:
      sasl:
        username: ${env:KAFKA_USERNAME}
        password: ${env:KAFKA_PASSWORD}
        mechanism: SCRAM-SHA-256

extensions:
  health_check:
  pprof:
  zpages:
    endpoint: :55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [attributes, resource, schema, transform/tier1, memory_limiter, batch]
      exporters: [kafka]
    metrics:
      receivers: [otlp]
      processors: [attributes, resource, schema, memory_limiter, batch]
      exporters: [kafka]
    traces:
      receivers: [otlp]
      processors: [attributes, resource, schema, memory_limiter, batch]
      exporters: [kafka]
