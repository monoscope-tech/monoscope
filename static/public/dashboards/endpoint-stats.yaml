title: Endpoint Analytics
preview: /public/assets/svgs/screens/http-stats.svg
icon: chart-line
refresh_interval: 60s
variables:
  - key: host
    title: Domain
    required: true
    multi: false
    help_text: Domain
    type: query
    sql:
      source: postgres
      statement: select distinct host from apis.endpoints where project_id='{{project_id}}' limit 500

  - key: endpointHash
    title: Endpoint
    required: true
    multi: false
    help_text: Current filtered endpoint
    reload_on_change: true
    type: query
    sql:
      source: postgres
      statement: select hash::text, method || ' ' || url_path from apis.endpoints where project_id='{{project_id}}' and host='{{var-host}}' limit 500

widgets: []

tabs:
  - name: Overview
    icon: grid
    widgets:
      # KPI Strip
      - type: group
        title: Health
        layout: { w: 12, h: 4 }
        children:
          - type: 'timeseries_stat'
            title: 'Requests'
            icon: activity
            query: |
              hashes[*]=="{{var-endpointHash}}"
              | summarize count() by bin_auto(timestamp)
            unit: reqs
            eager: true
            layout: { w: 3, h: 2 }

          - type: 'timeseries_stat'
            title: 'Error Rate'
            description: 'Percentage of 5xx server errors. Lower is better.'
            icon: alert-triangle
            query: |
              hashes[*]=="{{var-endpointHash}}"
              | summarize round(countif(coalesce(attributes.http.response.status_code, 0) >= 500) * 100.0 / count(), 2) by bin_auto(timestamp)
            unit: '%'
            alert_threshold: 5
            warning_threshold: 1
            layout: { w: 3, h: 2 }

          - type: 'timeseries_stat'
            title: 'P95 Latency'
            description: '95th percentile response time. 95% of requests are faster than this.'
            icon: clock
            query: |
              hashes[*]=="{{var-endpointHash}}" AND duration != null
              | summarize p95(duration) / 1000000 by bin_auto(timestamp)
            unit: ms
            layout: { w: 3, h: 2 }

          - type: 'stat'
            title: 'Apdex'
            description: 'Application Performance Index (0-1). >0.9 excellent, <0.5 poor. Threshold: 500ms satisfied, 2s tolerating.'
            icon: smile
            sql: "SELECT ROUND((SUM(CASE WHEN duration <= 500000000 THEN 1.0 WHEN duration <= 2000000000 THEN 0.5 ELSE 0 END)) / GREATEST(1, COUNT(*))::numeric, 2)::float FROM otel_logs_and_spans WHERE project_id='{{project_id}}' AND hashes @> ARRAY['{{var-endpointHash}}'] AND duration IS NOT NULL {{time_filter}}"
            unit: '/1.0'
            layout: { w: 3, h: 2 }

      # Time series row: request volume + latency
      - type: 'timeseries'
        title: 'Requests by Status Code'
        query: |
          hashes[*]=="{{var-endpointHash}}" AND attributes.http.response.status_code != null
          | summarize count() by bin_auto(timestamp), coalesce(tostring(attributes.http.response.status_code), "unknown")
          | order by timestamp desc
          | limit 10000
        unit: reqs
        layout: { w: 6, h: 4 }

      - type: 'timeseries_line'
        title: 'Latency Percentiles'
        description: 'Response time distribution over time. P50 is median, P95 shows tail latency.'
        hide_subtitle: true
        summarize_by: max
        query: |
          hashes[*]=="{{var-endpointHash}}" AND duration != null
          | summarize percentiles(duration / 1e6, 50, 75, 90, 95) by bin_auto(timestamp)
          | order by timestamp desc
        layout: { w: 6, h: 4 }

      # Errors + error breakdown
      - type: 'timeseries'
        title: 'Errors (4xx & 5xx)'
        theme: 'roma'
        query: |
          hashes[*]=="{{var-endpointHash}}" AND attributes.http.response.status_code != null AND attributes.http.response.status_code >= 400.0
          | extend error_category = case(attributes.http.response.status_code >= 500, "5xx", attributes.http.response.status_code >= 400, "4xx", tostring(attributes.http.response.status_code))
          | summarize count() by bin_auto(timestamp), error_category
          | order by timestamp desc
          | limit 10000
        unit: errors
        layout: { w: 6, h: 4 }

      # Status code breakdown table
      - type: table
        title: 'Status Code Breakdown'
        layout: { w: 6, h: 4 }
        columns:
          - field: status_code
            title: Status Code
          - field: count
            title: Count
            columnType: number
            progress: column_percent
          - field: pct
            title: '% of Total'
            progress: value_percent
          - field: avg_latency
            title: Avg Latency
            columnType: duration
            unit: ms
            progress: column_percent
        sql: |
          SELECT
            COALESCE(attributes___http___response___status_code::text, 'unknown') as status_code,
            COUNT(*)::text as count,
            ROUND((COUNT(*)::float * 100.0 / GREATEST(1, SUM(COUNT(*)) OVER ())::float)::numeric, 1)::float::text as pct,
            ROUND((AVG(duration) / 1e6)::numeric, 2)::text as avg_latency
          FROM otel_logs_and_spans
          WHERE project_id='{{project_id}}'
            AND hashes @> ARRAY['{{var-endpointHash}}']
            {{time_filter}}
          GROUP BY attributes___http___response___status_code
          ORDER BY COUNT(*) DESC
          LIMIT 20

      # Downstream dependencies table
      - type: table
        title: 'Downstream Dependencies'
        description: 'Direct service, database, queue, and external dependencies. Served from five-minute dependency rollups; recent telemetry can take one rollup interval to appear.'
        db_source: postgres
        layout: { w: 6, h: 4 }
        columns:
          - field: operation
            title: Operation
          - field: calls
            title: Calls
            columnType: number
            progress: column_percent
          - field: avg_latency
            title: Avg Latency
            columnType: duration
            unit: ms
            progress: column_percent
          - field: error_rate
            title: Error Rate
            unit: '%'
            progress: value_percent
            progress_variant: error
        sql: |
          WITH rollup AS (
            SELECT bucket AS timestamp, target_key, req_count, error_count, sum_duration_ns
            FROM apis.endpoint_dependency_edges
            WHERE project_id='{{project_id}}' AND endpoint_hash='{{var-endpointHash}}'
          )
          SELECT
            target_key as operation,
            SUM(req_count)::text as calls,
            ROUND((SUM(sum_duration_ns)::numeric / NULLIF(SUM(req_count), 0) / 1e6), 2)::text as avg_latency,
            ROUND((SUM(error_count) * 100.0 / GREATEST(1, SUM(req_count)))::numeric, 2)::text as error_rate
          FROM rollup
          WHERE 1=1 {{time_filter}}
          GROUP BY target_key
          ORDER BY SUM(req_count) DESC
          LIMIT 20

      # Traces — the log explorer's own list, so rows expand into their span tree
      # and click through to the full detail panel.
      - type: logs
        title: 'Recent Traces'
        layout: { w: 12, h: 12 }
        query: |
          hashes[*]=="{{var-endpointHash}}"

  - name: Errors
    icon: alert-triangle
    widgets:
      - type: group
        title: Error Summary
        layout: { w: 12, h: 4 }
        children:
          - type: 'timeseries_stat'
            title: 'Server Errors (5xx)'
            icon: alert-triangle
            query: |
              hashes[*]=="{{var-endpointHash}}" AND attributes.http.response.status_code >= 500
              | summarize count() by bin_auto(timestamp)
            unit: errors
            alert_threshold: 1
            layout: { w: 4, h: 2 }

          - type: 'timeseries_stat'
            title: 'Client Errors (4xx)'
            icon: circle-x
            query: |
              hashes[*]=="{{var-endpointHash}}" AND attributes.http.response.status_code >= 400 AND attributes.http.response.status_code < 500
              | summarize count() by bin_auto(timestamp)
            unit: errors
            layout: { w: 4, h: 2 }

          - type: 'stat'
            title: 'Error Rate'
            icon: percent
            query: |
              hashes[*]=="{{var-endpointHash}}"
              | summarize round(countif(coalesce(attributes.http.response.status_code, 0) >= 400) * 100.0 / count(), 2)
            unit: '%'
            layout: { w: 4, h: 2 }

      - type: 'timeseries'
        title: 'Errors by Status Code'
        theme: 'roma'
        query: |
          hashes[*]=="{{var-endpointHash}}" AND attributes.http.response.status_code != null AND attributes.http.response.status_code >= 400.0
          | summarize count() by bin_auto(timestamp), coalesce(tostring(attributes.http.response.status_code), "unknown")
          | order by timestamp desc
          | limit 10000
        unit: errors
        layout: { w: 6, h: 4 }

      - type: 'timeseries'
        title: 'Errors by Exception Type'
        theme: 'roma'
        query: |
          hashes[*]=="{{var-endpointHash}}" AND (status_code == "ERROR" or coalesce(attributes.http.response.status_code, 0) >= 400)
          | summarize count() by bin_auto(timestamp), coalesce(attributes.exception.type, attributes.error.type, "unknown")
          | order by timestamp desc
          | limit 10000
        unit: errors
        layout: { w: 6, h: 4 }

      # Error traces
      - type: logs
        title: 'Error Traces'
        layout: { w: 12, h: 12 }
        query: |
          hashes[*]=="{{var-endpointHash}}" AND (status_code == "ERROR" or coalesce(attributes.http.response.status_code, 0) >= 400)

  - name: Latency
    icon: clock
    widgets:
      - type: group
        title: Latency Summary
        layout: { w: 12, h: 4 }
        children:
          - type: 'timeseries_stat'
            title: 'P50 Latency'
            icon: clock
            query: |
              hashes[*]=="{{var-endpointHash}}" AND duration != null
              | summarize p50(duration) / 1000000 by bin_auto(timestamp)
            summarize_by: mean
            unit: ms
            layout: { w: 3, h: 2 }

          - type: 'timeseries_stat'
            title: 'P75 Latency'
            icon: clock
            query: |
              hashes[*]=="{{var-endpointHash}}" AND duration != null
              | summarize p75(duration) / 1000000 by bin_auto(timestamp)
            summarize_by: mean
            unit: ms
            layout: { w: 3, h: 2 }

          - type: 'timeseries_stat'
            title: 'P95 Latency'
            icon: clock
            query: |
              hashes[*]=="{{var-endpointHash}}" AND duration != null
              | summarize p95(duration) / 1000000 by bin_auto(timestamp)
            summarize_by: mean
            unit: ms
            layout: { w: 3, h: 2 }

          - type: 'timeseries_stat'
            title: 'P99 Latency'
            icon: clock
            query: |
              hashes[*]=="{{var-endpointHash}}" AND duration != null
              | summarize p99(duration) / 1000000 by bin_auto(timestamp)
            summarize_by: mean
            unit: ms
            layout: { w: 3, h: 2 }

      - type: 'timeseries_line'
        title: 'Latency Percentiles Over Time'
        hide_subtitle: true
        summarize_by: max
        query: |
          hashes[*]=="{{var-endpointHash}}" AND duration != null
          | summarize percentiles(duration / 1e6, 50, 75, 90, 95, 99) by bin_auto(timestamp)
          | order by timestamp desc
        unit: ms
        layout: { w: 12, h: 5 }

      - type: 'timeseries'
        title: 'Time Spent by Downstream Operations'
        description: 'Where time is spent inside this endpoint. Helps identify slow DB queries or external calls.'
        sql: |
          WITH endpoint_spans AS (
            SELECT
              extract(epoch from time_bucket('{{rollup_interval}}', timestamp))::integer AS time,
              context___span_id as span_id,
              context___trace_id as trace_id
            FROM otel_logs_and_spans
            WHERE project_id='{{project_id}}'
              AND hashes @> ARRAY['{{var-endpointHash}}']
              {{time_filter}}
          ),
          downstream_time AS (
            SELECT
              es.time,
              o.name as operation,
              SUM(o.duration)::float as duration_ns
            FROM otel_logs_and_spans o
            INNER JOIN endpoint_spans es ON o.context___trace_id = es.trace_id
            WHERE o.project_id='{{project_id}}'
              AND o.parent_id = es.span_id
              AND o.duration IS NOT NULL
              AND o.name IS NOT NULL
              {{time_filter}}
            GROUP BY es.time, o.name
          )
          SELECT time, operation, duration_ns as value
          FROM downstream_time
          ORDER BY time DESC
          LIMIT 10000
        unit: ns
        layout: { w: 12, h: 5 }

      # Slowest traces
      - type: logs
        title: 'Slowest Traces'
        layout: { w: 12, h: 12 }
        query: |
          hashes[*]=="{{var-endpointHash}}" AND duration != null | sort by duration desc

  - name: Operations
    icon: sitemap
    widgets:
      - type: group
        title: Operation Diagnostics
        layout: { w: 12, h: 4 }
        children:
          - type: 'timeseries_stat'
            title: 'Traces'
            icon: route
            query: |
              hashes[*]=="{{var-endpointHash}}"
              | summarize count() by bin_auto(timestamp)
            unit: traces
            layout: { w: 3, h: 2 }

          - type: 'timeseries_stat'
            title: 'Failed Traces'
            icon: circle-x
            query: |
              hashes[*]=="{{var-endpointHash}}" AND (status_code == "ERROR" or coalesce(attributes.http.response.status_code, 0) >= 500)
              | summarize count() by bin_auto(timestamp)
            unit: traces
            alert_threshold: 1
            layout: { w: 3, h: 2 }

          - type: 'timeseries_stat'
            title: 'Average Duration'
            icon: timer
            query: |
              hashes[*]=="{{var-endpointHash}}" AND duration != null
              | summarize avg(duration) / 1000000 by bin_auto(timestamp)
            unit: ms
            layout: { w: 3, h: 2 }

          - type: 'timeseries_stat'
            title: 'Distinct Operations'
            icon: list-tree
            query: |
              hashes[*]=="{{var-endpointHash}}" AND name != null
              | summarize dcount(name) by bin_auto(timestamp)
            unit: operations
            layout: { w: 3, h: 2 }

      - type: top_list
        title: 'Most Frequent Operations'
        description: 'Recorded span names for requests attributed to this endpoint.'
        query: |
          hashes[*]=="{{var-endpointHash}}" AND name != null
          | summarize count() by name
          | order by count_ desc
          | limit 12
        layout: { w: 6, h: 4 }

      - type: top_list
        title: 'Slowest Operations'
        description: 'Average duration highlights operations worth investigating first.'
        query: |
          hashes[*]=="{{var-endpointHash}}" AND name != null AND duration != null
          | summarize avg_latency=avg(duration) by name
          | order by avg_latency desc
          | limit 12
        unit: ns
        layout: { w: 6, h: 4 }

      - type: timeseries
        title: 'Operation Volume Over Time'
        query: |
          hashes[*]=="{{var-endpointHash}}" AND name != null
          | summarize count() by bin_auto(timestamp), name
          | order by timestamp desc
          | limit 10000
        unit: operations
        layout: { w: 12, h: 5 }

      - type: logs
        title: 'Recent Operation Traces'
        description: 'Open a trace to inspect its operation tree and attributes.'
        layout: { w: 12, h: 12 }
        query: |
          hashes[*]=="{{var-endpointHash}}"

  - name: Experience
    icon: web
    widgets:
      - type: group
        title: Real-user impact
        description: Browser telemetry correlated to this endpoint. Empty panels mean browser spans, session IDs, or replay have not been linked to this endpoint yet.
        layout: { w: 12, h: 4 }
        children:
          - type: timeseries_stat
            title: Browser Sessions
            description: Estimated unique browser sessions observed in each time bucket. Use Endpoint Sessions below for the exact session list.
            icon: users
            query: |
              hashes[*]=="{{var-endpointHash}}" AND (resource.telemetry.sdk.language in ("webjs", "javascript", "js") or resource.user_agent.original != "" or name in ("documentLoad", "documentFetch") or name startswith "Pageview ") AND attributes.session.id != null
              | summarize dcount(attributes.session.id) by bin_auto(timestamp)
            unit: sessions
            summarize_by: sum
            layout: { w: 3, h: 2 }

          - type: timeseries_stat
            title: Browser Errors
            icon: triangle-exclamation
            query: |
              hashes[*]=="{{var-endpointHash}}" AND (resource.telemetry.sdk.language in ("webjs", "javascript", "js") or resource.user_agent.original != "" or name in ("documentLoad", "documentFetch") or name startswith "Pageview ") AND (status_code == "ERROR" or level in ("ERROR", "FATAL", "error", "fatal") or attributes.exception.type != null)
              | summarize count() by bin_auto(timestamp)
            unit: errors
            layout: { w: 3, h: 2 }

          - type: timeseries_stat
            title: P75 Browser Request
            icon: gauge
            query: |
              hashes[*]=="{{var-endpointHash}}" AND (resource.telemetry.sdk.language in ("webjs", "javascript", "js") or resource.user_agent.original != "" or name in ("documentLoad", "documentFetch") or name startswith "Pageview ") AND duration != null
              | summarize p75(duration) / 1000000 by bin_auto(timestamp)
            unit: ms
            layout: { w: 3, h: 2 }

          - type: timeseries_stat
            title: Sessions with Errors
            description: Estimated unique browser sessions that saw an error in each time bucket.
            icon: triangle-exclamation
            query: |
              hashes[*]=="{{var-endpointHash}}" AND (resource.telemetry.sdk.language in ("webjs", "javascript", "js") or resource.user_agent.original != "" or name in ("documentLoad", "documentFetch") or name startswith "Pageview ") AND attributes.session.id != null AND (status_code == "ERROR" or level in ("ERROR", "FATAL", "error", "fatal") or attributes.exception.type != null)
              | summarize dcount(attributes.session.id) by bin_auto(timestamp)
            unit: sessions
            summarize_by: sum
            layout: { w: 3, h: 2 }

      - type: timeseries
        title: Browser Request Outcomes
        description: Requests made by real browsers, split into non-error requests and errors so a traffic change is not mistaken for an error change.
        query: |
          hashes[*]=="{{var-endpointHash}}" AND (resource.telemetry.sdk.language in ("webjs", "javascript", "js") or resource.user_agent.original != "" or name in ("documentLoad", "documentFetch") or name startswith "Pageview ")
          | summarize count() by bin_auto(timestamp), iff(status_code == "ERROR" or level in ("ERROR", "FATAL", "error", "fatal") or attributes.exception.type != null, "Errors", "Non-error requests")
          | order by timestamp desc
          | limit 10000
        unit: requests
        layout: { w: 7, h: 5 }

      - type: table
        title: Affected Browser Pages
        description: Browser routes that made calls to this endpoint, with their observed failures and request latency.
        layout: { w: 5, h: 5 }
        columns:
          - field: page
            title: Page
          - field: requests
            title: Requests
            columnType: number
            progress: column_percent
          - field: errors
            title: Errors
            columnType: number
            progress: column_percent
            progress_variant: error
          - field: p75_ms
            title: P75
            columnType: duration
            unit: ms
        sql: |
          SELECT
            COALESCE(NULLIF(attributes___url___path, ''), NULLIF(attributes___url___full, ''), NULLIF(replace(name, 'Pageview · ', ''), ''), 'Unknown page') AS page,
            COUNT(*)::text AS requests,
            COUNT(*) FILTER (WHERE status_code = 'ERROR' OR lower(COALESCE(level, '')) = 'error' OR attributes___exception___type IS NOT NULL)::text AS errors,
            ROUND((approx_percentile(0.75, percentile_agg(duration)) / 1000000.0)::numeric, 1)::text AS p75_ms
          FROM otel_logs_and_spans
          WHERE project_id='{{project_id}}'
            AND hashes @> ARRAY['{{var-endpointHash}}']
            AND (resource___telemetry___sdk___language IN ('webjs', 'javascript', 'js') OR COALESCE(resource___user_agent___original, '') <> '' OR name IN ('documentLoad', 'documentFetch') OR name LIKE 'Pageview %')
            {{time_filter}}
          GROUP BY page ORDER BY COUNT(*) DESC LIMIT 20

      - type: table
        title: Endpoint Sessions
        description: Select a session to inspect its correlated OpenTelemetry events in Real User Monitoring; the replay workspace opens when a recording is available.
        db_source: postgres
        layout: { w: 12, h: 6 }
        columns:
          - field: session_id
            title: Session
            link: '/p/{{project_id}}/rum?tab=sessions&session={{row.session_id}}'
          - field: last_page
            title: Last Page
          - field: replay
            title: Replay
          - field: errors
            title: Errors
            columnType: number
            progress: column_percent
            progress_variant: error
          - field: last_seen
            title: Last Seen
        sql: |
          SELECT
            browser.attributes___session___id AS session_id,
            COALESCE(MAX(NULLIF(browser.attributes___url___path, '')), MAX(NULLIF(browser.attributes___url___full, '')), MAX(NULLIF(replace(browser.name, 'Pageview · ', ''), '')), 'Unknown page') AS last_page,
            CASE WHEN BOOL_OR(replay.session_id IS NOT NULL) THEN 'Available' ELSE 'Not recorded' END AS replay,
            COUNT(*) FILTER (WHERE browser.status_code = 'ERROR' OR lower(COALESCE(browser.level, '')) = 'error' OR browser.attributes___exception___type IS NOT NULL)::text AS errors,
            MAX(browser.timestamp)::text AS last_seen
          FROM otel_logs_and_spans browser
          LEFT JOIN projects.replay_sessions replay
            ON CAST(replay.project_id AS TEXT) = browser.project_id
            AND CAST(replay.session_id AS TEXT) = browser.attributes___session___id
            AND (replay.event_file_count > 0 OR cardinality(replay.file_keys) > 0 OR cardinality(replay.shard_keys) > 0)
          WHERE browser.project_id='{{project_id}}'
            AND browser.hashes @> ARRAY['{{var-endpointHash}}']
            AND (browser.resource___telemetry___sdk___language IN ('webjs', 'javascript', 'js') OR COALESCE(browser.resource___user_agent___original, '') <> '' OR browser.name IN ('documentLoad', 'documentFetch') OR browser.name LIKE 'Pageview %')
            AND browser.attributes___session___id IS NOT NULL
            AND browser.attributes___session___id <> ''
            {{time_filter}}
          GROUP BY browser.attributes___session___id
          ORDER BY MAX(browser.timestamp) DESC LIMIT 50

      - type: table
        title: Browser Cohorts
        description: Browser identities observed on requests to this endpoint. Unknown means the browser SDK did not provide a user-agent identity; it is not a separate user cohort.
        db_source: postgres
        layout: { w: 12, h: 5 }
        columns:
          - field: browser
            title: Browser
          - field: sessions
            title: Sessions
            columnType: number
            progress: column_percent
          - field: requests
            title: Requests
            columnType: number
            progress: column_percent
          - field: errors
            title: Errors
            columnType: number
            progress: column_percent
            progress_variant: error
          - field: p75_ms
            title: P75
            columnType: duration
            unit: ms
        sql: |
          SELECT
            CASE
              WHEN resource___user_agent___original IS NULL OR resource___user_agent___original = '' THEN 'Unknown browser'
              WHEN lower(resource___user_agent___original) LIKE '%edg/%' THEN 'Edge'
              WHEN lower(resource___user_agent___original) LIKE '%opr/%' OR lower(resource___user_agent___original) LIKE '%opera%' THEN 'Opera'
              WHEN lower(resource___user_agent___original) LIKE '%firefox/%' THEN 'Firefox'
              WHEN lower(resource___user_agent___original) LIKE '%chrome/%' OR lower(resource___user_agent___original) LIKE '%crios/%' THEN 'Chrome'
              WHEN lower(resource___user_agent___original) LIKE '%safari/%' THEN 'Safari'
              ELSE 'Other browser'
            END AS browser,
            COUNT(DISTINCT NULLIF(attributes___session___id, ''))::text AS sessions,
            COUNT(*)::text AS requests,
            COUNT(*) FILTER (WHERE status_code = 'ERROR' OR lower(COALESCE(level, '')) = 'error' OR attributes___exception___type IS NOT NULL)::text AS errors,
            ROUND((approx_percentile(0.75, percentile_agg(duration)) / 1000000.0)::numeric, 1)::text AS p75_ms
          FROM otel_logs_and_spans
          WHERE project_id='{{project_id}}'
            AND hashes @> ARRAY['{{var-endpointHash}}']
            AND (resource___telemetry___sdk___language IN ('webjs', 'javascript', 'js') OR COALESCE(resource___user_agent___original, '') <> '' OR name IN ('documentLoad', 'documentFetch') OR name LIKE 'Pageview %')
            {{time_filter}}
          GROUP BY browser
          ORDER BY COUNT(*) DESC LIMIT 20

      - type: table
        title: Request-linked Web Vitals
        description: Web Vitals are shown only when the browser SDK puts the same session ID on both an endpoint request and a vital sample. Empty results mean this correlation attribute is not being emitted; use the RUM dashboard for page-level vitals.
        db_source: postgres
        layout: { w: 12, h: 5 }
        columns:
          - field: vital
            title: Vital
          - field: p75
            title: P75
            columnType: number
          - field: samples
            title: Correlated Samples
            columnType: number
          - field: sessions
            title: Affected Sessions
            columnType: number
        sql: |
          WITH endpoint_sessions AS (
            SELECT DISTINCT attributes___session___id AS session_id
            FROM otel_logs_and_spans
            WHERE project_id='{{project_id}}'
              AND hashes @> ARRAY['{{var-endpointHash}}']
              AND attributes___session___id IS NOT NULL
              AND attributes___session___id <> ''
              AND (resource___telemetry___sdk___language IN ('webjs', 'javascript', 'js') OR COALESCE(resource___user_agent___original, '') <> '' OR name IN ('documentLoad', 'documentFetch') OR name LIKE 'Pageview %')
              {{time_filter}}
          ), vital_samples AS (
            SELECT
              metric_name,
              COALESCE(attributes->>'session.id', attributes->>'session_id') AS session_id,
              COALESCE(value, distribution_sum / NULLIF(distribution_count, 0)) AS vital_value
            FROM otel_metrics
            WHERE project_id='{{project_id}}'
              AND metric_name IN ('browser.web_vital.lcp', 'browser.web_vital.inp', 'browser.web_vital.cls', 'browser.web_vital.fcp', 'browser.web_vital.ttfb', 'k6.browser_web_vital_lcp', 'k6.browser_web_vital_inp', 'k6.browser_web_vital_cls', 'k6.browser_web_vital_fcp', 'k6.browser_web_vital_ttfb')
              {{time_filter}}
          )
          SELECT
            replace(replace(metric_name, 'browser.web_vital.', ''), 'k6.browser_web_vital_', '') AS vital,
            ROUND((approx_percentile(0.75, percentile_agg(vital_value)))::numeric, 2)::text AS p75,
            COUNT(*)::text AS samples,
            COUNT(DISTINCT vital_samples.session_id)::text AS sessions
          FROM vital_samples
          INNER JOIN endpoint_sessions ON endpoint_sessions.session_id = vital_samples.session_id
          WHERE vital_value IS NOT NULL
          GROUP BY metric_name
          ORDER BY COUNT(*) DESC

      - type: logs
        title: Browser Traces for This Endpoint
        description: Open a trace to inspect the browser request, session ID, and correlated server spans.
        layout: { w: 12, h: 12 }
        query: |
          hashes[*]=="{{var-endpointHash}}" AND (resource.telemetry.sdk.language in ("webjs", "javascript", "js") or resource.user_agent.original != "" or name in ("documentLoad", "documentFetch") or name startswith "Pageview ")

  - name: Dependencies
    icon: sitemap
    widgets:
      - type: service_map
        id: endpoint-dependency-map
        title: Endpoint Dependency Map
        description: Direct downstream services, databases, queues, and external calls for this endpoint. Health bars show errors; node cards show call rate and tail latency. Select a node to inspect its traces or open the scoped Service Map.
        layout: { w: 12, h: 10 }

      - type: table
        title: Downstream health
        description: Direct dependencies, including inferred databases, queues, and external services. The five-minute rollup keeps this tab bounded; its latency is cumulative call time.
        db_source: postgres
        layout: { w: 12, h: 3 }
        columns:
          - field: operations
            title: Operations
            columnType: number
          - field: error_rate
            title: Error Rate
            unit: '%'
            progress: value_percent
            progress_variant: error
          - field: avg_ms
            title: Avg Call Time
            columnType: duration
            unit: ms
          - field: traces
            title: Affected Traces
            columnType: number
        sql: |
          WITH rollup AS (
            SELECT bucket AS timestamp, target_key, req_count, trace_count, error_count, sum_duration_ns
            FROM apis.endpoint_dependency_edges
            WHERE project_id='{{project_id}}' AND endpoint_hash='{{var-endpointHash}}'
          )
          SELECT
            COUNT(DISTINCT target_key)::text AS operations,
            ROUND((SUM(error_count) * 100.0 / GREATEST(1, SUM(req_count)))::numeric, 2)::text AS error_rate,
            ROUND((SUM(sum_duration_ns)::numeric / NULLIF(SUM(req_count), 0) / 1e6), 1)::text AS avg_ms,
            SUM(trace_count)::text AS traces
          FROM rollup
          WHERE 1=1 {{time_filter}}

      - type: table
        title: Dependency Regressions
        description: Prioritize direct dependencies by failures, average call time, and affected traces. Open a trace below for source evidence.
        db_source: postgres
        layout: { w: 12, h: 6 }
        columns:
          - field: operation
            title: Dependency / Operation
            link: '/p/{{project_id}}/service_map'
          - field: traces
            title: Traces
            columnType: number
            progress: column_percent
          - field: error_rate
            title: Error Rate
            unit: '%'
            progress: value_percent
            progress_variant: error
          - field: p95_ms
            title: P95 Call Time
            columnType: duration
            unit: ms
          - field: avg_ms
            title: Average
            columnType: duration
            unit: ms
        sql: |
          WITH rollup AS (
            SELECT bucket AS timestamp, target_key, req_count, trace_count, error_count, sum_duration_ns, lat_hist
            FROM apis.endpoint_dependency_edges
            WHERE project_id='{{project_id}}' AND endpoint_hash='{{var-endpointHash}}'
          ), totals AS (
            SELECT target_key, SUM(req_count) AS req_count, SUM(trace_count) AS trace_count,
              SUM(error_count) AS error_count, SUM(sum_duration_ns) AS sum_duration_ns
            FROM rollup WHERE 1=1 {{time_filter}} GROUP BY target_key
          ), hist AS (
            SELECT target_key, key::int AS bucket, SUM(value::bigint) AS n
            FROM rollup CROSS JOIN LATERAL jsonb_each_text(lat_hist)
            WHERE 1=1 {{time_filter}} GROUP BY target_key, key
          ), ranked AS (
            SELECT target_key, bucket, SUM(n) OVER (PARTITION BY target_key ORDER BY bucket) AS cumulative,
              SUM(n) OVER (PARTITION BY target_key) AS total
            FROM hist
          ), p95 AS (
            SELECT DISTINCT ON (target_key) target_key,
              ROUND((1000 * POWER(2, (bucket + 1) / 4.0) / 1000000.0)::numeric, 1)::text AS p95_ms
            FROM ranked WHERE cumulative >= total * 0.95 ORDER BY target_key, bucket
          )
          SELECT
            t.target_key AS operation, t.trace_count::text AS traces,
            ROUND((t.error_count * 100.0 / GREATEST(1, t.req_count))::numeric, 2)::text AS error_rate,
            p.p95_ms,
            ROUND((t.sum_duration_ns::numeric / NULLIF(t.req_count, 0) / 1000000.0)::numeric, 1)::text AS avg_ms
          FROM totals t LEFT JOIN p95 p USING (target_key)
          ORDER BY t.error_count DESC, t.sum_duration_ns / NULLIF(t.req_count, 0) DESC
          LIMIT 30

      - type: timeseries
        title: Downstream Time by Operation
        description: Cumulative direct-dependency call time. Parallel calls can make this exceed endpoint wall-clock time.
        db_source: postgres
        sql: |
          WITH rollup AS (
            SELECT bucket AS timestamp, bucket, target_key, sum_duration_ns
            FROM apis.endpoint_dependency_edges
            WHERE project_id='{{project_id}}' AND endpoint_hash='{{var-endpointHash}}'
          )
          SELECT extract(epoch from bucket)::integer AS time, target_key AS operation, SUM(sum_duration_ns)::float AS value
          FROM rollup
          WHERE 1=1 {{time_filter}}
          GROUP BY bucket, target_key ORDER BY bucket DESC LIMIT 10000
        unit: ns
        layout: { w: 12, h: 5 }

      - type: logs
        title: Dependency Traces
        description: Open a trace to follow the selected endpoint through its direct child calls. Select a dependency name above for the project-wide Service Map.
        layout: { w: 12, h: 12 }
        query: |
          hashes[*]=="{{var-endpointHash}}"
