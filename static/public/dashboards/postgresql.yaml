title: PostgreSQL
icon: postgres
preview: /public/assets/svgs/screens/http-stats.svg
description: PostgreSQL health — throughput, connections, cache efficiency, locks, autovacuum, and replication (OpenTelemetry postgresql receiver)
refresh_interval: 60s
tags: [database]
discovery_metrics:
  - 'postgresql.'
widgets:
  - type: group
    title: Overview
    layout: { w: 12, h: 3 }
    children:
      - type: 'timeseries_stat'
        title: 'Active Connections'
        icon: swap
        query: metrics | where metric_name == "postgresql.backends" | summarize avg(value) by bin_auto(timestamp)
        unit: connections
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Max Connections'
        icon: database
        query: metrics | where metric_name == "postgresql.connection.max" | summarize avg(value)
        unit: connections
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Databases'
        icon: database
        query: metrics | where metric_name == "postgresql.database.count" | summarize avg(value)
        unit: dbs
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'WAL Age'
        icon: clock
        query: metrics | where metric_name == "postgresql.wal.age" | summarize avg(value)
        unit: s
        eager: true
        layout: { w: 3, h: 2 }

  - type: 'timeseries'
    title: 'Transactions (commits vs rollbacks)'
    description: 'Increase per interval. A rising rollback share usually means application errors or deadlocks.'
    query: metrics | where metric_name in ("postgresql.commits", "postgresql.rollbacks") | summarize range(value) by bin_auto(timestamp), metric_name
    unit: txn
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Connections by Database'
    query: metrics | where metric_name == "postgresql.backends" | summarize avg(value) by bin_auto(timestamp), attributes.db.namespace
    unit: connections
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Block Reads by Source'
    description: 'heap_hit vs heap_read shows buffer-cache effectiveness: hits should dwarf disk reads.'
    query: metrics | where metric_name == "postgresql.blocks_read" | summarize range(value) by bin_auto(timestamp), attributes.source
    unit: blocks
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Row Operations'
    query: metrics | where metric_name == "postgresql.operations" | summarize range(value) by bin_auto(timestamp), attributes.operation
    unit: rows
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Live vs Dead Rows'
    description: 'Growing dead-row count means autovacuum is not keeping up.'
    query: metrics | where metric_name == "postgresql.rows" | summarize avg(value) by bin_auto(timestamp), attributes.state
    unit: rows
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Vacuum Operations by Table'
    query: metrics | where metric_name == "postgresql.table.vacuum.count" | summarize range(value) by bin_auto(timestamp), attributes.db.collection.name
    unit: vacuums
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Database Size'
    query: metrics | where metric_name == "postgresql.db_size" | summarize avg(value) / 1048576 by bin_auto(timestamp), attributes.db.namespace
    unit: MB
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Index Scans by Table'
    query: metrics | where metric_name == "postgresql.index.scans" | summarize range(value) by bin_auto(timestamp), attributes.db.collection.name
    unit: scans
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Checkpoints'
    description: 'Frequent requested (non-scheduled) checkpoints indicate max_wal_size is too small.'
    query: metrics | where metric_name == "postgresql.bgwriter.checkpoint.count" | summarize range(value) by bin_auto(timestamp), attributes.type
    unit: checkpoints
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Buffers Written by Source'
    query: metrics | where metric_name == "postgresql.bgwriter.buffers.writes" | summarize range(value) by bin_auto(timestamp), attributes.source
    unit: buffers
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Replication Lag'
    theme: 'roma'
    description: 'WAL flush/replay/write lag per replication client.'
    query: metrics | where metric_name == "postgresql.wal.lag" | summarize avg(value) by bin_auto(timestamp), attributes.operation
    unit: s
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Query Duration from Traces'
    description: 'Latency percentiles of postgresql client spans (requires DB tracing instrumentation).'
    hide_subtitle: true
    summarize_by: max
    query: attributes.db.system.name == "postgresql" and duration != null | summarize percentiles(duration / 1000000, 50, 75, 90, 95, 99) by bin_auto(timestamp)
    unit: ms
    layout: { w: 6, h: 4 }
