title: Host / System Metrics
icon: prometheus
preview: /public/assets/svgs/screens/http-stats.svg
description: Host health — CPU, load, memory, disk I/O, filesystem, network, and paging (OpenTelemetry hostmetrics receiver)
refresh_interval: 60s
tags: [infrastructure]
discovery_metrics:
  - 'system.'
widgets:
  - type: group
    title: Overview
    layout: { w: 12, h: 3 }
    children:
      - type: 'timeseries_stat'
        title: 'Load (1m)'
        icon: chart-simple
        query: metrics | where metric_name == "system.cpu.load_average.1m" | summarize avg(value) by bin_auto(timestamp)
        unit: load
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'CPU Cores'
        icon: server
        query: metrics | where metric_name == "system.cpu.logical.count" | summarize avg(value)
        unit: cores
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Memory Used'
        icon: server
        query: metrics | where metric_name == "system.memory.usage" and attributes.state == "used" | summarize avg(value) / 1073741824
        unit: GB
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Processes Running'
        icon: activity
        query: metrics | where metric_name == "system.processes.count" and attributes.status == "running" | summarize avg(value)
        unit: procs
        eager: true
        layout: { w: 3, h: 2 }

  - type: 'timeseries'
    title: 'CPU Time by State'
    description: 'Seconds of CPU spent per state per interval. Watch for growing wait (I/O stall) or steal (noisy neighbor).'
    query: metrics | where metric_name == "system.cpu.time" and attributes.state != "idle" | summarize range(value) by bin_auto(timestamp), attributes.state
    unit: s
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'CPU Utilization by State'
    description: 'Requires the optional system.cpu.utilization metric to be enabled on the hostmetrics cpu scraper.'
    query: metrics | where metric_name == "system.cpu.utilization" and attributes.state != "idle" | summarize avg(value) * 100 by bin_auto(timestamp), attributes.state
    unit: '%'
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Load Average'
    query: metrics | where metric_name in ("system.cpu.load_average.1m", "system.cpu.load_average.5m", "system.cpu.load_average.15m") | summarize avg(value) by bin_auto(timestamp), metric_name
    unit: load
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Memory by State'
    query: metrics | where metric_name == "system.memory.usage" | summarize avg(value) / 1073741824 by bin_auto(timestamp), attributes.state
    unit: GB
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Disk Throughput'
    query: metrics | where metric_name == "system.disk.io" | summarize range(value) / 1048576 by bin_auto(timestamp), attributes.direction
    unit: MB
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Disk Operations'
    query: metrics | where metric_name == "system.disk.operations" | summarize range(value) by bin_auto(timestamp), attributes.direction
    unit: ops
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Disk Busy Time by Device'
    description: 'Seconds the disk spent servicing I/O per interval — near the full interval means the device is saturated.'
    query: metrics | where metric_name == "system.disk.io_time" | summarize range(value) by bin_auto(timestamp), attributes.device
    unit: s
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Filesystem Used by Mountpoint'
    query: metrics | where metric_name == "system.filesystem.usage" and attributes.state == "used" | summarize avg(value) / 1073741824 by bin_auto(timestamp), attributes.mountpoint
    unit: GB
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Network Throughput'
    query: metrics | where metric_name == "system.network.io" | summarize range(value) / 1048576 by bin_auto(timestamp), attributes.direction
    unit: MB
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Network Errors & Drops'
    theme: 'roma'
    query: metrics | where metric_name in ("system.network.errors", "system.network.dropped") | summarize range(value) by bin_auto(timestamp), metric_name
    unit: packets
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'TCP Connections by State'
    query: metrics | where metric_name == "system.network.connections" | summarize avg(value) by bin_auto(timestamp), attributes.state
    unit: connections
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Paging Operations'
    description: 'Sustained page_out (swap-out) activity means the host is memory-starved.'
    query: metrics | where metric_name == "system.paging.operations" | summarize range(value) by bin_auto(timestamp), attributes.direction
    unit: ops
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Processes by Status'
    query: metrics | where metric_name == "system.processes.count" | summarize avg(value) by bin_auto(timestamp), attributes.status
    unit: procs
    layout: { w: 6, h: 4 }
