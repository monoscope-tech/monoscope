title: Docker Containers
icon: docker
preview: /public/assets/svgs/screens/http-stats.svg
description: Per-container CPU, memory, network, and block I/O (OpenTelemetry docker_stats receiver)
refresh_interval: 60s
tags: [infrastructure]
discovery_metrics:
  - 'container.blockio.'
  - 'container.cpu.usage.total'
  - 'container.memory.percent'
widgets:
  - type: group
    title: Overview
    layout: { w: 12, h: 3 }
    children:
      - type: 'timeseries_stat'
        title: 'Containers Reporting'
        icon: server
        query: metrics | where metric_name == "container.cpu.utilization" | summarize dcount(resource.container.name) by bin_auto(timestamp)
        unit: containers
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Avg CPU'
        icon: chart-simple
        query: metrics | where metric_name == "container.cpu.utilization" | summarize avg(value) * 100
        unit: '%'
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Avg Memory'
        icon: server
        query: metrics | where metric_name == "container.memory.percent" | summarize avg(value)
        unit: '%'
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Memory Used (all containers, avg)'
        icon: database
        query: metrics | where metric_name == "container.memory.usage.total" | summarize avg(value) / 1048576
        unit: MB
        eager: true
        layout: { w: 3, h: 2 }

  - type: 'timeseries_line'
    title: 'CPU by Container'
    query: metrics | where metric_name == "container.cpu.utilization" | summarize avg(value) * 100 by bin_auto(timestamp), resource.container.name
    unit: '%'
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Memory % of Limit by Container'
    description: 'Containers near 100% are about to be OOM-killed.'
    query: metrics | where metric_name == "container.memory.percent" | summarize avg(value) by bin_auto(timestamp), resource.container.name
    unit: '%'
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Memory Usage by Container'
    query: metrics | where metric_name == "container.memory.usage.total" | summarize avg(value) / 1048576 by bin_auto(timestamp), resource.container.name
    unit: MB
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Network Received by Container'
    query: metrics | where metric_name == "container.network.io.usage.rx_bytes" | summarize range(value) / 1048576 by bin_auto(timestamp), resource.container.name
    unit: MB
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Network Transmitted by Container'
    query: metrics | where metric_name == "container.network.io.usage.tx_bytes" | summarize range(value) / 1048576 by bin_auto(timestamp), resource.container.name
    unit: MB
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Dropped Packets'
    theme: 'roma'
    query: metrics | where metric_name in ("container.network.io.usage.rx_dropped", "container.network.io.usage.tx_dropped") | summarize range(value) by bin_auto(timestamp), metric_name
    unit: packets
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Block I/O by Operation'
    query: metrics | where metric_name == "container.blockio.io_service_bytes_recursive" | summarize range(value) / 1048576 by bin_auto(timestamp), attributes.operation
    unit: MB
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'CPU Time (kernel vs user)'
    query: metrics | where metric_name in ("container.cpu.usage.kernelmode", "container.cpu.usage.usermode") | summarize range(value) / 1000000000 by bin_auto(timestamp), metric_name
    unit: s
    layout: { w: 6, h: 4 }
