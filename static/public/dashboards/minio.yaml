title: MinIO
icon: minio
preview: /public/assets/svgs/screens/http-stats.svg
description: Cluster capacity, S3 request throughput/errors, and node/drive health (MinIO Prometheus v2 cluster endpoint)
refresh_interval: 60s
tags: [infrastructure]
discovery_metrics:
  - 'minio_'
widgets:
  - type: group
    title: Overview
    layout: { w: 12, h: 3 }
    children:
      - type: 'timeseries_stat'
        title: 'S3 Requests'
        icon: list-tree
        query: metrics | where metric_name == "minio_s3_requests_total" | summarize range(value) by bin_auto(timestamp)
        unit: reqs
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Usable Free'
        icon: database
        query: metrics | where metric_name == "minio_cluster_capacity_usable_free_bytes" | summarize avg(value) / 1073741824
        unit: GB
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Data Stored'
        icon: folders
        query: metrics | where metric_name == "minio_cluster_usage_total_bytes" | summarize avg(value) / 1073741824
        unit: GB
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Offline Drives'
        icon: alert-triangle
        query: metrics | where metric_name == "minio_cluster_drive_offline_total" | summarize avg(value)
        unit: drives
        eager: true
        layout: { w: 3, h: 2 }

  - type: 'timeseries'
    title: 'S3 Requests by API'
    query: metrics | where metric_name == "minio_s3_requests_total" | summarize range(value) by bin_auto(timestamp), attributes.api
    unit: reqs
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'S3 Errors by API'
    theme: 'roma'
    query: metrics | where metric_name == "minio_s3_requests_errors_total" | summarize range(value) by bin_auto(timestamp), attributes.api
    unit: errors
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'S3 Traffic'
    query: metrics | where metric_name in ("minio_s3_traffic_received_bytes", "minio_s3_traffic_sent_bytes") | summarize range(value) / 1048576 by bin_auto(timestamp), metric_name
    unit: MB
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Cluster Capacity (usable total vs free)'
    query: metrics | where metric_name in ("minio_cluster_capacity_usable_total_bytes", "minio_cluster_capacity_usable_free_bytes") | summarize avg(value) / 1073741824 by bin_auto(timestamp), metric_name
    unit: GB
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Objects Stored'
    query: metrics | where metric_name == "minio_cluster_usage_object_total" | summarize avg(value) by bin_auto(timestamp)
    unit: objects
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Nodes & Drives Online/Offline'
    theme: 'roma'
    query: metrics | where metric_name in ("minio_cluster_nodes_online_total", "minio_cluster_nodes_offline_total", "minio_cluster_drive_online_total", "minio_cluster_drive_offline_total") | summarize avg(value) by bin_auto(timestamp), metric_name
    unit: count
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Waiting S3 Requests'
    description: 'Requests queued behind the API rate limiter — a saturation signal.'
    query: metrics | where metric_name == "minio_s3_requests_waiting_total" | summarize avg(value) by bin_auto(timestamp)
    unit: reqs
    layout: { w: 6, h: 4 }
