title: HAProxy
icon: haproxy
preview: /public/assets/svgs/screens/http-stats.svg
description: Frontend/backend traffic, response codes, errors, and session load per proxy (OpenTelemetry haproxy receiver)
refresh_interval: 60s
tags: [infrastructure]
discovery_metrics:
  - 'haproxy.'
widgets:
  - type: group
    title: Overview
    layout: { w: 12, h: 3 }
    children:
      - type: 'timeseries_stat'
        title: 'Requests'
        icon: list-tree
        query: metrics | where metric_name == "haproxy.requests.total" | summarize range(value) by bin_auto(timestamp)
        unit: reqs
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Request Rate'
        icon: activity
        query: metrics | where metric_name == "haproxy.requests.rate" | summarize avg(value)
        unit: req/s
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Sessions'
        icon: swap
        query: metrics | where metric_name == "haproxy.sessions.count" | summarize avg(value)
        unit: sessions
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Avg Session Time'
        icon: clock
        query: metrics | where metric_name == "haproxy.sessions.average" | summarize avg(value)
        unit: ms
        eager: true
        layout: { w: 3, h: 2 }

  - type: 'timeseries'
    title: 'Requests by Status Class'
    query: metrics | where metric_name == "haproxy.requests.total" | summarize range(value) by bin_auto(timestamp), attributes.status_code
    unit: reqs
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Errors (connections, requests, responses)'
    theme: 'roma'
    query: metrics | where metric_name in ("haproxy.connections.errors", "haproxy.requests.errors", "haproxy.responses.errors") | summarize range(value) by bin_auto(timestamp), metric_name
    unit: errors
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Traffic In/Out'
    query: metrics | where metric_name in ("haproxy.bytes.input", "haproxy.bytes.output") | summarize range(value) / 1048576 by bin_auto(timestamp), metric_name
    unit: MB
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Denied & Redispatched'
    theme: 'roma'
    description: 'Denied = ACL blocks; redispatched = server failures forcing re-routing; retries = flaky upstream connections.'
    query: metrics | where metric_name in ("haproxy.requests.denied", "haproxy.responses.denied", "haproxy.requests.redispatched", "haproxy.connections.retries") | summarize range(value) by bin_auto(timestamp), metric_name
    unit: events
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Sessions by Proxy'
    query: metrics | where metric_name == "haproxy.sessions.count" | summarize avg(value) by bin_auto(timestamp), resource.haproxy.proxy_name
    unit: sessions
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Requests by Proxy'
    query: metrics | where metric_name == "haproxy.requests.total" | summarize range(value) by bin_auto(timestamp), resource.haproxy.proxy_name
    unit: reqs
    layout: { w: 6, h: 4 }
