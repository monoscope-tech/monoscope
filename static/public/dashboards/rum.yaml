      - type: table
        title: Identified users
        description: Search all identified users in this audience by name, email or id. Shows up to 200 matches, most recently active first.
        searchable: true
        layout: { w: 12, h: 7 }
        columns:
          - field: user
            title: User
            link: /p/{{project_id}}/log_explorer?viz_type=sessions&query={{row.kql}}{{time_range}}
          - field: sessions
            title: Sessions
            column_type: number
          - field: affected
            title: Affected sessions
            column_type: number
          - field: last_seen
            title: Last seen
          - field: kql
            title: Session query
            hidden: true
        query: *app
        sql: |
          {{audience_sessions}}
          SELECT COALESCE(MAX(email), MAX(full_name), MAX(user_id)) AS "user", COUNT(*)::text AS sessions,
            SUM(errored)::text AS affected, MAX(last_seen)::text AS last_seen,
            '{{browser_kql}}' || CASE WHEN {{audience_kql_literal}} = '' THEN '' ELSE ' and ' || {{audience_kql_literal}} END ||
              CASE WHEN MAX(user_id) IS NOT NULL THEN ' and attributes.user.id == "' || replace(replace(MAX(user_id), '\', '\\'), '"', '\"') || '"'
                ELSE ' and attributes.user.email == "' || replace(replace(MAX(email), '\', '\\'), '"', '\"') || '"' END AS kql
          FROM audience_sessions WHERE user_id IS NOT NULL OR email IS NOT NULL
          GROUP BY COALESCE('id:' || user_id, 'email:' || email)
          HAVING {{table_search}} = '' OR strpos(lower(COALESCE(MAX(email), '') || ' ' || COALESCE(MAX(full_name), '') || ' ' || COALESCE(MAX(user_id), '')), lower({{table_search}})) > 0
          ORDER BY 4 DESC LIMIT 200
