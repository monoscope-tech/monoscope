title: Real User Monitoring
icon: web
preview: /public/assets/svgs/screens/http-stats.svg
description: Browser experience, Core Web Vitals, frontend errors, and user sessions from OpenTelemetry
refresh_interval: 60s

# {{browser_filter}}, {{pageview_filter}} and {{error_filter}} are Real User Monitoring's predicates
# (Pkg.Parser.browserSql and siblings). TimeFusion's `rum_*` rollups declare them verbatim and serve a
# widget only while its filter matches exactly, so they live in one place rather than here.
#
# Web Vitals P75 is read from the histogram buckets (unnest, sum per bound, interpolate within
# the bucket holding the 75th observation), never the export mean. Each series is one page view,
# so a cumulative series' newest point holds all of its observations.

variables:
  - key: app
    title: Application
    type: query
    reload_on_change: true
    facet_field: service.name
    sql:
      source: timefusion
      statement: |
        SELECT DISTINCT resource___service___name
        FROM otel_logs_and_spans
        WHERE project_id='{{project_id}}'
          AND {{browser_filter}}
          AND resource___service___name IS NOT NULL
          {{time_filter}}
        LIMIT 100
    multi: false

  - key: browser
    title: Browser
    type: values
    multi: false
    options: [[Chrome], [Edge], [Firefox], [Opera], [Safari], [Samsung Internet], [Other], [Unknown]]

  - key: os
    title: Operating system
    type: values
    multi: false
    options: [[Windows], [iOS], [macOS], [Android], [ChromeOS], [Linux], [Other], [Unknown]]

  - key: device
    title: Device
    type: values
    multi: false
    options: [[Desktop], [Mobile], [Tablet], [Other], [Unknown]]

  - key: errors
    title: Session health
    type: values
    multi: false
    options: [["false", All sessions], ["true", Sessions with errors]]
    value: "false"

widgets: []

tabs:
  - name: Overview
    icon: web
    widgets:
      - type: group
        title: User experience
        description: Real browser traffic only. Backend spans and synthetic requests are excluded.
        layout: { w: 12, h: 4 }
        children:
          - type: stat
            title: Sessions
            icon: users
            query: &app '"{{var-app}}" == "" or resource.service.name == "{{var-app}}"'
            sql: |
              SELECT distinct_count(approx_count_distinct(attributes___session___id))::float FROM otel_logs_and_spans WHERE {{query_ast_filters}} AND {{browser_filter}} AND attributes___session___id IS NOT NULL
            unit: sessions
            layout: { w: 3, h: 2 }

          - type: timeseries_stat
            title: Page views
            icon: file-lines
            query: *app
            sql: |
              SELECT extract(epoch from time_bucket('{{rollup_interval}}', timestamp))::integer, 'value', count(*)::float FROM otel_logs_and_spans WHERE {{query_ast_filters}} AND {{pageview_filter}} GROUP BY time_bucket('{{rollup_interval}}', timestamp) ORDER BY time_bucket('{{rollup_interval}}', timestamp) DESC
            unit: views
            summarize_by: sum
            layout: { w: 3, h: 2 }

          - type: timeseries_stat
            title: Browser errors
            icon: triangle-exclamation
            query: *app
            sql: &browser_error_series |
              SELECT extract(epoch from time_bucket('{{rollup_interval}}', timestamp))::integer, 'value', count(*)::float FROM otel_logs_and_spans WHERE {{query_ast_filters}} AND {{browser_filter}} AND {{error_filter}} GROUP BY time_bucket('{{rollup_interval}}', timestamp) ORDER BY time_bucket('{{rollup_interval}}', timestamp) DESC
            unit: errors
            summarize_by: sum
            series_intent: error
            layout: { w: 3, h: 2 }

          - type: stat
            title: P75 page load
            icon: gauge
            query: *app
            sql: |
              SELECT (approx_percentile(0.75, percentile_agg(duration)) / 1000000)::float FROM otel_logs_and_spans WHERE {{query_ast_filters}} AND {{pageview_filter}} AND duration IS NOT NULL
            unit: ms
            layout: { w: 3, h: 2 }

      - type: timeseries
        title: Page views and errors
        description: A page view that errored counts in both series.
        layout: { w: 7, h: 5 }
        query: *app
        sql: |
          SELECT a.time, s.series, CASE s.series WHEN 'Page views' THEN a.page_views ELSE a.errors END FROM (SELECT extract(epoch from time_bucket('{{rollup_interval}}', timestamp))::integer AS time, count(*) FILTER (WHERE {{pageview_filter}})::float AS page_views, count(*) FILTER (WHERE {{browser_filter}} AND {{error_filter}})::float AS errors FROM otel_logs_and_spans WHERE {{query_ast_filters}} GROUP BY time_bucket('{{rollup_interval}}', timestamp)) a CROSS JOIN (VALUES ('Page views'), ('Errors')) AS s(series) ORDER BY a.time DESC

      - type: table
        title: Top pages
        description: Routes with ids masked, and their P75 real-user load duration.
        layout: { w: 5, h: 5 }
        columns:
          - field: page
            title: Page
            link: /p/{{project_id}}/log_explorer?query={{row.kql}}{{time_range}}
          - field: views
            title: Views
            column_type: number
            progress: column_percent
          - field: p75_ms
            title: P75
            description: "75th percentile page-load duration: three in four loads were at least this fast."
            column_type: duration
            unit: ms
          - field: kql
            title: Explorer query
            hidden: true
        query: *app
        sql: |
          WITH pages AS (
            SELECT COALESCE(NULLIF(regexp_replace(regexp_replace(regexp_replace(regexp_replace(regexp_replace(
                COALESCE(NULLIF(CASE WHEN name = 'documentLoad' THEN attributes___url___full END, ''), NULLIF(attributes___url___path, ''), NULLIF(attributes___url___full, ''), replace(name, 'Pageview · ', '')),
                '^[A-Za-z][A-Za-z0-9+.-]*://[^/]+', ''), '[?#].*$', ''),
                '/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[^/]*', '/:id', 'g'), '/[0-9][^/]*', '/:id', 'g'), '/[A-Z][A-Z0-9]*[0-9][A-Z0-9]*', '/:id', 'g'), ''), '/') AS page,
              duration
            FROM otel_logs_and_spans
            WHERE {{query_ast_filters}} AND {{pageview_filter}} AND duration IS NOT NULL
          )
          -- The route as an anchored regex (masked segments match any segment; metacharacters
          -- escaped as one-character classes, so the KQL string needs no backslashes).
          SELECT page, n::text AS views, p75_ms,
            '(name == "documentLoad" or name startswith "Pageview ") and (attributes.url.path matches regex "^' || rx || '$" or attributes.url.full matches regex "^([A-Za-z][A-Za-z0-9+.-]*://[^/?#]+)?' || rx || '([?#].*)?$")' AS kql
          FROM (
            SELECT page, COUNT(*) AS n,
              ROUND((approx_percentile(0.75, percentile_agg(duration)) / 1000000.0)::numeric, 1)::text AS p75_ms,
              replace(replace(replace(replace(replace(replace(replace(replace(replace(replace(replace(page, '"', ''), '\', ''),
                '.', '[.]'), '+', '[+]'), '*', '[*]'), '(', '[(]'), ')', '[)]'), '$', '[$]'), '|', '[|]'), '{', '[{]'), ':id', '[^/]+') AS rx
            FROM pages GROUP BY page ORDER BY COUNT(*) DESC LIMIT 20
          ) AS top ORDER BY n DESC

      - type: table
        title: Recent sessions
        description: Open a session to see its events and, when recorded, its replay.
        layout: { w: 12, h: 6 }
        cta:
          title: All sessions
          url: /p/{{project_id}}/rum/sessions
        columns:
          - field: session
            title: Session
            link: /p/{{project_id}}/log_explorer?viz_type=sessions&query=attributes.session.id%20%3D%3D%20%22{{row.session}}%22{{time_range}}
          - field: user
            title: User
          - field: page_views
            title: Views
            column_type: number
          - field: errors
            title: Errors
            column_type: number
            progress: column_percent
            progress_variant: error
          - field: last_seen
            title: Last seen
        query: *app
        sql: |
          SELECT attributes___session___id AS session,
            COALESCE(MAX(attributes___user___full_name), MAX(attributes___user___email), MAX(attributes___user___id), '') AS "user",
            COUNT(*) FILTER (WHERE {{pageview_filter}})::text AS page_views,
            COUNT(*) FILTER (WHERE {{error_filter}})::text AS errors,
            MAX(timestamp)::text AS last_seen
          FROM otel_logs_and_spans
          WHERE {{query_ast_filters}}
            AND {{browser_filter}}
            AND attributes___session___id IS NOT NULL
          GROUP BY attributes___session___id ORDER BY MAX(timestamp) DESC LIMIT 50

  - name: Web Vitals
    icon: gauge
    widgets:
      - type: table
        title: Core Web Vitals
        description: P75 of real-user observations, rated against Google's field thresholds. The bucket is the range the P75 is known to lie in.
        layout: { w: 12, h: 4 }
        columns:
          - field: vital
            title: Vital
            tooltip: '{{row.about}}'
          - field: p75
            title: P75
            description: "75th percentile: three in four page loads were at least this fast. ≈ marks an estimate inside a bucket that crosses a threshold."
          - field: rating
            title: Rating
            description: Against Google's field thresholds. "Likely" ratings come from an estimate, not the bucket alone.
          - field: bucket
            title: Known range
            description: The histogram bucket the P75 falls in. The browser SDK's bucket edges decide how precise this can be.
          - field: samples
            title: Samples
            description: Real-user observations in the selected window.
            column_type: number
            progress: column_percent
          - field: about
            title: About
            hidden: true
        query: &metrics_app 'metrics | where "{{var-app}}" == "" or resource.service.name == "{{var-app}}"'
        sql: |
          WITH points AS (
            SELECT replace(metric_name, 'browser.web_vital.', '') AS vital, series_id, timestamp, hist_explicit_bounds AS bounds, hist_bucket_counts AS counts,
              ROW_NUMBER() OVER (PARTITION BY series_id, start_timestamp ORDER BY timestamp DESC) AS newest
            FROM otel_metrics
            WHERE {{query_ast_filters}} AND metric_name IN ('browser.web_vital.lcp', 'browser.web_vital.inp', 'browser.web_vital.cls', 'browser.web_vital.fcp', 'browser.web_vital.ttfb') AND metric_type = 'HISTOGRAM' AND hist_bucket_counts IS NOT NULL
          ), buckets AS (
            SELECT vital, series_id, timestamp, unnest(COALESCE(bounds, ARRAY[]::float8[]) || ARRAY[NULL]::float8[]) AS le, unnest(counts) AS n FROM points WHERE newest = 1
          ), edges AS (
            -- Each point's cumulative count at its own edges. Summed, these are exact at any edge every point
            -- shares, so mixed bucket layouts (an SDK upgrade) coarsen to their common edges instead of interleaving.
            SELECT vital, le, SUM(cdf) AS cum, COUNT(*) AS points FROM (
              SELECT vital, le, SUM(n) OVER (PARTITION BY series_id, timestamp ORDER BY le NULLS LAST ROWS UNBOUNDED PRECEDING) AS cdf FROM buckets
            ) AS per_point GROUP BY vital, le
          ), cdf AS (
            SELECT vital, le, cum, MAX(cum) OVER (PARTITION BY vital) AS total,
              cum - COALESCE(LAG(cum) OVER (PARTITION BY vital ORDER BY le NULLS LAST), 0) AS n,
              LAG(le) OVER (PARTITION BY vital ORDER BY le NULLS LAST) AS lo
            FROM (SELECT *, MAX(points) OVER (PARTITION BY vital) AS all_points FROM edges) AS shared WHERE points = all_points
          ), p75 AS (
            SELECT vital, total, lo, le, CASE WHEN le IS NOT NULL THEN COALESCE(lo, 0) + (le - COALESCE(lo, 0)) * (0.75 * total - (cum - n)) / n END AS value
            FROM cdf WHERE total > 0 AND cum >= 0.75 * total AND cum - n < 0.75 * total
          ), rated AS (
            -- A bucket inside one band rates exactly. One straddling a threshold but no wider than
            -- twice the band gives an estimate; anything wider interpolates noise and is not shown.
            SELECT t.vital, t.ord, t.good, t.poor, t.about, p.total, p.lo, p.le, p.value,
              CASE WHEN p.le <= t.good THEN 'Good' WHEN COALESCE(p.lo, 0) >= t.poor THEN 'Poor' WHEN COALESCE(p.lo, 0) >= t.good AND p.le <= t.poor THEN 'Needs improvement' END AS verdict,
              p.le IS NOT NULL AND p.le - COALESCE(p.lo, 0) <= 2 * (t.poor - t.good) AS estimable
            FROM (VALUES ('lcp', 1, 2500.0, 4000.0, 'Largest Contentful Paint: when the main content becomes visible. Good ≤ 2.5 s, poor > 4 s.'),
              ('inp', 2, 200.0, 500.0, 'Interaction to Next Paint: how quickly the page responds to clicks, taps and keys. Good ≤ 200 ms, poor > 500 ms.'),
              ('cls', 3, 0.1, 0.25, 'Cumulative Layout Shift: how much content moves while loading. Good ≤ 0.1, poor > 0.25.'),
              ('fcp', 4, 1800.0, 3000.0, 'First Contentful Paint: when the first text or image appears. Good ≤ 1.8 s, poor > 3 s.'),
              ('ttfb', 5, 800.0, 1800.0, 'Time to First Byte: server and network time before the page starts arriving. Good ≤ 800 ms, poor > 1.8 s.')
            ) AS t(vital, ord, good, poor, about)
            LEFT JOIN p75 AS p ON p.vital = t.vital
          )
          SELECT upper(vital) AS vital,
            CASE WHEN total IS NULL OR (verdict IS NULL AND NOT estimable AND le IS NOT NULL) THEN '—' WHEN value IS NULL THEN '> ' || lo::text
              ELSE CASE WHEN verdict IS NULL THEN '≈ ' ELSE '' END || CASE WHEN vital = 'cls' THEN ROUND(value::numeric, 3)::text ELSE ROUND(value::numeric)::text || ' ms' END END AS p75,
            CASE WHEN total IS NULL THEN 'rating;info-weak⇒No observations in this window' WHEN verdict = 'Good' THEN 'rating;success-strong⇒Good'
              WHEN verdict = 'Poor' THEN 'rating;error-strong⇒Poor' WHEN verdict = 'Needs improvement' THEN 'rating;warning-strong⇒Needs improvement'
              WHEN NOT estimable THEN 'rating;info-weak⇒Buckets too coarse to rate' WHEN value <= good THEN 'rating;success-weak⇒Likely good'
              WHEN value > poor THEN 'rating;error-weak⇒Likely poor' ELSE 'rating;warning-weak⇒Likely needs improvement' END AS rating,
            CASE WHEN total IS NULL THEN '' ELSE COALESCE(lo, 0)::text || ' – ' || COALESCE(le::text, '∞') END AS bucket,
            COALESCE(total, 0)::text AS samples,
            about
          FROM rated ORDER BY ord

      - type: timeseries_line
        title: P75 over time
        description: P75 per interval for LCP (main content visible), INP (response to input), FCP (first content) and TTFB (first byte). CLS is unitless and shown in the table above.
        layout: { w: 12, h: 5 }
        unit: ms
        query: *metrics_app
        sql: |
          WITH points AS (
            SELECT time_bucket('{{rollup_interval}}', timestamp) AS t, replace(metric_name, 'browser.web_vital.', '') AS vital, series_id, timestamp, hist_explicit_bounds AS bounds, hist_bucket_counts AS counts,
              ROW_NUMBER() OVER (PARTITION BY series_id, start_timestamp ORDER BY timestamp DESC) AS newest
            FROM otel_metrics
            WHERE {{query_ast_filters}} AND metric_name IN ('browser.web_vital.lcp', 'browser.web_vital.inp', 'browser.web_vital.fcp', 'browser.web_vital.ttfb') AND metric_type = 'HISTOGRAM' AND hist_bucket_counts IS NOT NULL
          ), buckets AS (
            SELECT t, vital, series_id, timestamp, unnest(COALESCE(bounds, ARRAY[]::float8[]) || ARRAY[NULL]::float8[]) AS le, unnest(counts) AS n FROM points WHERE newest = 1
          ), edges AS (
            -- Each point's cumulative count at its own edges. Summed, these are exact at any edge every point
            -- shares, so mixed bucket layouts (an SDK upgrade) coarsen to their common edges instead of interleaving.
            SELECT t, vital, le, SUM(cdf) AS cum, COUNT(*) AS points FROM (
              SELECT t, vital, le, SUM(n) OVER (PARTITION BY series_id, timestamp ORDER BY le NULLS LAST ROWS UNBOUNDED PRECEDING) AS cdf FROM buckets
            ) AS per_point GROUP BY t, vital, le
          ), cdf AS (
            SELECT t, vital, le, cum, MAX(cum) OVER (PARTITION BY t, vital) AS total,
              cum - COALESCE(LAG(cum) OVER (PARTITION BY t, vital ORDER BY le NULLS LAST), 0) AS n,
              LAG(le) OVER (PARTITION BY t, vital ORDER BY le NULLS LAST) AS lo
            FROM (SELECT *, MAX(points) OVER (PARTITION BY t, vital) AS all_points FROM edges) AS shared WHERE points = all_points
          ), p75 AS (
            SELECT t, vital, total, lo, le, CASE WHEN le IS NOT NULL THEN COALESCE(lo, 0) + (le - COALESCE(lo, 0)) * (0.75 * total - (cum - n)) / n END AS value
            FROM cdf WHERE total > 0 AND cum >= 0.75 * total AND cum - n < 0.75 * total
          )
          SELECT extract(epoch from t)::integer AS time, upper(vital) AS vital, value::float AS value FROM p75 WHERE value IS NOT NULL ORDER BY time DESC

      - type: table
        title: Vitals by page
        description: P75 per page, busiest first. A dash marks a bucket too wide to place against the thresholds.
        layout: { w: 12, h: 6 }
        columns:
          - field: page
            title: Page
            description: Page URL with ids masked, so one route groups its variants.
          - field: lcp
            title: LCP
            description: Largest Contentful Paint, P75. When the main content becomes visible. Good ≤ 2.5 s, poor > 4 s.
          - field: inp
            title: INP
            description: Interaction to Next Paint, P75. How quickly the page responds to input. Good ≤ 200 ms, poor > 500 ms.
          - field: cls
            title: CLS
            description: Cumulative Layout Shift, P75. How much content moves while loading. Good ≤ 0.1, poor > 0.25.
          - field: samples
            title: Samples
            description: Real-user observations across these three vitals.
            column_type: number
            progress: column_percent
        query: *metrics_app
        sql: |
          WITH points AS (
            SELECT COALESCE(NULLIF(regexp_replace(regexp_replace(regexp_replace(regexp_replace(regexp_replace(COALESCE(attributes #>> '{page,url}', attributes->>'page.url', attributes->>'url', ''),
                '^[A-Za-z][A-Za-z0-9+.-]*://[^/]+', ''), '[?#].*$', ''),
                '/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[^/]*', '/:id', 'g'), '/[0-9][^/]*', '/:id', 'g'), '/[A-Z][A-Z0-9]*[0-9][A-Z0-9]*', '/:id', 'g'), ''), '/') AS page, replace(metric_name, 'browser.web_vital.', '') AS vital, series_id, timestamp, hist_explicit_bounds AS bounds, hist_bucket_counts AS counts,
              ROW_NUMBER() OVER (PARTITION BY series_id, start_timestamp ORDER BY timestamp DESC) AS newest
            FROM otel_metrics
            WHERE {{query_ast_filters}} AND metric_name IN ('browser.web_vital.lcp', 'browser.web_vital.inp', 'browser.web_vital.cls') AND metric_type = 'HISTOGRAM' AND hist_bucket_counts IS NOT NULL
          ), buckets AS (
            SELECT page, vital, series_id, timestamp, unnest(COALESCE(bounds, ARRAY[]::float8[]) || ARRAY[NULL]::float8[]) AS le, unnest(counts) AS n FROM points WHERE newest = 1
          ), edges AS (
            -- Each point's cumulative count at its own edges. Summed, these are exact at any edge every point
            -- shares, so mixed bucket layouts (an SDK upgrade) coarsen to their common edges instead of interleaving.
            SELECT page, vital, le, SUM(cdf) AS cum, COUNT(*) AS points FROM (
              SELECT page, vital, le, SUM(n) OVER (PARTITION BY series_id, timestamp ORDER BY le NULLS LAST ROWS UNBOUNDED PRECEDING) AS cdf FROM buckets
            ) AS per_point GROUP BY page, vital, le
          ), cdf AS (
            SELECT page, vital, le, cum, MAX(cum) OVER (PARTITION BY page, vital) AS total,
              cum - COALESCE(LAG(cum) OVER (PARTITION BY page, vital ORDER BY le NULLS LAST), 0) AS n,
              LAG(le) OVER (PARTITION BY page, vital ORDER BY le NULLS LAST) AS lo
            FROM (SELECT *, MAX(points) OVER (PARTITION BY page, vital) AS all_points FROM edges) AS shared WHERE points = all_points
          ), p75 AS (
            SELECT page, vital, total, lo, le, CASE WHEN le IS NOT NULL THEN COALESCE(lo, 0) + (le - COALESCE(lo, 0)) * (0.75 * total - (cum - n)) / n END AS value
            FROM cdf WHERE total > 0 AND cum >= 0.75 * total AND cum - n < 0.75 * total
          ), shown AS (
            -- Too coarse to place against the thresholds: wider than twice the needs-improvement band, as in Core Web Vitals.
            SELECT p.page, p.vital, p.total, CASE WHEN p.le - COALESCE(p.lo, 0) > 2 * (t.poor - t.good) THEN '—' WHEN p.le IS NULL THEN '> ' || p.lo::text
                WHEN p.vital = 'cls' THEN ROUND(p.value::numeric, 3)::text ELSE ROUND(p.value::numeric)::text || ' ms' END AS value
            FROM p75 AS p JOIN (VALUES ('lcp', 1, 2500.0, 4000.0, 'Largest Contentful Paint: when the main content becomes visible. Good ≤ 2.5 s, poor > 4 s.'),
              ('inp', 2, 200.0, 500.0, 'Interaction to Next Paint: how quickly the page responds to clicks, taps and keys. Good ≤ 200 ms, poor > 500 ms.'),
              ('cls', 3, 0.1, 0.25, 'Cumulative Layout Shift: how much content moves while loading. Good ≤ 0.1, poor > 0.25.'),
              ('fcp', 4, 1800.0, 3000.0, 'First Contentful Paint: when the first text or image appears. Good ≤ 1.8 s, poor > 3 s.'),
              ('ttfb', 5, 800.0, 1800.0, 'Time to First Byte: server and network time before the page starts arriving. Good ≤ 800 ms, poor > 1.8 s.')
            ) AS t(vital, ord, good, poor, about) ON t.vital = p.vital
          )
          SELECT page, MAX(CASE WHEN vital = 'lcp' THEN value END) AS lcp, MAX(CASE WHEN vital = 'inp' THEN value END) AS inp,
            MAX(CASE WHEN vital = 'cls' THEN value END) AS cls, SUM(total)::text AS samples
          FROM shown GROUP BY page ORDER BY SUM(total) DESC LIMIT 50

  - name: Errors
    icon: triangle-exclamation
    widgets:
      - type: timeseries_stat
        title: Browser error volume
        icon: triangle-exclamation
        query: *app
        sql: |
          SELECT extract(epoch from time_bucket('{{rollup_interval}}', timestamp))::integer, 'value', count(*)::float FROM otel_logs_and_spans WHERE {{query_ast_filters}} AND {{browser_filter}} AND {{error_filter}} AND {{audience_filter}} GROUP BY time_bucket('{{rollup_interval}}', timestamp) ORDER BY time_bucket('{{rollup_interval}}', timestamp) DESC
        unit: errors
        summarize_by: sum
        series_intent: error
        layout: { w: 4, h: 3 }

      - type: stat
        title: Affected sessions
        icon: users
        query: *app
        sql: |
          SELECT COUNT(DISTINCT attributes___session___id)::float FROM otel_logs_and_spans WHERE {{query_ast_filters}} AND {{browser_filter}} AND {{error_filter}} AND {{audience_filter}}
        unit: sessions
        layout: { w: 4, h: 3 }

      - type: stat
        title: Affected users
        icon: user
        query: *app
        sql: |
          SELECT COUNT(DISTINCT COALESCE(attributes___user___id, attributes___user___email))::float FROM otel_logs_and_spans WHERE {{query_ast_filters}} AND {{browser_filter}} AND {{error_filter}} AND {{audience_filter}}
        unit: users
        layout: { w: 4, h: 3 }

      - type: table
        title: Browser errors
        description: Grouped by type and message, with numbers and ids masked.
        layout: { w: 12, h: 7 }
        columns:
          - field: error_type
            title: Type
            link: /p/{{project_id}}/log_explorer?query={{row.kql}}{{time_range}}
          - field: message
            title: Message
          - field: events
            title: Events
            column_type: number
            progress: column_percent
            progress_variant: error
          - field: sessions
            title: Sessions
            column_type: number
          - field: last_seen
            title: Last seen
          - field: kql
            title: Explorer query
            hidden: true
        query: *app
        sql: |
          SELECT error_type, message, n::text AS events, sessions, last_seen,
            CASE WHEN exception_type IS NOT NULL THEN 'attributes.exception.type == "' || replace(replace(exception_type, '"', ''), '\', '') || '"'
              ELSE '(status_code == "ERROR" or level == "error") and name == "' || replace(replace(COALESCE(span_name, ''), '"', ''), '\', '') || '"' END AS kql
          FROM (
            SELECT attributes___exception___type AS exception_type, COALESCE(NULLIF(attributes___exception___type, ''), NULLIF(status_message, ''), 'Browser error') AS error_type,
              LEFT(regexp_replace(COALESCE(NULLIF(attributes___exception___message, ''), NULLIF(status_message, ''), name, 'No error message'), '[0-9a-fA-F-]{8,}|[0-9]+', '<n>', 'g'), 300) AS message,
              MIN(name) AS span_name, COUNT(*) AS n, COUNT(DISTINCT attributes___session___id)::text AS sessions, MAX(timestamp)::text AS last_seen
            FROM otel_logs_and_spans
            WHERE {{query_ast_filters}} AND {{browser_filter}} AND {{error_filter}} AND {{audience_filter}}
            GROUP BY 1, 2, 3 ORDER BY COUNT(*) DESC LIMIT 50
          ) AS groups ORDER BY n DESC

  - name: Audience
    icon: users
    widgets:
      - type: group
        title: Audience in this window
        description: Each session counts once. Unknown means no user agent was supplied; identified users exclude anonymous sessions.
        layout: { w: 12, h: 3 }
        children:
          - type: stat
            title: Audience sessions
            query: *app
            sql: "{{audience_sessions}} SELECT COUNT(*)::float FROM audience_sessions"
            unit: sessions
            layout: { w: 3, h: 2 }
          - type: stat
            title: Identified audience users
            query: *app
            sql: "{{audience_sessions}} SELECT COUNT(DISTINCT COALESCE('id:' || user_id, 'email:' || email))::float FROM audience_sessions"
            unit: users
            layout: { w: 3, h: 2 }
          - type: stat
            title: Sessions with errors
            query: *app
            sql: "{{audience_sessions}} SELECT COALESCE(SUM(errored), 0)::float FROM audience_sessions"
            unit: sessions
            series_intent: error
            layout: { w: 3, h: 2 }
          - type: stat
            title: Session error rate
            description: Sessions with at least one browser error divided by all sessions in the selected audience.
            query: *app
            sql: "{{audience_sessions}} SELECT (100.0 * SUM(errored) / NULLIF(COUNT(*), 0))::float FROM audience_sessions"
            unit: '%'
            series_intent: error
            layout: { w: 3, h: 2 }

      - type: table
        title: Browsers
        description: Select a row to filter this audience. Share is within the current filters; error rate is within each group.
        layout: { x: 0, w: 4, h: 5 }
        on_row_click:
          set_variable: browser
          navigate_to_tab: Audience
        columns:
          - field: name
            title: Browser
          - field: sessions
            title: Sessions
            column_type: number
          - field: share
            title: Share
            unit: '%'
            column_type: number
          - field: affected
            title: Affected
            description: Sessions with at least one browser error.
            column_type: number
          - field: error_rate
            title: Error rate
            unit: '%'
            column_type: number
        query: *app
        sql: |
          {{audience_sessions}}
          SELECT browser AS name, COUNT(*)::text AS sessions,
            ROUND(100.0 * COUNT(*) / NULLIF(SUM(COUNT(*)) OVER (), 0), 1)::text AS share,
            SUM(errored)::text AS affected,
            ROUND(100.0 * SUM(errored) / NULLIF(COUNT(*), 0), 1)::text AS error_rate
          FROM audience_sessions GROUP BY browser ORDER BY COUNT(*) DESC, browser

