title: RabbitMQ
icon: rabbitmq
preview: /public/assets/svgs/screens/http-stats.svg
description: Queue depths, message throughput, and consumer health per queue (OpenTelemetry rabbitmq receiver)
refresh_interval: 60s
tags: [infrastructure]
discovery_metrics:
  - 'rabbitmq.'
widgets:
  - type: group
    title: Overview
    layout: { w: 12, h: 3 }
    children:
      - type: 'timeseries_stat'
        title: 'Messages Published'
        icon: activity
        query: metrics | where metric_name == "rabbitmq.message.published" | summarize range(value) by bin_auto(timestamp)
        unit: msgs
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Queues'
        icon: list-tree
        query: metrics | where metric_name == "rabbitmq.message.current" | summarize dcount(resource.rabbitmq.queue.name)
        unit: queues
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Ready Messages'
        icon: clock
        query: metrics | where metric_name == "rabbitmq.message.current" and attributes.state == "ready" | summarize avg(value)
        unit: msgs
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Consumers'
        icon: user-plus
        query: metrics | where metric_name == "rabbitmq.consumer.count" | summarize avg(value)
        unit: consumers
        eager: true
        layout: { w: 3, h: 2 }

  - type: 'timeseries'
    title: 'Published vs Delivered vs Acknowledged'
    description: 'Delivery lagging publish rate means consumers are falling behind.'
    query: metrics | where metric_name in ("rabbitmq.message.published", "rabbitmq.message.delivered", "rabbitmq.message.acknowledged") | summarize range(value) by bin_auto(timestamp), metric_name
    unit: msgs
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Queue Depth by Queue (ready)'
    query: metrics | where metric_name == "rabbitmq.message.current" and attributes.state == "ready" | summarize avg(value) by bin_auto(timestamp), resource.rabbitmq.queue.name
    unit: msgs
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Unacknowledged by Queue'
    description: 'Growing unacked counts mean consumers hold messages without acking — stuck or slow consumers.'
    query: metrics | where metric_name == "rabbitmq.message.current" and attributes.state == "unacknowledged" | summarize avg(value) by bin_auto(timestamp), resource.rabbitmq.queue.name
    unit: msgs
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Dropped Messages'
    theme: 'roma'
    query: metrics | where metric_name == "rabbitmq.message.dropped" | summarize range(value) by bin_auto(timestamp), resource.rabbitmq.queue.name
    unit: msgs
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Consumers by Queue'
    query: metrics | where metric_name == "rabbitmq.consumer.count" | summarize avg(value) by bin_auto(timestamp), resource.rabbitmq.queue.name
    unit: consumers
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Deliveries by Queue'
    query: metrics | where metric_name == "rabbitmq.message.delivered" | summarize range(value) by bin_auto(timestamp), resource.rabbitmq.queue.name
    unit: msgs
    layout: { w: 6, h: 4 }
