title: Apache HTTP Server
icon: apache
preview: /public/assets/svgs/screens/http-stats.svg
description: Apache throughput, worker saturation, scoreboard, and CPU (OpenTelemetry apache receiver, mod_status)
refresh_interval: 60s
tags: [infrastructure]
discovery_metrics:
  - 'apache.'
widgets:
  - type: group
    title: Overview
    layout: { w: 12, h: 3 }
    children:
      - type: 'timeseries_stat'
        title: 'Requests'
        icon: list-tree
        query: metrics | where metric_name == "apache.requests" | summarize range(value) by bin_auto(timestamp)
        unit: reqs
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Current Connections'
        icon: swap
        query: metrics | where metric_name == "apache.current_connections" | summarize avg(value)
        unit: connections
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Busy Workers'
        icon: activity
        query: metrics | where metric_name == "apache.workers" and attributes.state == "busy" | summarize avg(value)
        unit: workers
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Uptime'
        icon: clock
        query: metrics | where metric_name == "apache.uptime" | summarize max(value) / 86400
        unit: days
        eager: true
        layout: { w: 3, h: 2 }

  - type: 'timeseries'
    title: 'Request Rate'
    query: metrics | where metric_name == "apache.requests" | summarize range(value) by bin_auto(timestamp)
    unit: reqs
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Workers (busy vs idle)'
    description: 'All workers busy means requests queue — raise MaxRequestWorkers or find the slow handler.'
    query: metrics | where metric_name == "apache.workers" | summarize avg(value) by bin_auto(timestamp), attributes.state
    unit: workers
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Scoreboard'
    query: metrics | where metric_name == "apache.scoreboard" | summarize avg(value) by bin_auto(timestamp), attributes.state
    unit: workers
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Traffic'
    query: metrics | where metric_name == "apache.traffic" | summarize range(value) / 1048576 by bin_auto(timestamp)
    unit: MB
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Cumulative Request Time'
    description: 'Increase in total request-serving time per interval; spikes without matching request-rate spikes mean slow requests.'
    query: metrics | where metric_name == "apache.request.time" | summarize range(value) by bin_auto(timestamp)
    unit: ms
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'CPU Load'
    query: metrics | where metric_name == "apache.cpu.load" | summarize avg(value) by bin_auto(timestamp)
    unit: '%'
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Load Averages'
    query: metrics | where metric_name in ("apache.load.1", "apache.load.5", "apache.load.15") | summarize avg(value) by bin_auto(timestamp), metric_name
    unit: '%'
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Async Connections'
    query: metrics | where metric_name == "apache.connections.async" | summarize avg(value) by bin_auto(timestamp), attributes.connection_state
    unit: connections
    layout: { w: 6, h: 4 }
