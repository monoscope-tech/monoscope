title: Nginx
icon: nginx
preview: /public/assets/svgs/screens/http-stats.svg
description: Nginx request throughput and connection states (OpenTelemetry nginx receiver, stub_status)
refresh_interval: 60s
tags: [infrastructure]
discovery_metrics:
  - 'nginx.'
widgets:
  - type: group
    title: Overview
    layout: { w: 12, h: 3 }
    children:
      - type: 'timeseries_stat'
        title: 'Requests'
        icon: list-tree
        query: metrics | where metric_name == "nginx.requests" | summarize range(value) by bin_auto(timestamp)
        unit: reqs
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Active Connections'
        icon: swap
        query: metrics | where metric_name == "nginx.connections_current" and attributes.state == "active" | summarize avg(value)
        unit: connections
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Waiting Connections'
        icon: clock
        query: metrics | where metric_name == "nginx.connections_current" and attributes.state == "waiting" | summarize avg(value)
        unit: connections
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Accepted (per range)'
        icon: activity
        query: metrics | where metric_name == "nginx.connections_accepted" | summarize range(value)
        unit: connections
        eager: true
        layout: { w: 3, h: 2 }

  - type: 'timeseries'
    title: 'Request Rate'
    query: metrics | where metric_name == "nginx.requests" | summarize range(value) by bin_auto(timestamp)
    unit: reqs
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Connections by State'
    query: metrics | where metric_name == "nginx.connections_current" | summarize avg(value) by bin_auto(timestamp), attributes.state
    unit: connections
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Accepted vs Handled Connections'
    description: 'Accepted exceeding handled means connections are being dropped at capacity limits.'
    query: metrics | where metric_name in ("nginx.connections_accepted", "nginx.connections_handled") | summarize range(value) by bin_auto(timestamp), metric_name
    unit: connections
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Access-Log Latency Percentiles (from traces)'
    description: 'Server-span latency for nginx-fronted services (requires tracing instrumentation).'
    hide_subtitle: true
    summarize_by: max
    query: kind == "server" and duration != null | summarize percentiles(duration / 1000000, 50, 90, 99) by bin_auto(timestamp)
    unit: ms
    layout: { w: 6, h: 4 }
