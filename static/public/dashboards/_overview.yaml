title: Overview
read_only: true
icon: qrcode
preview: /public/assets/svgs/screens/http-stats.svg
description: Comprehensive system overview with service, resource, and database insights
refresh_interval: 60s

variables:
  - key: service
    title: Service
    type: query
    reload_on_change: true
    facet_field: service.name
    sql:
      source: timefusion
      statement: |
        SELECT DISTINCT resource___service___name
        FROM otel_logs_and_spans
        WHERE project_id='{{project_id}}'
          AND resource___service___name IS NOT NULL
          {{time_filter}}
        LIMIT 100
    default: ''
    multi: false

  - key: database
    title: Database System
    type: query
    reload_on_change: true
    facet_field: db.system.name
    sql:
      source: timefusion
      statement: |
        SELECT DISTINCT attributes___db___system___name
        FROM otel_logs_and_spans
        WHERE project_id='{{project_id}}'
          AND attributes___db___system___name IS NOT NULL
          {{time_filter}}
        LIMIT 50
    default: ''
    multi: false

widgets: [] # Empty widgets array for backward compatibility

tabs:
  - name: Overview
    variables: []
    icon: grid
    widgets:
      # Golden Signals - The 4 key metrics for any APM
      - type: group
        title: Golden Signals
        description: 'The four key metrics from Google SRE for monitoring distributed systems: Traffic, Latency, Errors, and Saturation.'
        layout: { w: 12, h: 4 }
        children:
          - type: 'timeseries_stat'
            title: 'Traffic'
            description: 'Request rate across inbound requests AND SDK-instrumented outbound calls. Measures system load and usage patterns.'
            icon: activity
            query: |
              {{request_kql}}
              | summarize count() by bin_auto(timestamp)
            unit: req/min
            summarize_by: rate
            layout: { w: 3, h: 2 }

          - type: 'timeseries_stat'
            title: 'P95 Latency'
            description: '95th percentile response time across inbound requests AND SDK-instrumented outbound calls. 95% complete faster than this.'
            icon: clock
            query: |
              {{request_kql}} and duration != null
              | summarize p95(duration) / 1000000 by bin_auto(timestamp)
            unit: ms
            summarize_by: mean
            layout: { w: 3, h: 2 }

          - type: 'timeseries_stat'
            title: 'Error Rate'
            description: 'Percentage of failed requests (5xx errors) across inbound requests AND SDK-instrumented outbound calls. A failing third-party dependency raises this. Lower is better.'
            icon: alert-triangle
            query: |
              {{request_kql}}
              | summarize countif(status_code == "ERROR" or coalesce(attributes.http.response.status_code, 0) >= 500) * 100.0 / count() by bin_auto(timestamp)
            unit: '%'
            summarize_by: mean
            alert_threshold: 5
            warning_threshold: 2
            layout: { w: 3, h: 2 }

          - type: 'timeseries_stat'
            title: 'Apdex Score'
            description: 'Application Performance Index (0-1). Measures user satisfaction based on response times. >0.9 is excellent, <0.5 is poor.'
            icon: face-smile
            query: |
              {{request_kql}} and duration != null
              | summarize (countif(duration <= 500000000) + countif(duration > 500000000 and duration <= 2000000000) * 0.5) / count() by bin_auto(timestamp)
            unit: '/ 1'
            decimals: 2
            summarize_by: mean
            layout: { w: 3, h: 2 }

      # Secondary metrics row
      - type: group
        title: System Overview
        layout: { w: 12, h: 2 }
        children:
          - type: 'stat'
            title: 'Active Services'
            icon: server
            query: |
              resource.service.name != null
              | summarize dcount(resource.service.name)
            unit: services
            layout: { w: 3, h: 2 }

          - type: 'stat'
            title: 'Total Requests'
            icon: list-tree
            query: |
              {{request_kql}}
              | summarize count()
            unit: reqs
            layout: { w: 3, h: 2 }

          - type: 'stat'
            title: 'Near memory limit'
            description: 'Containers whose working set reached 90% of their memory limit in this window — next in line for an OOM kill. See the Infra tab.'
            icon: triangle-exclamation
            unit: containers
            warning_threshold: 1
            alert_threshold: 3
            sql: &near_memory_limit |
              SELECT COUNT(*)::float8 FROM (
                SELECT resource___k8s___pod___name, resource___k8s___container___name,
                  MAX(value) FILTER (WHERE metric_name = 'container.memory.working_set')
                    / NULLIF(MAX(value) FILTER (WHERE metric_name = 'k8s.container.memory_limit'), 0) AS ratio
                FROM otel_metrics
                WHERE project_id='{{project_id}}'
                  AND metric_name IN ('container.memory.working_set', 'k8s.container.memory_limit') {{time_filter}}
                GROUP BY 1, 2
              ) c WHERE ratio >= 0.9
            layout: { w: 3, h: 2 }

          - type: 'stat'
            title: 'Unique Endpoints'
            icon: route
            query: |
              (kind == "server" or name == "apitoolkit-http-span") and name != null
              | summarize dcount(name)
            unit: endpoints
            layout: { w: 3, h: 2 }

      - type: heatmap
        title: 'Request latency distribution'
        description: 'Every request in a log-scaled latency bucket over time, shaded by count, errors in red. Click a cell to open its requests in the Explorer.'
        query: |
          {{request_kql}} and duration > 0
          | summarize count() by bin_auto(timestamp), log_bin(duration), iff(status_code == "ERROR", "error", "ok")
        unit: ns
        layout: { w: 12, h: 4 }

      # Services Table and Issues side by side
      - type: table
        title: Services Health
        description: 'Click a service row to view its detailed metrics in the Service tab.'
        layout: { w: 6, h: 5 }
        on_row_click:
          set_variable: service
          value: '{{row.service_name}}'
          navigate_to_tab: 'Service'
        columns:
          - field: service_name
            sortable: true
            title: Service
          - field: apdex
            sortable: true
            title: Apdex
            column_type: number
            decimals: 2
          - field: throughput
            sortable: true
            title: Throughput
            column_type: number
            unit: req/min
            progress: column_percent
          - field: error_rate
            column_type: number
            sortable: true
            title: Errors
            unit: '%'
            progress: value_percent
            progress_variant: error
          - field: p95_latency
            sortable: true
            title: P95
            column_type: duration
            unit: ms
            progress: column_percent
        sql: |
          SELECT resource___service___name as service_name, ROUND((SUM(CASE WHEN duration <= 500000000 THEN 1.0 WHEN duration <= 2000000000 THEN 0.5 ELSE 0 END)) / GREATEST(1, COUNT(*))::numeric, 2) as apdex, ROUND((COUNT(*)::numeric / GREATEST(1, EXTRACT(EPOCH FROM (MAX(timestamp) - MIN(timestamp))) / 60)), 2) as throughput, (COUNT(*) FILTER (WHERE status_code = 'ERROR' OR COALESCE(attributes___http___response___status_code, 0) >= 500) * 100.0 / GREATEST(1, COUNT(*))::numeric) as error_rate, ROUND((approx_percentile(0.95, percentile_agg(duration))::numeric / 1000000), 2) as p95_latency FROM otel_logs_and_spans WHERE project_id='{{project_id}}' AND resource___service___name IS NOT NULL AND kind = 'server' AND duration IS NOT NULL {{time_filter}} GROUP BY resource___service___name ORDER BY {{table_sort}} LIMIT 50
        default_sort: "COUNT(*)::numeric / GREATEST(1, EXTRACT(EPOCH FROM (MAX(timestamp) - MIN(timestamp))) / 60) DESC"

      # Anomalies/Issues widget
      - type: anomalies
        title: 'Ongoing Issues'
        layout: { w: 6, h: 5 }

      # Events by Service
      - type: 'timeseries'
        title: 'Events by Service'
        query: |
          resource.service.name != null
          | summarize count() by bin_auto(timestamp), resource.service.name
          | order by timestamp desc
          | limit 10000
        unit: events
        layout: { w: 6, h: 4 }

      # Errors by Service (counts; the rate is Error Rate above)
      - type: 'timeseries'
        title: 'Errors by Service'
        theme: 'roma'
        query: |
          status_code == "ERROR" and resource.service.name != null
          | summarize count() by bin_auto(timestamp), resource.service.name
          | order by timestamp desc
          | limit 10000
        unit: errors
        series_intent: error
        layout: { w: 6, h: 4 }

      # HTTP Request Volume by Service
      - type: 'timeseries'
        title: 'HTTP Request Volume by Service'
        query: |
          resource.service.name != null and kind == "server"
          | summarize count() by bin_auto(timestamp), resource.service.name
          | order by timestamp desc
          | limit 10000
        unit: reqs
        layout: { w: 6, h: 4 }

      # HTTP Requests by Status Code
      - type: 'timeseries'
        title: 'HTTP Requests by Status Code'
        query: |
          {{request_kql}} and attributes.http.response.status_code != null
          | summarize count() by bin_auto(timestamp), coalesce(tostring(attributes.http.response.status_code), "unknown")
          | order by timestamp desc
          | limit 10000
        unit: reqs
        layout: { w: 6, h: 4 }

      # HTTP Errors Distribution
      - type: 'timeseries'
        title: 'HTTP Errors (4xx & 5xx) - Incoming'
        theme: 'roma'
        query: |
          {{request_kql}} and attributes.http.response.status_code != null and attributes.http.response.status_code >= 400
          | extend error_category = case(attributes.http.response.status_code >= 500, "5xx", attributes.http.response.status_code >= 400, "4xx", tostring(attributes.http.response.status_code))
          | summarize count() by bin_auto(timestamp), error_category
          | order by timestamp desc
          | limit 10000
        unit: errors
        layout: { w: 6, h: 4 }

      # Request Latency Percentiles
      - type: 'timeseries_line'
        title: 'Request Latency Percentiles'
        description: 'Response time distribution. P50 is median, P99 shows worst-case latency for 1% of requests.'
        hide_subtitle: true
        summarize_by: max
        query: |
          {{request_kql}} and duration != null
          | summarize percentiles(duration, 50, 75, 90, 95, 99) by bin_auto(timestamp)
          | order by timestamp desc
        unit: ns
        layout: { w: 6, h: 4 }

      # Placed at ingest from each request's client address; requests behind a private proxy stay unplaced.
      - type: geomap
        title: 'Requests by country'
        description: 'Where incoming requests come from, located from the client IP address. Shades are log-scaled.'
        query: &by_country |
          {{request_kql}} and attributes.geo.country.iso_code != null
          | summarize count() by attributes.geo.country.iso_code
        unit: reqs
        layout: { w: 8, h: 5 }

      - type: top_list
        title: 'Top countries'
        query: *by_country
        layout: { w: 4, h: 5 }

      # Database Health - Click to navigate to Databases tab
      - type: table
        title: Database Health
        description: 'Click a database to view detailed metrics in the Databases tab.'
        layout: { w: 6, h: 4 }
        on_row_click:
          set_variable: database
          value: '{{row.db_system}}'
          navigate_to_tab: 'Databases'
        columns:
          - field: db_system
            sortable: true
            title: Database
          - field: queries
            sortable: true
            title: Queries
            column_type: number
            progress: column_percent
          - field: avg_ms
            sortable: true
            title: Avg
            column_type: duration
            unit: ms
          - field: errors
            sortable: true
            title: Errors
            column_type: number
            progress: column_percent
            progress_variant: error
        sql: |
          SELECT
            attributes___db___system___name as db_system,
            COUNT(*) as queries,
            ROUND((AVG(duration) / 1e6)::numeric, 2) as avg_ms,
            COUNT(*) FILTER (WHERE status_code = 'ERROR') as errors
          FROM otel_logs_and_spans
          WHERE project_id='{{project_id}}'
            AND attributes___db___system___name IS NOT NULL
            AND duration IS NOT NULL
            {{time_filter}}
          GROUP BY db_system
          ORDER BY {{table_sort}}
        default_sort: "COUNT(*) DESC"

      - type: table
        title: Slowest endpoints
        description: 'Inbound endpoints by p95 latency (at least 10 requests). Long-lived streams sit at the top by nature. Click one to open its service.'
        layout: { w: 6, h: 4 }
        on_row_click:
          set_variable: service
          value: '{{row.service}}'
          navigate_to_tab: 'Service'
        columns:
          - field: endpoint
            sortable: true
            title: Endpoint
          - field: service
            sortable: true
            title: Service
          - field: p95_ms
            sortable: true
            title: P95
            column_type: duration
            unit: ms
            progress: column_percent
          - field: requests
            sortable: true
            title: Requests
            column_type: number
          - field: errors
            sortable: true
            title: Errors
            column_type: number
            progress: column_percent
            progress_variant: error
        sql: |
          SELECT name AS endpoint, MIN(resource___service___name) AS service,
            ROUND((approx_percentile(0.95, percentile_agg(duration))::numeric / 1e6), 2) AS p95_ms,
            COUNT(*) AS requests,
            COUNT(*) FILTER (WHERE status_code = 'ERROR' OR COALESCE(attributes___http___response___status_code, 0) >= 500) AS errors
          FROM otel_logs_and_spans
          WHERE project_id='{{project_id}}' AND kind = 'server' AND duration IS NOT NULL AND name IS NOT NULL {{time_filter}}
          GROUP BY name
          HAVING COUNT(*) >= 10
          ORDER BY {{table_sort}}
          LIMIT 50
        default_sort: 'p95_ms DESC'

      # Requests by Endpoint
      - type: 'timeseries'
        title: 'Requests by Endpoint'
        sql: |
          WITH top_endpoints AS (
            SELECT 
              attributes___http___request___method || ' ' || attributes___url___path as endpoint,
              COUNT(*) as total_count
            FROM otel_logs_and_spans
            WHERE project_id='{{project_id}}'
              AND (kind = 'server' OR name = 'apitoolkit-http-span' OR name = 'monoscope.http')
              AND attributes___http___response___status_code IS NOT NULL
              AND attributes___url___path IS NOT NULL
              {{time_filter}}
            GROUP BY endpoint
            ORDER BY total_count DESC
            LIMIT 10
          )
          SELECT 
            extract(epoch from time_bucket('{{rollup_interval}}', o.timestamp))::integer AS time,
            o.attributes___http___request___method || ' ' || o.attributes___url___path as endpoint,
            COUNT(*)::float as count
          FROM otel_logs_and_spans o
          INNER JOIN top_endpoints t ON (o.attributes___http___request___method || ' ' || o.attributes___url___path) = t.endpoint
          WHERE o.project_id='{{project_id}}'
            AND (o.kind = 'server' OR o.name = 'apitoolkit-http-span' OR o.name = 'monoscope.http')
            {{time_filter}}
          GROUP BY time, o.attributes___http___request___method, o.attributes___url___path
          ORDER BY time DESC
        unit: reqs
        layout: { w: 12, h: 4 }

  - name: Service
    variables: [service]
    icon: server
    requires: service
    widgets:
      # 1. Service health at a glance
      - type: group
        title: '{{var-service}} Health'
        layout: { w: 12, h: 3 }
        children:
          - type: 'timeseries_stat'
            title: 'Service Requests'
            icon: list-tree
            query: |
              resource.service.name == "{{var-service}}" and kind == "server"
              | summarize count() by bin_auto(timestamp)
            unit: reqs
            layout: { w: 3, h: 2 }

          - type: 'stat'
            title: 'Service Error Rate'
            icon: bug
            query: |
              resource.service.name == "{{var-service}}" and kind == "server"
              | summarize countif(status_code == "ERROR" or coalesce(attributes.http.response.status_code, 0) >= 400) * 100.0 / count()
            unit: '%'
            layout: { w: 3, h: 2 }

          - type: 'stat'
            title: 'Avg Latency'
            icon: activity
            query: |
              resource.service.name == "{{var-service}}" and kind == "server" and duration != null
              | summarize round(avg(duration) / 1000000, 2)
            unit: ms
            layout: { w: 3, h: 2 }

          - type: 'stat'
            title: 'Endpoints'
            icon: routes
            query: |
              resource.service.name == "{{var-service}}" and kind == "server" and name != null
              | summarize dcount(name)
            unit: endpoints
            layout: { w: 3, h: 2 }

      # 2. Resource breakdown mini-charts
      - type: 'timeseries'
        title: 'Requests by Resource'
        query: |
          name != null and kind == "server" and resource.service.name == "{{var-service}}"
          | summarize count() by bin_auto(timestamp), name
          | order by timestamp desc
          | limit 20000
        unit: reqs
        layout: { w: 4, h: 3 }

      - type: 'timeseries_line'
        title: 'P95 Latency by Resource'
        query: |
          name != null and kind == "server" and duration != null and resource.service.name == "{{var-service}}"
          | summarize p95(duration) by bin_auto(timestamp), name
          | order by timestamp desc
          | limit 20000
        unit: ns
        layout: { w: 4, h: 3 }

      - type: 'timeseries'
        title: 'Errors by Resource'
        theme: 'roma'
        query: |
          name != null and kind == "server" and (status_code == "ERROR" or coalesce(attributes.http.response.status_code, 0) >= 400) and resource.service.name == "{{var-service}}"
          | summarize count() by bin_auto(timestamp), name
          | order by timestamp desc
          | limit 20000
        unit: errors
        series_intent: error
        layout: { w: 4, h: 3 }

      # 3. Service traffic & latency charts
      - type: 'timeseries'
        title: 'Requests by Status Code'
        query: |
          resource.service.name == "{{var-service}}" and kind == "server"
          | extend status_code_str = coalesce(tostring(attributes.http.response.status_code), "unknown")
          | summarize count() by bin_auto(timestamp), status_code_str
          | order by timestamp desc
          | limit 10000
        unit: reqs
        layout: { w: 6, h: 4 }

      - type: 'timeseries_line'
        title: 'Latency Percentiles'
        hide_subtitle: true
        summarize_by: max
        query: |
          resource.service.name == "{{var-service}}" and kind == "server" and duration != null
          | summarize percentiles(duration, 50, 75, 90, 95, 99) by bin_auto(timestamp)
          | order by timestamp desc
        unit: ns
        layout: { w: 6, h: 4 }

      - type: heatmap
        title: 'Latency distribution'
        description: 'Every request in a log-scaled latency bucket over time, shaded by count, errors in red. Bands a percentile line averages away (a fast cache hit beside a slow miss) show as separate stripes.'
        query: |
          resource.service.name == "{{var-service}}" and kind == "server" and duration > 0
          | summarize count() by bin_auto(timestamp), log_bin(duration), iff(status_code == "ERROR", "error", "ok")
        unit: ns
        layout: { w: 12, h: 4 }

      - type: 'timeseries'
        title: 'Errors'
        theme: 'roma'
        query: |
          resource.service.name == "{{var-service}}" and kind == "server" and (status_code != "UNSET" and status_code != "OK" or coalesce(attributes.http.response.status_code, 0) >= 400)
          | extend error_type = case(status_code == "ERROR", "ERROR", attributes.http.response.status_code >= 500, "5xx", attributes.http.response.status_code >= 400, "4xx", status_code)
          | summarize count() by bin_auto(timestamp), error_type
          | order by timestamp desc
          | limit 10000
        unit: errors
        series_intent: error
        layout: { w: 6, h: 4 }

      - type: 'timeseries'
        title: 'Time Spent by Downstream Operations'
        sql: |
          WITH service_spans AS (
            SELECT
              extract(epoch from time_bucket('{{rollup_interval}}', timestamp))::integer AS time,
              context___span_id as span_id,
              context___trace_id as trace_id
            FROM otel_logs_and_spans
            WHERE project_id='{{project_id}}'
              AND resource___service___name = '{{var-service}}'
              AND kind = 'server'
              {{time_filter}}
          ),
          downstream_time AS (
            SELECT
              ss.time,
              o.name as operation,
              SUM(o.duration)::float as duration_ns
            FROM otel_logs_and_spans o
            INNER JOIN service_spans ss ON o.context___trace_id = ss.trace_id AND o.parent_id = ss.span_id
            WHERE o.project_id='{{project_id}}'
              AND o.duration IS NOT NULL
              AND o.name IS NOT NULL
              {{time_filter}}
            GROUP BY ss.time, o.name
          )
          SELECT
            time,
            operation,
            duration_ns as value
          FROM downstream_time
          ORDER BY time DESC
          LIMIT 10000
        unit: ns
        layout: { w: 6, h: 4 }

      # The service's own containers beside its latency: a p99 spike that lines up with CPU
      # pinned at its limit or memory at its ceiling is a capacity problem, not a code one.
      - type: group
        title: '{{var-service}} infrastructure'
        description: 'Resource use of the containers running this service (needs the kubeletstats or docker_stats receiver).'
        layout: { w: 12, h: 5 }
        children:
          - type: 'timeseries_line'
            title: 'CPU by pod'
            hide_value: true
            unit: cores
            query: metrics | where metric_name == "container.cpu.usage" and resource.service.name == "{{var-service}}" | summarize avg(value) by bin_auto(timestamp), resource.k8s.pod.name
            layout: { w: 4, h: 4 }

          - type: 'timeseries_line'
            title: 'Memory vs limit'
            hide_value: true
            description: 'Peak working set against the container memory limit. Where the lines meet, the container is OOM-killed.'
            unit: By
            query: |
              metrics | where metric_name in ("container.memory.working_set", "k8s.container.memory_limit") and resource.service.name == "{{var-service}}"
              | extend series = case(metric_name == "k8s.container.memory_limit", "limit", "working set")
              | summarize max(value) by bin_auto(timestamp), series
            layout: { w: 4, h: 4 }

          - type: 'timeseries'
            title: 'Network traffic'
            description: 'Bytes per second received and sent by this service''s pods.'
            unit: By
            hide_value: true
            query: |
              metrics | where metric_name in ("k8s.pod.network.io", "container.network.io") and resource.service.name == "{{var-service}}"
              | extend series = case(attributes.direction == "transmit", "sent", "received")
              | summarize rate(value) by bin_auto(timestamp), series
            layout: { w: 4, h: 4 }

      # 4. Resources table
      - type: table
        title: 'Inbound Endpoints'
        description: 'HTTP and gRPC entry points for this service. Click a row to filter charts above.'
        layout: { w: 12, h: 5 }
        on_row_click:
          set_variable: resource
          value: '{{row.resource_name}}'
        columns:
          - field: resource_name
            sortable: true
            title: Resource Name
          - field: requests
            sortable: true
            title: Requests
            column_type: number
            progress: column_percent
          - field: total_time
            sortable: true
            title: Total Time
            column_type: duration
            unit: s
            progress: column_percent
          - field: p95_latency
            sortable: true
            title: P95 Latency
            column_type: duration
            unit: ms
            progress: column_percent
          - field: errors
            sortable: true
            title: Errors
            column_type: number
            progress: column_percent
            progress_variant: error
          - field: error_rate
            column_type: number
            sortable: true
            title: Error Rate (%)
            progress: value_percent
            progress_variant: error
        sql: |
          SELECT
            name as resource_name,
            COUNT(*) as requests,
            ROUND((SUM(duration)::float8 / 1e9)::numeric, 2) as total_time,
            ROUND((approx_percentile(0.95, percentile_agg(duration))::numeric / 1e6), 2) as p95_latency,
            COUNT(*) FILTER (WHERE status_code = 'ERROR' OR COALESCE(attributes___http___response___status_code, 0) >= 400) as errors,
            (COUNT(*) FILTER (WHERE status_code = 'ERROR' OR COALESCE(attributes___http___response___status_code, 0) >= 400) * 100.0 / GREATEST(1, COUNT(*)))::numeric as error_rate
          FROM otel_logs_and_spans
          WHERE project_id='{{project_id}}'
            AND name IS NOT NULL
            AND kind = 'server'
            AND resource___service___name = '{{var-service}}'
            {{time_filter}}
          GROUP BY name
          ORDER BY {{table_sort}}
          LIMIT 100
        default_sort: "COUNT(*) DESC"

      # 5. Traces
      - type: 'timeseries'
        title: 'Avg Latency by Endpoint'
        sql: |
          WITH operation_stats AS (
            SELECT
              name,
              AVG(duration) as avg_duration_ns
            FROM otel_logs_and_spans
            WHERE project_id='{{project_id}}'
              AND name IS NOT NULL
              AND resource___service___name = '{{var-service}}'
              AND kind = 'server'
              AND duration IS NOT NULL
              {{time_filter}}
            GROUP BY name
            ORDER BY avg_duration_ns DESC
            LIMIT 10
          )
          SELECT
            extract(epoch from time_bucket('{{rollup_interval}}', timestamp))::integer AS time,
            o.name,
            AVG(o.duration)::float as value
          FROM otel_logs_and_spans o
          INNER JOIN operation_stats s ON o.name = s.name
          WHERE o.project_id='{{project_id}}'
            AND o.resource___service___name = '{{var-service}}'
            AND o.kind = 'server'
            AND o.duration IS NOT NULL
            {{time_filter}}
          GROUP BY time, o.name
          ORDER BY time DESC
        unit: ns
        layout: { w: 12, h: 4 }

      # Its own inbound requests, not root spans: a service behind a proxy or gateway is never a trace root.
      - type: logs
        title: 'Recent requests'
        query: 'kind == "server" and resource.service.name == "{{var-service}}"'
        layout: { w: 12, h: 5 }

      # 6. Operations breakdown
      - type: table
        title: 'All Operations'
        description: 'Every span this service produces — includes DB queries, downstream calls, and internal operations.'
        layout: { w: 12, h: 6 }
        columns:
          - field: operation_name
            sortable: true
            title: Operation
          - field: count
            sortable: true
            title: Count
            column_type: number
            progress: column_percent
          - field: error_rate
            column_type: number
            sortable: true
            title: Error Rate
            unit: '%'
            progress: value_percent
            progress_variant: error
          - field: avg_duration
            sortable: true
            title: Avg Duration
            column_type: duration
            unit: ms
            progress: column_percent
          - field: p95_duration
            sortable: true
            title: P95 Duration
            column_type: duration
            unit: ms
            progress: column_percent
        sql: |
          SELECT
            name as operation_name,
            COUNT(*) as count,
            (COUNT(*) FILTER (WHERE status_code = 'ERROR' OR COALESCE(attributes___http___response___status_code, 0) >= 400) * 100.0 / GREATEST(1, COUNT(*)))::numeric as error_rate,
            ROUND((AVG(duration) / 1e6)::numeric, 2) as avg_duration,
            ROUND((approx_percentile(0.95, percentile_agg(duration))::numeric / 1e6), 2) as p95_duration
          FROM otel_logs_and_spans
          WHERE project_id='{{project_id}}'
            AND resource___service___name = '{{var-service}}'
            AND name IS NOT NULL
            AND duration IS NOT NULL
            {{time_filter}}
          GROUP BY name
          ORDER BY {{table_sort}}
          LIMIT 100
        default_sort: "COUNT(*) DESC"

  # Severity comes from the OTel severity number first: most SDKs send it without the text
  # level, and filtering on `level` alone read those logs as levelless.
  - name: Logs
    variables: [service]
    icon: file-text
    widgets:
      - type: group
        title: Log health
        layout: { w: 12, h: 3 }
        children:
          - type: 'timeseries_stat'
            title: 'Logs'
            icon: file-text
            query: |
              kind == "log" and ("{{var-service}}" == "" or resource.service.name == "{{var-service}}")
              | summarize count() by bin_auto(timestamp)
            unit: logs
            layout: { w: 3, h: 2 }

          - type: 'timeseries_stat'
            title: 'Errors'
            icon: alert-triangle
            query: |
              kind == "log" and (severity.severity_number >= 17 or level in ("ERROR", "FATAL")) and ("{{var-service}}" == "" or resource.service.name == "{{var-service}}")
              | summarize count() by bin_auto(timestamp)
            unit: errors
            series_intent: error
            layout: { w: 3, h: 2 }

          - type: 'timeseries_stat'
            title: 'Warnings'
            icon: alert-circle
            query: |
              kind == "log" and ((severity.severity_number >= 13 and severity.severity_number < 17) or level == "WARN") and ("{{var-service}}" == "" or resource.service.name == "{{var-service}}")
              | summarize count() by bin_auto(timestamp)
            unit: warnings
            layout: { w: 3, h: 2 }

          - type: 'timeseries_stat'
            title: 'Error share'
            description: 'Errors as a share of all logs. A rising share with flat volume is a real regression; a rising count with a flat share is just more traffic.'
            icon: percent
            query: |
              kind == "log" and ("{{var-service}}" == "" or resource.service.name == "{{var-service}}")
              | summarize countif(severity.severity_number >= 17 or level in ("ERROR", "FATAL")) * 100.0 / count() by bin_auto(timestamp)
            unit: '%'
            summarize_by: mean
            warning_threshold: 1
            alert_threshold: 5
            layout: { w: 3, h: 2 }

      - type: 'timeseries'
        title: 'Log volume by severity'
        query: |
          kind == "log" and ("{{var-service}}" == "" or resource.service.name == "{{var-service}}")
          | extend severity = case(severity.severity_number >= 21, "FATAL", severity.severity_number >= 17, "ERROR", severity.severity_number >= 13, "WARN", severity.severity_number >= 9, "INFO", severity.severity_number >= 5, "DEBUG", severity.severity_number >= 1, "TRACE", coalesce(level, "UNSET"))
          | summarize count() by bin_auto(timestamp), severity
        unit: logs
        layout: { w: 6, h: 4 }

      - type: 'timeseries'
        title: 'Errors and warnings by service'
        description: 'Which service is complaining. Click a series in the legend to isolate it.'
        theme: 'roma'
        query: |
          kind == "log" and (severity.severity_number >= 13 or level in ("ERROR", "FATAL", "WARN")) and ("{{var-service}}" == "" or resource.service.name == "{{var-service}}")
          | summarize count() by bin_auto(timestamp), resource.service.name
        unit: logs
        layout: { w: 6, h: 4 }

      - type: table
        title: 'Top error and warning messages'
        description: 'The loudest problems in this window, grouped by message. Click one to read those logs in the Explorer.'
        layout: { w: 8, h: 6 }
        columns:
          - field: message
            sortable: true
            title: Message
            link: '/p/{{project_id}}/log_explorer?query=kind%20%3D%3D%20%22log%22%20and%20body%20contains%20%22{{row.message_kql}}%22{{time_range}}'
          - field: severity
            sortable: true
            title: Severity
          - field: service
            sortable: true
            title: Service
          - field: count
            sortable: true
            title: Count
            column_type: number
            progress: column_percent
            progress_variant: error
          - field: last_seen
            sortable: true
            title: Last seen
          - field: message_kql
            title: Explorer pattern
            hidden: true
        sql: |
          SELECT message,
            CASE WHEN MAX(sev) >= 17 THEN 'ERROR' ELSE 'WARN' END AS severity,
            MIN(service) AS service, COUNT(*) AS count, MAX(timestamp)::text AS last_seen,
            -- The message head as a KQL string body: cut at the first quote, backslashes escaped.
            replace(LEFT(SPLIT_PART(message, '"', 1), 120), '\', '\\') AS message_kql
          FROM (
            SELECT LEFT(TRIM(BOTH '"' FROM body::text), 200) AS message, resource___service___name AS service, timestamp,
              CASE WHEN level IN ('ERROR', 'FATAL') THEN 17 ELSE COALESCE(severity___severity_number, 13) END AS sev
            FROM otel_logs_and_spans
            WHERE project_id='{{project_id}}' AND kind = 'log'
              AND (severity___severity_number >= 13 OR level IN ('ERROR', 'FATAL', 'WARN'))
              AND ('{{var-service}}' = '' OR resource___service___name = '{{var-service}}')
              {{time_filter}}
          ) l
          GROUP BY message
          ORDER BY {{table_sort}}
          LIMIT 50
        default_sort: 'COUNT(*) DESC'

      - type: table
        title: 'Log volume by service'
        description: 'Who writes the most logs, and how much of it is trouble. Click a service to scope this tab to it.'
        layout: { w: 4, h: 6 }
        on_row_click:
          set_variable: service
          value: '{{row.service}}'
        columns:
          - field: service
            sortable: true
            title: Service
          - field: logs
            sortable: true
            title: Logs
            column_type: number
            progress: column_percent
          - field: error_pct
            sortable: true
            title: Errors
            column_type: number
            unit: '%'
            decimals: 1
            progress: value_percent
            progress_variant: error
        sql: |
          SELECT resource___service___name AS service, COUNT(*) AS logs,
            COUNT(*) FILTER (WHERE severity___severity_number >= 17 OR level IN ('ERROR', 'FATAL')) * 100.0 / COUNT(*) AS error_pct
          FROM otel_logs_and_spans
          WHERE project_id='{{project_id}}' AND kind = 'log' AND resource___service___name IS NOT NULL {{time_filter}}
          GROUP BY 1
          ORDER BY {{table_sort}}
          LIMIT 50
        default_sort: 'COUNT(*) DESC'

      - type: anomalies
        title: 'Error patterns'
        layout: { w: 12, h: 5 }

      - type: logs
        title: 'Log stream'
        layout: { w: 12, h: 10 }
        query: |
          kind == "log" and ("{{var-service}}" == "" or resource.service.name == "{{var-service}}")

  - name: Databases
    variables: [database]
    icon: database
    requires: database
    widgets:
      # Database Performance Metrics
      - type: group
        title: '{{var-database}} Performance'
        layout: { w: 12, h: 4 }
        children:
          - type: 'timeseries_stat'
            title: 'Total Queries'
            icon: database
            query: |
              attributes.db.system.name == "{{var-database}}"
              | summarize count() by bin_auto(timestamp)
            unit: queries
            layout: { w: 3, h: 2 }

          # A count, not a rate: 17 errors in 1.4M queries rounded to 0.00%.
          - type: 'timeseries_stat'
            title: 'Query Errors'
            icon: alert-triangle
            query: |
              attributes.db.system.name == "{{var-database}}" and status_code == "ERROR"
              | summarize count() by bin_auto(timestamp)
            unit: errors
            series_intent: error
            layout: { w: 3, h: 2 }

          - type: 'timeseries_stat'
            title: 'P95 Query Time'
            icon: clock
            query: |
              attributes.db.system.name == "{{var-database}}" and duration != null
              | summarize p95(duration) / 1000000 by bin_auto(timestamp)
            unit: ms
            summarize_by: mean
            layout: { w: 3, h: 2 }

          - type: 'stat'
            title: 'Slow Queries (>50ms)'
            icon: turtle
            sql: |
              SELECT COALESCE(COUNT(*), 0)::float8
              FROM otel_logs_and_spans
              WHERE project_id='{{project_id}}'
                AND attributes___db___system___name IS NOT NULL
                AND duration > 50000000
                AND attributes___db___system___name = '{{var-database}}'
                {{time_filter}}
            unit: queries
            layout: { w: 3, h: 2 }

      # Receiver metric prefixes are the db.system.name values, so the selected database picks its own metrics.
      - type: group
        title: '{{var-database}} server'
        description: 'Server health from the database''s own receiver (postgresql, redis, mysql or mongodb).'
        layout: { w: 12, h: 5 }
        children:
          - type: 'timeseries_line'
            title: 'Connections'
            hide_subtitle: true
            hide_value: true
            description: 'Open connections against the server''s limit. Running out of connections stalls every client at once.'
            unit: connections
            sql: |
              SELECT time, series, SUM(v) AS value FROM (
                SELECT extract(epoch from time_bucket('{{rollup_interval}}', timestamp))::integer AS time,
                  CASE WHEN metric_name LIKE '%.max' THEN 'limit' ELSE 'open' END AS series, AVG(value) AS v
                FROM otel_metrics
                WHERE project_id='{{project_id}}'
                  AND metric_name IN ('postgresql.backends', 'postgresql.connection.max', 'redis.clients.connected', 'mysql.threads', 'mongodb.connection.count')
                  AND metric_name LIKE '{{var-database}}.%' {{time_filter}}
                GROUP BY 1, 2, series_id
              ) c GROUP BY 1, 2 ORDER BY 1 DESC
            layout: { w: 4, h: 4 }

          - type: 'timeseries_line'
            title: 'Cache hit ratio'
            summarize_by: mean
            description: 'Reads served from memory (Postgres buffer cache, Redis keyspace). Below ~95% on Postgres the working set no longer fits in shared buffers.'
            unit: '%'
            query: |
              metrics | where metric_name in ("postgresql.blks_hit", "postgresql.blks_read", "redis.keyspace.hits", "redis.keyspace.misses") and metric_name startswith "{{var-database}}."
              | summarize rateif(value, metric_name in ("postgresql.blks_hit", "redis.keyspace.hits")) * 100.0 / rate(value) by bin_auto(timestamp)
            layout: { w: 4, h: 4 }

          - type: 'timeseries'
            title: 'Server throughput'
            description: 'Operations per second as the server counts them — transactions committed and rolled back, or commands processed.'
            unit: ops/s
            hide_value: true
            query: |
              metrics | where metric_name in ("postgresql.commits", "postgresql.rollbacks", "redis.commands.processed", "mysql.operations", "mongodb.operation.count") and metric_name startswith "{{var-database}}."
              | summarize rate(value) by bin_auto(timestamp), metric_name
            layout: { w: 4, h: 4 }

      # TOP: Query Optimization Targets - Sorted by TOTAL TIME spent
      - type: table
        title: 'Query Optimization Targets (by Total Time)'
        description: 'Queries sorted by total time spent. Optimizing these yields the biggest performance gains.'
        layout: { w: 12, h: 7 }
        columns:
          - field: query_pattern
            sortable: true
            title: Query Pattern
            copyable: true
            link: '/p/{{project_id}}/log_explorer?query=attributes.db.query.summary%20startswith%20%22{{row.pattern_kql}}%22%20or%20attributes.db.query.text%20startswith%20%22{{row.pattern_kql}}%22%20or%20name%20startswith%20%22{{row.pattern_kql}}%22{{time_range}}'
          - field: count
            sortable: true
            title: Count
            column_type: number
          - field: avg_ms
            sortable: true
            title: Avg
            column_type: duration
            unit: ms
          - field: p95_ms
            sortable: true
            title: P95
            column_type: duration
            unit: ms
          - field: total_time
            sortable: true
            title: Total Time
            column_type: duration
            unit: s
            progress: column_percent
          - field: errors
            sortable: true
            title: Errors
            column_type: number
          - field: pattern_kql
            title: Explorer pattern
            hidden: true
        sql: |
          SELECT
            LEFT(COALESCE(
              NULLIF(attributes___db___query___summary, ''),
              attributes___db___query___text,
              CASE WHEN attributes___db___system___name = 'redis' THEN SPLIT_PART(name, ' ', 1)
                   ELSE name END
            ), 2000) as query_pattern,
            COUNT(*) as count,
            ROUND((AVG(duration) / 1e6)::numeric, 2) as avg_ms,
            ROUND((approx_percentile(0.95, percentile_agg(duration)) / 1e6)::numeric, 2) as p95_ms,
            ROUND((SUM(duration)::float8 / 1e9)::numeric, 2) as total_time,
            COUNT(*) FILTER (WHERE status_code = 'ERROR') as errors,
            -- The pattern's head as a KQL string body (backslash and quote escaped) for the Explorer link.
            MIN(replace(replace(LEFT(COALESCE(
              NULLIF(attributes___db___query___summary, ''),
              attributes___db___query___text,
              CASE WHEN attributes___db___system___name = 'redis' THEN SPLIT_PART(name, ' ', 1)
                   ELSE name END
            ), 200), '\', '\\'), '"', '\"')) as pattern_kql
          FROM otel_logs_and_spans
          WHERE project_id='{{project_id}}'
            AND attributes___db___system___name IS NOT NULL
            AND duration IS NOT NULL
            AND attributes___db___system___name = '{{var-database}}'
            {{time_filter}}
          GROUP BY query_pattern
          ORDER BY {{table_sort}}
          LIMIT 30
        default_sort: "SUM(duration) DESC"

      # Database Systems Overview
      - type: table
        title: 'Database Systems'
        description: 'Click a database to filter all widgets on this tab.'
        layout: { w: 6, h: 5 }
        on_row_click:
          set_variable: database
          value: '{{row.db_system}}'
        columns:
          - field: db_system
            sortable: true
            title: Database
          - field: operations
            sortable: true
            title: Count
            column_type: number
            progress: column_percent
          - field: avg_duration
            sortable: true
            title: Avg
            column_type: duration
            unit: ms
          - field: errors
            sortable: true
            title: Errors
            column_type: number
            progress: column_percent
            progress_variant: error
        sql: |
          SELECT
            attributes___db___system___name as db_system,
            COUNT(*) as operations,
            ROUND((AVG(duration) / 1e6)::numeric, 2) as avg_duration,
            COUNT(*) FILTER (WHERE status_code = 'ERROR') as errors
          FROM otel_logs_and_spans
          WHERE project_id='{{project_id}}'
            AND attributes___db___system___name IS NOT NULL
            AND duration IS NOT NULL
            {{time_filter}}
          GROUP BY db_system
          ORDER BY {{table_sort}}
        default_sort: "COUNT(*) DESC"

      # Queries by Operation Type
      - type: table
        title: 'Queries by Operation Type'
        layout: { w: 6, h: 5 }
        columns:
          - field: operation
            sortable: true
            title: Operation
          - field: count
            sortable: true
            title: Count
            column_type: number
            progress: column_percent
          - field: avg_ms
            sortable: true
            title: Avg
            column_type: duration
            unit: ms
          - field: errors
            sortable: true
            title: Errors
            column_type: number
            progress: column_percent
            progress_variant: error
        sql: |
          SELECT
            UPPER(COALESCE(attributes___db___operation___name, SPLIT_PART(name, ' ', 1), 'UNKNOWN')) as operation,
            COUNT(*) as count,
            ROUND((AVG(duration) / 1e6)::numeric, 2) as avg_ms,
            COUNT(*) FILTER (WHERE status_code = 'ERROR') as errors
          FROM otel_logs_and_spans
          WHERE project_id='{{project_id}}'
            AND attributes___db___system___name IS NOT NULL
            AND duration IS NOT NULL
            AND attributes___db___system___name = '{{var-database}}'
            {{time_filter}}
          GROUP BY operation
          ORDER BY {{table_sort}}
          LIMIT 10
        default_sort: "COUNT(*) DESC"

      - type: heatmap
        title: 'Query latency distribution'
        description: 'Every query in a log-scaled latency bucket over time, shaded by count, errors in red. A second band above the main one is usually one slow query pattern.'
        query: |
          attributes.db.system.name == "{{var-database}}" and duration > 0
          | summarize count() by bin_auto(timestamp), log_bin(duration), iff(status_code == "ERROR", "error", "ok")
        unit: ns
        layout: { w: 12, h: 4 }

      # Query Latency Over Time
      - type: 'timeseries_line'
        title: 'Query Latency Percentiles'
        query: |
          attributes.db.system.name == "{{var-database}}" and duration != null
          | summarize percentiles(duration, 50, 95, 99) by bin_auto(timestamp)
          | order by timestamp desc
        unit: ns
        layout: { w: 6, h: 4 }

      # Query Volume Over Time
      - type: 'timeseries'
        title: 'Query Volume by Database'
        query: |
          attributes.db.system.name == "{{var-database}}"
          | summarize count() by bin_auto(timestamp), attributes.db.system.name
          | order by timestamp desc
          | limit 10000
        unit: queries
        layout: { w: 6, h: 4 }

      # Slowest queries grouped by normalized pattern, sorted by peak (max) duration.
      # Complements "Optimization Targets" (which sorts by total time spent) — this
      # surfaces the queries with the worst worst-case latency.
      - type: table
        title: 'Slowest Query Patterns'
        description: 'Queries grouped by their normalized pattern, ordered by peak duration. Use Optimization Targets above for total-time impact.'
        layout: { w: 12, h: 5 }
        columns:
          - field: query_pattern
            sortable: true
            title: Query Pattern
            copyable: true
            link: '/p/{{project_id}}/log_explorer?query=attributes.db.query.summary%20startswith%20%22{{row.pattern_kql}}%22%20or%20attributes.db.query.text%20startswith%20%22{{row.pattern_kql}}%22%20or%20name%20startswith%20%22{{row.pattern_kql}}%22{{time_range}}'
          - field: count
            sortable: true
            title: Count
            column_type: number
          - field: max_ms
            sortable: true
            title: Peak
            column_type: duration
            unit: ms
            progress: column_percent
          - field: avg_ms
            sortable: true
            title: Avg
            column_type: duration
            unit: ms
          - field: last_seen
            sortable: true
            title: Last Seen
          - field: pattern_kql
            title: Explorer pattern
            hidden: true
        sql: |
          -- Two-stage to keep aggregation cheap: top-500 slowest individual
          -- executions, then collapse to patterns. Key stays short (300 chars)
          -- so GROUP BY cardinality is bounded.
          SELECT
            query_pattern,
            COUNT(*) as count,
            ROUND((MAX(duration) / 1e6)::numeric, 2) as max_ms,
            ROUND((AVG(duration) / 1e6)::numeric, 2) as avg_ms,
            MAX(timestamp)::text as last_seen,
            replace(replace(LEFT(query_pattern, 200), '\', '\\'), '"', '\"') as pattern_kql
          FROM (
            SELECT
              duration,
              timestamp,
              LEFT(COALESCE(
                NULLIF(attributes___db___query___summary, ''),
                CASE WHEN attributes___db___system___name = 'redis' THEN SPLIT_PART(name, ' ', 1)
                     ELSE COALESCE(attributes___db___query___text, name) END
              ), 300) as query_pattern
            FROM otel_logs_and_spans
            WHERE project_id='{{project_id}}'
              AND attributes___db___system___name = '{{var-database}}'
              AND duration IS NOT NULL
              {{time_filter}}
            ORDER BY duration DESC
            LIMIT 500
          ) top_slow
          GROUP BY query_pattern
          ORDER BY {{table_sort}}
          LIMIT 30
        default_sort: "MAX(duration) DESC"

      # Database Errors
      - type: 'timeseries'
        title: 'Database Errors'
        theme: 'roma'
        query: |
          attributes.db.system.name == "{{var-database}}" and status_code == "ERROR"
          | summarize count() by bin_auto(timestamp), attributes.db.system.name
          | order by timestamp desc
          | limit 10000
        unit: errors
        series_intent: error
        layout: { w: 6, h: 4 }

      # The failures themselves. The message is cut at its first double quote so the
      # link's `contains "…"` is always valid KQL and still matches the full message.
      - type: table
        title: 'Recent Database Errors'
        layout: { w: 12, h: 5 }
        columns:
          - field: error_message
            sortable: true
            title: Error
            copyable: true
            link: '/p/{{project_id}}/log_explorer?query=status_code%20%3D%3D%20%22ERROR%22%20and%20status_message%20contains%20%22{{row.error_message}}%22'
          - field: query_pattern
            sortable: true
            title: Query Pattern
            copyable: true
          - field: count
            sortable: true
            title: Count
            column_type: number
          - field: last_seen
            sortable: true
            title: Last Seen
        sql: |
          SELECT
            LEFT(SPLIT_PART(COALESCE(NULLIF(status_message, ''), attributes___exception___message, 'Unknown error'), '"', 1), 160) as error_message,
            LEFT(COALESCE(NULLIF(attributes___db___query___summary, ''), attributes___db___query___text, name), 2000) as query_pattern,
            COUNT(*) as count,
            MAX(timestamp)::text as last_seen
          FROM otel_logs_and_spans
          WHERE project_id='{{project_id}}'
            AND attributes___db___system___name = '{{var-database}}'
            AND status_code = 'ERROR'
            {{time_filter}}
          GROUP BY 1, 2
          ORDER BY {{table_sort}}
          LIMIT 50
        default_sort: "MAX(timestamp) DESC"

      # Query volume by service
      - type: 'timeseries'
        title: 'Queries by Service'
        query: |
          attributes.db.system.name == "{{var-database}}"
          | summarize count() by bin_auto(timestamp), resource.service.name
          | order by timestamp desc
          | limit 10000
        unit: queries
        layout: { w: 6, h: 4 }

  # USE method per resource: what is hot, what is about to run out, what is failing.
  - name: Infra
    variables: []
    icon: server
    widgets:
      - type: group
        title: Cluster at a glance
        layout: { w: 12, h: 3 }
        children:
          - type: 'timeseries_stat'
            title: 'CPU in use'
            description: 'Cores busy across every container, averaged per container then summed.'
            icon: microchip
            unit: cores
            summarize_by: mean
            decimals: 2
            sql: |
              SELECT time, 'total' AS series, SUM(v) AS value FROM (
                SELECT extract(epoch from time_bucket('{{rollup_interval}}', timestamp))::integer AS time, AVG(value) AS v
                FROM otel_metrics
                WHERE project_id='{{project_id}}' AND metric_name = 'container.cpu.usage' {{time_filter}}
                GROUP BY 1, series_id
              ) c GROUP BY time ORDER BY time DESC
            layout: { w: 3, h: 2 }

          - type: 'timeseries_stat'
            title: 'Memory in use'
            description: 'Working set across every container — the figure the kernel OOM-kills on.'
            icon: hard-drive
            unit: By
            summarize_by: mean
            sql: |
              SELECT time, 'total' AS series, SUM(v) AS value FROM (
                SELECT extract(epoch from time_bucket('{{rollup_interval}}', timestamp))::integer AS time, AVG(value) AS v
                FROM otel_metrics
                WHERE project_id='{{project_id}}' AND metric_name = 'container.memory.working_set' {{time_filter}}
                GROUP BY 1, series_id
              ) c GROUP BY time ORDER BY time DESC
            layout: { w: 3, h: 2 }

          - type: 'stat'
            title: 'Near memory limit'
            description: 'Containers whose working set reached 90% of their memory limit in this window. They are next in line for an OOM kill.'
            icon: triangle-exclamation
            unit: containers
            warning_threshold: 1
            alert_threshold: 3
            sql: *near_memory_limit
            layout: { w: 3, h: 2 }

          - type: 'stat'
            title: 'Container restarts'
            description: 'Restarts in this window. Any restart is a crash, an OOM kill or a failed probe.'
            icon: rotate-left
            unit: restarts
            warning_threshold: 1
            alert_threshold: 5
            # Per pod and container, not series_id: a restart changes the series, so a per-series increase reads 0.
            sql: |
              SELECT COALESCE(SUM(r), 0)::float8 FROM (
                SELECT MAX(value) - MIN(value) AS r
                FROM otel_metrics
                WHERE project_id='{{project_id}}' AND metric_name = 'k8s.container.restarts' {{time_filter}}
                GROUP BY resource___k8s___pod___name, resource___k8s___container___name
              ) c
            layout: { w: 3, h: 2 }

      - type: 'timeseries'
        title: 'CPU by container'
        hide_value: true
        hide_subtitle: true
        description: 'Cores each container burns. A band that widens with traffic is load; one that widens without it is a leak or a hot loop.'
        unit: cores
        sql: |
          SELECT extract(epoch from time_bucket('{{rollup_interval}}', timestamp))::integer AS time,
            COALESCE(resource___k8s___container___name, resource___container___name, resource___service___name, 'unknown') AS series,
            AVG(value) AS value
          FROM otel_metrics
          WHERE project_id='{{project_id}}' AND metric_name = 'container.cpu.usage' {{time_filter}}
          GROUP BY 1, 2 ORDER BY 1 DESC
        layout: { w: 6, h: 4 }

      - type: 'timeseries_line'
        title: 'Memory headroom'
        description: 'Working set as a share of each container''s memory limit, for the five closest to it. At 100% the container is OOM-killed.'
        unit: '%'
        warning_threshold: 80
        alert_threshold: 95
        show_threshold_lines: always
        sql: |
          WITH lim AS (
            SELECT resource___k8s___pod___name AS pod, resource___k8s___container___name AS c, MAX(value) AS l
            FROM otel_metrics
            WHERE project_id='{{project_id}}' AND metric_name = 'k8s.container.memory_limit' {{time_filter}}
            GROUP BY 1, 2
          ), ws AS (
            SELECT time_bucket('{{rollup_interval}}', timestamp) AS t, resource___k8s___pod___name AS pod, resource___k8s___container___name AS c, AVG(value) AS v
            FROM otel_metrics
            WHERE project_id='{{project_id}}' AND metric_name = 'container.memory.working_set' {{time_filter}}
            GROUP BY 1, 2, 3
          ), pct AS (
            SELECT ws.t, ws.c, MAX(ws.v / lim.l * 100) AS p FROM ws JOIN lim ON ws.pod = lim.pod AND ws.c = lim.c WHERE lim.l > 0 GROUP BY 1, 2
          ), top AS (SELECT c FROM pct GROUP BY c ORDER BY MAX(p) DESC LIMIT 5)
          SELECT extract(epoch from pct.t)::integer AS time, pct.c AS series, pct.p AS value
          FROM pct JOIN top ON pct.c = top.c ORDER BY 1 DESC
        layout: { w: 6, h: 4 }

      - type: table
        title: 'Containers'
        description: 'Utilization and saturation per container. Click a row to open its service.'
        layout: { w: 12, h: 7 }
        on_row_click:
          set_variable: service
          value: '{{row.service}}'
          navigate_to_tab: 'Service'
        columns:
          - field: container
            sortable: true
            title: Container
          - field: service
            sortable: true
            title: Service
          - field: pods
            sortable: true
            title: Pods
            column_type: number
          - field: cpu
            sortable: true
            title: CPU
            description: 'Average cores in use'
            column_type: number
            unit: cores
            decimals: 3
            progress: column_percent
          - field: cpu_peak
            sortable: true
            title: CPU peak
            column_type: number
            unit: cores
            decimals: 3
          - field: mem
            sortable: true
            title: Memory
            description: 'Average working set'
            column_type: number
            unit: By
            progress: column_percent
          - field: mem_pct
            sortable: true
            title: '% of limit'
            description: 'Peak working set as a share of the memory limit. Blank when the container has no limit.'
            column_type: number
            unit: '%'
            progress: value_percent
            progress_variant: warning
          - field: restarts
            sortable: true
            title: Restarts
            column_type: number
            progress: column_percent
            progress_variant: error
        sql: |
          WITH per AS (
            SELECT
              COALESCE(resource___k8s___container___name, resource___container___name) AS container,
              resource___k8s___pod___name AS pod,
              MAX(resource___service___name) AS service,
              AVG(value) FILTER (WHERE metric_name = 'container.cpu.usage') AS cpu,
              MAX(value) FILTER (WHERE metric_name = 'container.cpu.usage') AS cpu_peak,
              AVG(value) FILTER (WHERE metric_name = 'container.memory.working_set') AS mem,
              MAX(value) FILTER (WHERE metric_name = 'container.memory.working_set')
                / NULLIF(MAX(value) FILTER (WHERE metric_name = 'k8s.container.memory_limit'), 0) AS mem_ratio,
              MAX(value) FILTER (WHERE metric_name = 'k8s.container.restarts') - MIN(value) FILTER (WHERE metric_name = 'k8s.container.restarts') AS restarts
            FROM otel_metrics
            WHERE project_id='{{project_id}}'
              AND metric_name IN ('container.cpu.usage', 'container.memory.working_set', 'k8s.container.memory_limit', 'k8s.container.restarts')
              {{time_filter}}
            GROUP BY 1, 2
          )
          SELECT container, MAX(service) AS service, COUNT(DISTINCT pod) AS pods,
            ROUND(SUM(cpu)::numeric, 3) AS cpu, ROUND(SUM(cpu_peak)::numeric, 3) AS cpu_peak,
            ROUND(SUM(mem)::numeric) AS mem, ROUND((MAX(mem_ratio) * 100)::numeric, 1) AS mem_pct,
            COALESCE(SUM(restarts), 0) AS restarts
          FROM per
          WHERE container IS NOT NULL AND (cpu IS NOT NULL OR mem IS NOT NULL)
          GROUP BY container
          ORDER BY {{table_sort}}
          LIMIT 100
        default_sort: 'MAX(mem_ratio) DESC NULLS LAST, SUM(cpu) DESC'

      - type: 'timeseries'
        title: 'Memory by container'
        hide_value: true
        hide_subtitle: true
        description: 'Working set per container. A sawtooth is a garbage collector; a staircase that never comes down is a leak.'
        unit: By
        sql: |
          SELECT extract(epoch from time_bucket('{{rollup_interval}}', timestamp))::integer AS time,
            COALESCE(resource___k8s___container___name, resource___container___name, resource___service___name, 'unknown') AS series,
            AVG(value) AS value
          FROM otel_metrics
          WHERE project_id='{{project_id}}' AND metric_name = 'container.memory.working_set' {{time_filter}}
          GROUP BY 1, 2 ORDER BY 1 DESC
        layout: { w: 6, h: 4 }

      - type: 'timeseries'
        title: 'Network traffic by service'
        hide_value: true
        hide_subtitle: true
        description: 'Bytes per second received and sent by each service''s pods.'
        unit: By
        query: |
          metrics | where metric_name in ("k8s.pod.network.io", "container.network.io")
          | summarize rate(value) by bin_auto(timestamp), resource.service.name, attributes.direction
        layout: { w: 6, h: 4 }

      - type: 'timeseries_line'
        title: 'Node CPU'
        hide_value: true
        hide_subtitle: true
        description: 'Cores in use per node.'
        unit: cores
        query: metrics | where metric_name == "k8s.node.cpu.usage" | summarize avg(value) by bin_auto(timestamp), resource.k8s.node.name
        layout: { w: 4, h: 4 }

      - type: 'timeseries_line'
        title: 'Node memory'
        hide_value: true
        hide_subtitle: true
        description: 'Working set per node.'
        unit: By
        query: metrics | where metric_name == "k8s.node.memory.working_set" | summarize avg(value) by bin_auto(timestamp), resource.k8s.node.name
        layout: { w: 4, h: 4 }

      - type: 'timeseries_line'
        title: 'Node disk used'
        description: 'Filesystem used as a share of capacity, per node. Past 85% the kubelet starts evicting pods.'
        unit: '%'
        warning_threshold: 75
        alert_threshold: 85
        show_threshold_lines: always
        sql: |
          SELECT extract(epoch from time_bucket('{{rollup_interval}}', timestamp))::integer AS time,
            COALESCE(resource->'k8s'->'node'->>'name', resource___host___name, 'unknown') AS series,
            AVG(value) FILTER (WHERE metric_name = 'k8s.node.filesystem.usage')
              / NULLIF(AVG(value) FILTER (WHERE metric_name = 'k8s.node.filesystem.capacity'), 0) * 100 AS value
          FROM otel_metrics
          WHERE project_id='{{project_id}}' AND metric_name IN ('k8s.node.filesystem.usage', 'k8s.node.filesystem.capacity') {{time_filter}}
          GROUP BY 1, 2 ORDER BY 1 DESC
        layout: { w: 4, h: 4 }

      - type: table
        title: 'Workload availability'
        description: 'Deployments and stateful sets with fewer ready replicas than desired at any point in this window come first.'
        layout: { w: 6, h: 5 }
        columns:
          - field: workload
            sortable: true
            title: Workload
          - field: kind
            sortable: true
            title: Kind
          - field: desired
            sortable: true
            title: Desired
            column_type: number
          - field: available
            sortable: true
            title: Available
            description: 'Fewest replicas available at any point in this window'
            column_type: number
          - field: missing
            sortable: true
            title: Missing
            description: 'Desired minus the fewest available'
            column_type: number
            progress: column_percent
            progress_variant: error
        sql: |
          -- Two scans, not one IN-list over all four metrics: TimeFusion fails that plan with
          -- "variant_get_step needs a scalar key" for some time windows.
          SELECT workload, kind, MAX(desired) AS desired, MIN(available) AS available, MAX(desired) - MIN(available) AS missing
          FROM (
            SELECT resource->'k8s'->'deployment'->>'name' AS workload, 'Deployment' AS kind,
              CASE WHEN metric_name = 'k8s.deployment.desired' THEN value END AS desired,
              CASE WHEN metric_name = 'k8s.deployment.available' THEN value END AS available
            FROM otel_metrics
            WHERE project_id='{{project_id}}' AND metric_name IN ('k8s.deployment.desired', 'k8s.deployment.available') {{time_filter}}
            UNION ALL
            SELECT resource->'k8s'->'statefulset'->>'name', 'StatefulSet',
              CASE WHEN metric_name = 'k8s.statefulset.pod.desired' THEN value END,
              CASE WHEN metric_name = 'k8s.statefulset.pod.ready' THEN value END
            FROM otel_metrics
            WHERE project_id='{{project_id}}' AND metric_name IN ('k8s.statefulset.pod.desired', 'k8s.statefulset.pod.ready') {{time_filter}}
          ) w
          WHERE workload IS NOT NULL
          GROUP BY workload, kind
          ORDER BY {{table_sort}}
          LIMIT 100
        default_sort: 'MAX(desired) - MIN(available) DESC, workload'

      - type: 'timeseries_line'
        title: 'Kafka consumer lag'
        summarize_by: max
        description: 'Messages each consumer group is behind. A line that only climbs is a consumer that has stopped keeping up.'
        unit: messages
        query: metrics | where metric_name == "kafka.consumer_group.lag_sum" | summarize max(value) by bin_auto(timestamp), attributes.group
        layout: { w: 6, h: 5 }

      - type: group
        title: Runtimes
        description: 'Saturation inside the process: heap, goroutines, event-loop delay and thread-pool backlog, per service.'
        layout: { w: 12, h: 5 }
        children:
          - type: 'timeseries_line'
            title: 'JVM heap used'
            summarize_by: max
            unit: By
            sql: |
              SELECT time, service AS series, SUM(v) AS value FROM (
                SELECT extract(epoch from time_bucket('{{rollup_interval}}', timestamp))::integer AS time, resource___service___name AS service, AVG(value) AS v
                FROM otel_metrics
                WHERE project_id='{{project_id}}' AND metric_name = 'jvm.memory.used' AND attributes->'jvm'->'memory'->>'type' = 'heap' {{time_filter}}
                GROUP BY 1, 2, series_id
              ) h GROUP BY 1, 2 ORDER BY 1 DESC
            layout: { w: 3, h: 4 }

          - type: 'timeseries_line'
            title: 'Go goroutines'
            summarize_by: max
            unit: goroutines
            query: metrics | where metric_name == "go.goroutine.count" | summarize max(value) by bin_auto(timestamp), resource.service.name
            layout: { w: 3, h: 4 }

          - type: 'timeseries_line'
            title: 'Node.js event loop delay (p99)'
            summarize_by: max
            unit: s
            query: metrics | where metric_name == "nodejs.eventloop.delay.p99" | summarize max(value) by bin_auto(timestamp), resource.service.name
            layout: { w: 3, h: 4 }

          - type: 'timeseries_line'
            title: '.NET thread pool queue'
            summarize_by: max
            unit: items
            query: metrics | where metric_name == "dotnet.thread_pool.queue.length" | summarize max(value) by bin_auto(timestamp), resource.service.name
            layout: { w: 3, h: 4 }

      - type: group
        title: Hosts
        description: 'Machines reporting through the hostmetrics receiver.'
        layout: { w: 12, h: 5 }
        children:
          - type: 'timeseries_line'
            title: 'CPU utilization'
            summarize_by: max
            unit: '%'
            query: metrics | where metric_name == "system.cpu.utilization" and attributes.cpu.mode == "idle" | summarize 100 - avg(value) * 100 by bin_auto(timestamp), resource.host.name
            layout: { w: 4, h: 4 }

          - type: 'timeseries_line'
            title: 'Memory utilization'
            summarize_by: max
            unit: '%'
            query: metrics | where metric_name == "system.memory.utilization" and attributes.system.memory.state == "used" | summarize avg(value) * 100 by bin_auto(timestamp), resource.host.name
            layout: { w: 4, h: 4 }

          - type: 'timeseries_line'
            title: 'Load average (1m)'
            summarize_by: max
            unit: load
            query: metrics | where metric_name == "system.cpu.load_average.1m" | summarize avg(value) by bin_auto(timestamp), resource.host.name
            layout: { w: 4, h: 4 }
