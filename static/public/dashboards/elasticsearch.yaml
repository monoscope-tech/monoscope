title: Elasticsearch
icon: elasticsearch
preview: /public/assets/svgs/screens/http-stats.svg
description: Cluster health, shard states, node operations, thread pools, and JVM heap (OpenTelemetry elasticsearch receiver)
refresh_interval: 60s
tags: [database]
discovery_metrics:
  - 'elasticsearch.'
widgets:
  - type: group
    title: Cluster Overview
    layout: { w: 12, h: 3 }
    children:
      - type: 'timeseries_stat'
        title: 'Nodes'
        icon: server
        query: metrics | where metric_name == "elasticsearch.cluster.nodes" | summarize avg(value) by bin_auto(timestamp)
        unit: nodes
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Data Nodes'
        icon: database
        query: metrics | where metric_name == "elasticsearch.cluster.data_nodes" | summarize avg(value)
        unit: nodes
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Unassigned Shards'
        icon: alert-triangle
        query: metrics | where metric_name == "elasticsearch.cluster.shards" and attributes.state == "unassigned" | summarize avg(value)
        unit: shards
        eager: true
        layout: { w: 3, h: 2 }

      - type: 'stat'
        title: 'Pending Tasks'
        icon: clock
        query: metrics | where metric_name == "elasticsearch.cluster.pending_tasks" | summarize avg(value)
        unit: tasks
        eager: true
        layout: { w: 3, h: 2 }

  - type: 'timeseries_line'
    title: 'Cluster Health Status'
    description: 'The count in each status; a non-zero red/yellow series is the alarm signal.'
    query: metrics | where metric_name == "elasticsearch.cluster.health" | summarize avg(value) by bin_auto(timestamp), attributes.status
    unit: status
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Shards by State'
    query: metrics | where metric_name == "elasticsearch.cluster.shards" | summarize avg(value) by bin_auto(timestamp), attributes.state
    unit: shards
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Operations by Type'
    query: metrics | where metric_name == "elasticsearch.node.operations.completed" | summarize range(value) by bin_auto(timestamp), attributes.operation
    unit: ops
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Operation Time by Type'
    query: metrics | where metric_name == "elasticsearch.node.operations.time" | summarize range(value) by bin_auto(timestamp), attributes.operation
    unit: ms
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'Thread Pool Rejections'
    theme: 'roma'
    description: 'Rejected tasks mean a saturated pool — writes or searches are being turned away.'
    query: metrics | where metric_name == "elasticsearch.node.thread_pool.tasks.finished" and attributes.state == "rejected" | summarize range(value) by bin_auto(timestamp), attributes.thread_pool_name
    unit: tasks
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Thread Pool Queues'
    query: metrics | where metric_name == "elasticsearch.node.thread_pool.tasks.queued" | summarize avg(value) by bin_auto(timestamp), attributes.thread_pool_name
    unit: tasks
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'JVM Heap Used vs Max'
    query: metrics | where metric_name in ("jvm.memory.heap.used", "jvm.memory.heap.max") | summarize avg(value) / 1073741824 by bin_auto(timestamp), metric_name
    unit: GB
    layout: { w: 6, h: 4 }

  - type: 'timeseries'
    title: 'GC Time'
    query: metrics | where metric_name == "jvm.gc.collections.elapsed" | summarize range(value) by bin_auto(timestamp), attributes.name
    unit: ms
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Documents (live vs deleted)'
    query: metrics | where metric_name == "elasticsearch.node.documents" | summarize avg(value) by bin_auto(timestamp), attributes.state
    unit: docs
    layout: { w: 6, h: 4 }

  - type: 'timeseries_line'
    title: 'Disk Available per Node'
    query: metrics | where metric_name == "elasticsearch.node.fs.disk.available" | summarize avg(value) / 1073741824 by bin_auto(timestamp), resource.elasticsearch.node.name
    unit: GB
    layout: { w: 6, h: 4 }
