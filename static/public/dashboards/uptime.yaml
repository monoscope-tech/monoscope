title: Uptime & cron
tags: [uptime, synthetic, cron, monitors]
read_only: true
icon: heart-pulse
preview: /public/assets/svgs/screens/http-stats.svg
description: Every uptime probe and cron check-in as telemetry, with response times, regions and failures
refresh_interval: 60s
time_range:
  since: 7D
  from: now-7d
# Every uptime probe is an `uptime.probe` client span in the check's project (BackgroundJobs.probeSpan):
# url.full, http.response.status_code, status_code (OK/ERROR), duration, geo.country.iso_code of the probe's
# region, and monitor.* attributes. Cron runs are the jobs' own `cron.checkin` spans or logs.
# The uptime pages embed these tabs with var-check set (Pages.Uptime); with no check they cover them all.

variables:
  - key: check
    title: Check
    type: query
    reload_on_change: true
    sql:
      source: postgres
      statement: select url, name from apis.prometheus_scrape_configs where project_id='{{project_id}}' and kind='uptime' order by name limit 500
    multi: false

  - key: region
    title: Region
    type: values
    reload_on_change: true
    options: [[us-east, Virginia], [us-west, Oregon], [sa-east, São Paulo], [eu-west, France], [eu-central, Frankfurt], [eu-north, Helsinki], [af-south, Johannesburg], [ap-south, Mumbai], [ap-southeast, Singapore], [ap-northeast, Tokyo], [au-east, Sydney]]
    multi: false

widgets: []

tabs:
  - name: Overview
    icon: heart-pulse
    variables: [check, region]
    widgets:
      - type: group
        title: Overview
        layout: { w: 12, h: 3 }
        children:
          - type: stat
            title: Uptime
            icon: circle-check
            query: 'name == "uptime.probe" and ("{{var-check}}" == "" or attributes.url.full == "{{var-check}}") and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}") | summarize countif(status_code != "ERROR") * 100.0 / count()'
            unit: '%'
            eager: true
            layout: { w: 3, h: 2 }
          - type: timeseries_stat
            title: Average response
            icon: clock
            query: 'name == "uptime.probe" and ("{{var-check}}" == "" or attributes.url.full == "{{var-check}}") and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}") | summarize avg(duration) by bin_auto(timestamp)'
            unit: ns
            eager: true
            layout: { w: 3, h: 2 }
          - type: timeseries_stat
            title: P95 response
            icon: gauge
            query: 'name == "uptime.probe" and ("{{var-check}}" == "" or attributes.url.full == "{{var-check}}") and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}") | summarize p95(duration) by bin_auto(timestamp)'
            unit: ns
            eager: true
            layout: { w: 3, h: 2 }
          - type: timeseries_stat
            title: Failed probes
            icon: circle-exclamation
            query: 'name == "uptime.probe" and ("{{var-check}}" == "" or attributes.url.full == "{{var-check}}") and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}") and status_code == "ERROR" | summarize count() by bin_auto(timestamp)'
            unit: probes
            eager: true
            layout: { w: 3, h: 2 }

      - type: day_bars
        title: Daily uptime
        description: One bar per day; a day with failed probes stands taller, amber below 5% failed and red above.
        query: 'name == "uptime.probe" and ("{{var-check}}" == "" or attributes.url.full == "{{var-check}}") and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}")'
        layout: { w: 12, h: 2 }

      - type: timeseries_line
        title: Response time
        query: 'name == "uptime.probe" and ("{{var-check}}" == "" or attributes.url.full == "{{var-check}}") and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}") and status_code != "ERROR" | summarize p50(duration), p95(duration), p99(duration) by bin_auto(timestamp)'
        unit: ns
        layout: { w: 8, h: 4 }

      - type: timeseries
        title: Probes by result
        query: 'name == "uptime.probe" and ("{{var-check}}" == "" or attributes.url.full == "{{var-check}}") and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}") | summarize count() by bin_auto(timestamp), status_code'
        unit: probes
        layout: { w: 4, h: 4 }

  - name: Response time
    icon: clock
    variables: [check, region]
    widgets:
      - type: timeseries_line
        title: P50, P95 and P99
        query: 'name == "uptime.probe" and ("{{var-check}}" == "" or attributes.url.full == "{{var-check}}") and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}") and status_code != "ERROR" | summarize p50(duration), p95(duration), p99(duration) by bin_auto(timestamp)'
        unit: ns
        layout: { w: 12, h: 4 }
      - type: heatmap
        title: Response time distribution
        query: 'name == "uptime.probe" and ("{{var-check}}" == "" or attributes.url.full == "{{var-check}}") and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}")'
        unit: ns
        layout: { w: 6, h: 4 }
      - type: timeseries_line
        title: Response time by status code
        query: 'name == "uptime.probe" and ("{{var-check}}" == "" or attributes.url.full == "{{var-check}}") and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}") | summarize avg(duration) by bin_auto(timestamp), attributes.http.response.status_code'
        unit: ns
        layout: { w: 6, h: 4 }

  - name: Regions
    icon: globe
    variables: [check, region]
    widgets:
      - type: geomap
        title: Probes by location
        description: Where probes ran from. Each region is a worker started with UPTIME_PROBE_REGION.
        query: 'name == "uptime.probe" and ("{{var-check}}" == "" or attributes.url.full == "{{var-check}}") and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}") | summarize count() by attributes.geo.country.iso_code'
        unit: probes
        layout: { w: 6, h: 5 }
      - type: timeseries_line
        title: P95 response by region
        query: 'name == "uptime.probe" and ("{{var-check}}" == "" or attributes.url.full == "{{var-check}}") and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}") and status_code != "ERROR" | summarize p95(duration) by bin_auto(timestamp), attributes.monitor.region'
        unit: ns
        layout: { w: 6, h: 5 }
      - type: timeseries
        title: Failed probes by region
        query: 'name == "uptime.probe" and ("{{var-check}}" == "" or attributes.url.full == "{{var-check}}") and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}") and status_code == "ERROR" | summarize count() by bin_auto(timestamp), attributes.monitor.region'
        unit: probes
        layout: { w: 12, h: 3 }

  - name: Errors
    icon: circle-exclamation
    variables: [check, region]
    widgets:
      - type: timeseries
        title: Failures by status code
        query: 'name == "uptime.probe" and ("{{var-check}}" == "" or attributes.url.full == "{{var-check}}") and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}") and status_code == "ERROR" | summarize count() by bin_auto(timestamp), attributes.http.response.status_code'
        unit: probes
        layout: { w: 8, h: 4 }
      - type: top_list
        title: Failure reasons
        query: 'name == "uptime.probe" and ("{{var-check}}" == "" or attributes.url.full == "{{var-check}}") and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}") and status_code == "ERROR" | summarize count() by status_message'
        unit: probes
        layout: { w: 4, h: 4 }
      - type: logs
        title: Failed probes
        description: Each opens its span; an instrumented target's own spans join the probe's trace.
        query: 'name == "uptime.probe" and ("{{var-check}}" == "" or attributes.url.full == "{{var-check}}") and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}") and status_code == "ERROR"'
        layout: { w: 12, h: 5 }

  - name: All checks
    icon: list-check
    variables: [region]
    widgets:
      - type: day_bars
        title: Daily uptime, every check
        query: 'name == "uptime.probe" and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}")'
        layout: { w: 12, h: 2 }
      - type: table
        title: Checks
        layout: { w: 12, h: 5 }
        columns:
          - field: url
            title: URL
          - field: probes
            title: Probes
            column_type: number
          - field: uptime
            title: Uptime
            column_type: number
            unit: '%'
          - field: p95
            title: P95
            column_type: duration
            unit: ns
        query: 'name == "uptime.probe" and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}")'
        sql: |
          SELECT attributes___url___full AS url, count(*)::bigint AS probes,
                 (100.0 * count(*) FILTER (WHERE status_code <> 'ERROR') / count(*))::float8 AS uptime,
                 approx_percentile(0.95, percentile_agg(duration))::float8 AS p95
          FROM otel_logs_and_spans
          WHERE {{query_ast_filters}}
          GROUP BY 1 ORDER BY uptime ASC, probes DESC LIMIT 200
      - type: timeseries_line
        title: P95 response by check
        query: 'name == "uptime.probe" and status_code != "ERROR" and ("{{var-region}}" == "" or attributes.monitor.region == "{{var-region}}") | summarize p95(duration) by bin_auto(timestamp), attributes.url.full'
        unit: ns
        layout: { w: 12, h: 4 }

  - name: Cron
    icon: clock
    widgets:
      - type: day_bars
        title: Daily runs, every job
        description: Runs reported by cron.checkin spans or logs; a run with monitor.status error counts as failed.
        query: 'name == "cron.checkin" | summarize count(*) by bin(timestamp, 1d), attributes.monitor.status'
        layout: { w: 12, h: 2 }
      - type: timeseries
        title: Runs by job
        query: 'name == "cron.checkin" | summarize count() by bin_auto(timestamp), attributes.monitor.slug'
        unit: runs
        layout: { w: 8, h: 4 }
      - type: top_list
        title: Failed runs by job
        query: 'name == "cron.checkin" and attributes.monitor.status == "error" | summarize count() by attributes.monitor.slug'
        unit: runs
        layout: { w: 4, h: 4 }

  - name: Uptime checks
    icon: heart-pulse
    link: /p/{{project_id}}/monitors/uptime
    widgets: []

  - name: Status pages
    icon: satellite-dish
    link: /p/{{project_id}}/monitors/status-pages
    widgets: []
