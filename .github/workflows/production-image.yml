name: Production image

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      wait_minutes:
        description: How long to wait for the Mac to push the image before failing
        required: false
        type: number
        default: 0
    secrets:
      GH_TOKEN:
        required: true
    outputs:
      digest:
        description: Immutable production image digest
        value: ${{ jobs.image.outputs.digest }}

jobs:
  image:
    name: Production image
    runs-on: ubuntu-24.04
    timeout-minutes: 180 # covers the longest wait_minutes; expressions cannot do arithmetic
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}
      # Compilation happens on the local Mac; this waits up to wait_minutes for its push.
      - name: Resolve locally built production image
        id: image
        env:
          IMAGE_WAIT_MINUTES: ${{ inputs.wait_minutes }}
        run: scripts/ci/release.sh build
