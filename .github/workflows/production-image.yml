name: Production image

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
    secrets:
      GH_TOKEN:
        required: true
    outputs:
      digest:
        description: Immutable production image digest
        value: ${{ jobs.image.outputs.digest }}

jobs:
  image:
    name: Production image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}
      - name: Build or reuse production image
        id: image
        run: scripts/ci/release.sh build
