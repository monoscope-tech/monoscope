name: Production image

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
    secrets:
      GH_TOKEN:
        required: true
    outputs:
      digest:
        description: Immutable production image digest
        value: ${{ jobs.image.outputs.digest }}

jobs:
  image:
    name: Production image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v4
      # The Dockerfile's dist-newstyle cache mount dies with each fresh runner, so every
      # build recompiled all of monoscope (~57 min). Carry it in the Actions cache: master
      # saves, PRs restore master's and stay read-only so they can't evict it. Paths sit
      # outside the checkout because release.sh refuses a dirty tree.
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dist-newstyle
          key: prod-dist-${{ inputs.revision }}
          restore-keys: prod-dist-
      - if: github.ref != 'refs/heads/master'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/dist-newstyle
          key: prod-dist-${{ inputs.revision }}
          restore-keys: prod-dist-
      - uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"${{ runner.temp }}/dist-newstyle": {"target": "/build/dist-newstyle", "id": "monoscope-production-dist-locked-v1"}}'
          scratch-dir: ${{ runner.temp }}/cache-dance-scratch
          skip-extraction: ${{ github.ref != 'refs/heads/master' }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}
      - name: Build or reuse production image
        id: image
        run: scripts/ci/release.sh build
