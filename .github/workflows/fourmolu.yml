name: fourmolu
on: push

# Serialise per-branch so two pushes can't race for the same fast-forward.
concurrency:
  group: fourmolu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    # Dependabot pushes use a read-only GITHUB_TOKEN; skip rather than 403.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # `make fmt` downloads the version the Makefile pins, so laptops and this bot agree.
      - name: Cache fourmolu
        uses: actions/cache@v5
        with:
          path: .ci/fourmolu-*
          key: fourmolu-${{ hashFiles('Makefile') }}

      - name: Format code
        run: make fmt

      - name: Commit & push formatted code
        run: |
          if git diff --quiet; then
            echo "no formatting changes"
            exit 0
          fi
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Auto-format code with fourmolu"
          # Race-safe push: if upstream moved while we were formatting, rebase and retry once.
          for i in 1 2 3; do
            if git push origin HEAD:${GITHUB_REF#refs/heads/}; then exit 0; fi
            git pull --rebase origin ${GITHUB_REF#refs/heads/}
          done
          exit 1
