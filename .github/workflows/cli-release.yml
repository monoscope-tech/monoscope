name: CLI Release

# The CLI is its own package (cli/monoscope-cli.cabal) and does NOT depend on
# lib:monoscope. That is deliberate: the server library links libpq, librdkafka,
# grpc, protobuf, snappy, lz4 and zstd, none of which a CLI user should have to
# install. It also means these jobs need no frontend assets, no proto codegen
# and — on macOS — no Homebrew packages at all.
#
# The "no native deps" guarantee is enforced, not assumed: every job runs
# scripts/check-cli-linkage.sh against the binary it just built.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  LANG: C.UTF-8
  # -split-sections lets the linker drop unreferenced code per symbol rather
  # than per object file. Applied to our packages only: turning it on globally
  # would invalidate the prebuilt dependency store in the deps image and turn a
  # 10-minute release into an hour-long one.
  CLI_GHC_OPTS: '-O2 -split-sections +RTS -A64m -n2m -RTS'

jobs:
  build-linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: blacksmith-4vcpu-ubuntu-2404
          - arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    container:
      image: ghcr.io/monoscope-tech/monoscope-deps:latest
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GH_TOKEN }}
      env:
        CABAL_DIR: /root/.cabal
    steps:
      - uses: actions/checkout@v6

      - name: Cache dist-newstyle
        uses: actions/cache@v5
        with:
          path: dist-newstyle
          key: cli-linux-${{ matrix.arch }}-${{ hashFiles('cli/*.cabal', 'shared/*.cabal', 'cabal.project*') }}-${{ github.sha }}
          restore-keys: |
            cli-linux-${{ matrix.arch }}-${{ hashFiles('cli/*.cabal', 'shared/*.cabal', 'cabal.project*') }}-
            cli-linux-${{ matrix.arch }}-

      - name: Build CLI binary
        run: |
          cabal build monoscope-cli:exe:monoscope -j \
            --ghc-options="$CLI_GHC_OPTS -optl-Wl,--gc-sections"

      - name: Package binary
        run: |
          BIN=$(cabal list-bin monoscope-cli:exe:monoscope | tail -n1)
          cp "$BIN" monoscope
          strip -s monoscope
          ./scripts/check-cli-linkage.sh monoscope
          tar czf monoscope-linux-${{ matrix.arch }}.tar.gz monoscope

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: monoscope-linux-${{ matrix.arch }}
          path: monoscope-linux-${{ matrix.arch }}.tar.gz
          retention-days: 5

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: blacksmith-6vcpu-macos-15
          # GitHub's Intel image (replaces retired macos-13); available until Aug 2027
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - name: Read GHC version from cabal.project
        id: ghc
        run: echo "version=$(awk '/^with-compiler:[[:space:]]*ghc-/ {sub(/^ghc-/, "", $2); print $2}' cabal.project)" >> "$GITHUB_OUTPUT"

      - name: Install GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ steps.ghc.outputs.version }}
          cabal-version: '3.14'

      - name: Cache Cabal
        uses: actions/cache@v5
        with:
          path: ~/.cabal
          key: cli-macos-${{ matrix.arch }}-cabal-${{ hashFiles('cli/*.cabal', 'shared/*.cabal', 'cabal.project*') }}
          restore-keys: cli-macos-${{ matrix.arch }}-cabal-

      - name: Cache dist-newstyle
        uses: actions/cache@v5
        with:
          path: dist-newstyle
          key: cli-macos-${{ matrix.arch }}-dist-${{ hashFiles('cli/*.cabal', 'shared/*.cabal', 'cabal.project*') }}
          restore-keys: cli-macos-${{ matrix.arch }}-dist-

      - name: Build CLI binary
        run: |
          cabal build monoscope-cli:exe:monoscope -j \
            --ghc-options="$CLI_GHC_OPTS -optl-Wl,-dead_strip"

      - name: Package binary
        run: |
          BIN=$(cabal list-bin monoscope-cli:exe:monoscope | tail -n1)
          cp "$BIN" monoscope
          strip -x monoscope
          # GHC picks up Homebrew's zlib when it is on the runner, which would
          # make the released binary unusable on a Mac without Homebrew. Repoint
          # it at the system copy (macOS has always shipped one) and re-sign,
          # since editing load commands invalidates the ad-hoc signature.
          BREW_Z=$(otool -L monoscope | awk '/libz\..*dylib/ && !/^\/usr\/lib/ {print $1}')
          if [ -n "$BREW_Z" ]; then
            install_name_tool -change "$BREW_Z" /usr/lib/libz.1.dylib monoscope
            codesign -f -s - monoscope
          fi
          ./scripts/check-cli-linkage.sh monoscope
          tar czf monoscope-darwin-${{ matrix.arch }}.tar.gz monoscope

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: monoscope-darwin-${{ matrix.arch }}
          path: monoscope-darwin-${{ matrix.arch }}.tar.gz
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: [build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          ASSETS=$(ls *.tar.gz checksums.txt 2>/dev/null | tr '\n' ' ')
          if gh release view "$GITHUB_REF_NAME" &>/dev/null; then
            gh release upload "$GITHUB_REF_NAME" $ASSETS --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Monoscope ${GITHUB_REF_NAME}" \
              --generate-notes \
              $ASSETS
          fi
