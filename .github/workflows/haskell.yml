name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]

env:
  LANG: C.UTF-8
  # Kill switch for the attestation cache: set the repo variable to "true" and
  # every job runs every check again, no code change needed.
  CI_ATTEST_DISABLED: ${{ vars.CI_ATTEST_DISABLED }}

permissions:
  contents: write # to publish attestation refs under refs/ci-attest/*

jobs:
  # What CI does NOT have to do. Every check in ci/checks.tsv is fingerprinted over
  # the content it depends on; if the identical content was already proven — by the
  # PR run that produced this merge, an earlier attempt, or a developer's `make ci`
  # — the result is on the remote as a ref and the job below skips it. A squash
  # merge keeps the PR head's tree, so master normally skips the lot and the deploy
  # is bounded by the image build. See docs/local-ci.md.
  gate:
    name: Gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      fingerprints: ${{ steps.checks.outputs.fingerprints }}
      skip_build: ${{ steps.checks.outputs.skip_build }}
      skip_doctests: ${{ steps.checks.outputs.skip_doctests }}
      skip_unit_tests: ${{ steps.checks.outputs.skip_unit_tests }}
      skip_cli_tests: ${{ steps.checks.outputs.skip_cli_tests }}
      skip_integration_tests: ${{ steps.checks.outputs.skip_integration_tests }}
      skip_e2e: ${{ steps.checks.outputs.skip_e2e }}
      skip_haskell: ${{ steps.haskell.outputs.skip_all }}
    steps:
      - uses: actions/checkout@v6
      - id: checks
        run: scripts/ci/ci.sh gate
      # Whether the whole container job (image pull + service containers + cabal
      # cache restore, ~7 minutes before a single test runs) can be skipped outright.
      - id: haskell
        run: scripts/ci/ci.sh gate build doctests unit-tests cli-tests integration-tests e2e

  # Build frontend once and share via artifacts
  frontend:
    name: Build Frontend
    needs: gate
    if: needs.gate.outputs.skip_haskell != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web-components/package-lock.json

      # Through ci.sh so the bundle CI ships and the bundle `make ci` builds come
      # from one recipe (ci/checks.tsv -> run_body frontend).
      - name: Build frontend assets
        env:
          FINGERPRINTS: ${{ needs.gate.outputs.fingerprints }}
        run: |
          mkdir -p .ci && printf '%s\n' "$FINGERPRINTS" > .ci/fingerprints.tsv
          # CI_FORCE: this job exists for the ARTIFACTS, not the verdict — an
          # existing attestation would skip the build and leave nothing to upload.
          CI_FORCE=true CI_FINGERPRINTS=.ci/fingerprints.tsv scripts/ci/ci.sh run frontend

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-assets
          path: |
            static/public/assets/css/tailwind.min.css
            static/public/assets/web-components/dist
          retention-days: 1

  build-and-test:
    name: Build and Test
    needs: [gate, frontend]
    if: needs.gate.outputs.skip_haskell != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # 30 was under budget and the job was silently truncating: on 2026-08-11 the
    # integration suite got 19 seconds before the wall, and the run before that
    # lost the doctests. Whichever step the wall lands on is a function of cache
    # luck, not of what changed. Measured floor with a warm cache: ~1.5m containers
    # + 5.5m hpack + 16m build + 6m doctests, i.e. 30m before the integration
    # suite starts. Now that `deploy` gates on this job, truncation blocks the
    # deploy rather than silently waving it through.
    timeout-minutes: 60
    container:
      image: ghcr.io/monoscope-tech/monoscope-deps:latest
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GH_TOKEN }}
      env:
        CABAL_DIR: /root/.cabal
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16-all
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monoscope
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      # bitnami/minio was emptied from Docker Hub in the Aug-2025 Bitnami catalog
      # change (that repository now has no tags at all); the pre-change images were
      # relocated verbatim to bitnamilegacy. CI only kept working off a runner-side
      # cache. Pinned here so a cache eviction can't take the suite down.
      minio:
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          # timefusion bucket must exist before TF opens its Delta table.
          MINIO_DEFAULT_BUCKETS: monoscope-test,timefusion
        options: >-
          --health-cmd="curl -fsS http://localhost:9000/minio/health/live"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      # Real TimeFusion so the dual-write TF leg is exercised exactly like prod
      # (untyped placeholders, unnest casts, Variant coercion) instead of the
      # Postgres-as-TF fallback. TIMEFUSION_PG_TEST_URL below flips it on.
      timefusion:
        # TF's deploy workflow publishes :latest on every master build.
        image: ghcr.io/monoscope-tech/timefusion:latest
        credentials:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}
        # TF's WAL uses io_uring, which Docker's default seccomp profile blocks
        # (WAL append_batch fails with EPERM). Unconfine this throwaway CI container.
        options: --security-opt seccomp=unconfined
        env:
          PGWIRE_PORT: '5432'
          # pgwire auth: TF checks the client password against PGWIRE_PASSWORD;
          # insecure mode alone expects an EMPTY password and rejects the test's
          # "postgres". Set it to match TIMEFUSION_PG_TEST_URL (postgres/postgres).
          PGWIRE_PASSWORD: postgres
          # Still needed so TF's gRPC ingest server starts without a GRPC_TOKEN.
          TIMEFUSION_ALLOW_INSECURE_AUTH: 'true'
          AWS_S3_BUCKET: timefusion
          AWS_S3_ENDPOINT: http://minio:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_REGION: us-east-1
          AWS_ALLOW_HTTP: 'true'
          TIMEFUSION_DATA_DIR: /tmp/tf-data
          # Flush each bucket immediately so a test's writes are queryable within
          # the test's lifetime (no 10-min wait).
          TIMEFUSION_BUFFER_FLUSH_IMMEDIATELY: 'true'
          # Keep TF lean on the shared runner: it otherwise auto-sizes a ~2.3GB
          # memory + ~226GB disk Foyer cache from host resources and OOM-kills the
          # runner alongside the 4 sharded Haskell test processes. No cache/OTLP
          # needed in CI.
          TIMEFUSION_FOYER_DISABLED: 'true'
          TIMEFUSION_BUFFER_MAX_MEMORY_MB: '512'
          OTEL_TRACES_EXPORTER: none
    env:
      # Every step below runs through scripts/ci/ci.sh, which reads these both to
      # decide the environment's capabilities and to point the suite at the services.
      USE_EXTERNAL_DB: 'true'
      DB_HOST: postgres
      LOG_LEVEL: warn
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      TIMEFUSION_PG_TEST_URL: postgresql://postgres:postgres@timefusion:5432/postgres
      TWILIO_ACCOUNT_SID: ${{ vars.TWILIO_ACCOUNT_SID }}
      DISCORD_CLIENT_ID: '1328384474395967631'
      CI_SHARDS: '4'
      CI_FINGERPRINTS: .ci/fingerprints.tsv
    steps:
      - uses: actions/checkout@v6

      - name: Cache dist-newstyle
        uses: actions/cache@v5
        with:
          path: dist-newstyle
          key: ${{ runner.os }}-container-cabal-${{ hashFiles('**/*.cabal', '**/cabal.project*') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-container-cabal-${{ hashFiles('**/*.cabal', '**/cabal.project*') }}-
            ${{ runner.os }}-container-cabal-

      - name: Download frontend artifacts
        uses: actions/download-artifact@v8
        with:
          name: frontend-assets
          path: static/public/assets

      - name: Setup static directories
        run: |
          mkdir -p static/public/assets/css
          mkdir -p static/public/assets/web-components/dist/js
          mkdir -p static/public/assets/web-components/dist/css

      # Attest the fingerprints the gate looked up. hpack below rewrites
      # monoscope.cabal, which is one of the inputs — recomputing after it would
      # attest a fingerprint no gate will ever ask for, and nothing would be reused.
      - name: Pin fingerprints from gate
        env:
          FINGERPRINTS: ${{ needs.gate.outputs.fingerprints }}
        run: mkdir -p .ci && printf '%s\n' "$FINGERPRINTS" > .ci/fingerprints.tsv

      - name: Install hpack
        run: cabal install --install-method=copy --overwrite-policy=always hpack

      # Delete first: hpack refuses to overwrite a .cabal whose header names a
      # NEWER hpack than its own, so a developer regenerating with a version
      # ahead of whatever CI's index offers fails this step outright. Pinning
      # cannot fix it in general — the newer version may not be resolvable here
      # at all. Nothing downstream diffs the file, it is only regenerated to
      # build from, so removing it first makes this immune to skew either way.
      - name: Regenerate cabal file
        run: rm -f monoscope.cabal && hpack

      - name: Build
        if: needs.gate.outputs.skip_build != 'true'
        run: scripts/ci/ci.sh run build

      - name: Run doctests
        if: needs.gate.outputs.skip_doctests != 'true'
        run: scripts/ci/ci.sh run doctests

      - name: Run unit-tests
        if: needs.gate.outputs.skip_unit_tests != 'true'
        run: scripts/ci/ci.sh run unit-tests

      # The CLI package builds without libpq, so its tests are cheap and can't be
      # skipped for want of a database.
      - name: Run cli-tests
        if: needs.gate.outputs.skip_cli_tests != 'true'
        run: scripts/ci/ci.sh run cli-tests

      # No explicit wait: the TF service container starts at "Initialize
      # containers" (before the multi-minute build) and boots in ~1s, so it's long
      # ready by the time integration tests connect. The hasql TF pool also
      # retries, and TF's early-bind responder holds :5432 from the start.
      - name: Run integration-tests
        if: needs.gate.outputs.skip_integration_tests != 'true'
        run: scripts/ci/ci.sh run integration-tests

      # Same job as integration-tests: it is the one with ghc, node and postgres all
      # present, which is what the e2e check declares it requires.
      - name: Run e2e
        if: needs.gate.outputs.skip_e2e != 'true'
        run: scripts/ci/ci.sh run e2e

      # The step above prints the failures; this keeps the surrounding output
      # (setup, per-example progress, the app's own logs) for anything the summary
      # can't explain.
      - name: Upload integration shard logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-shard-logs
          path: build-shard-*.log
          retention-days: 14

  # Building and pushing the image is harmless whatever the tests say — nothing
  # runs it until `deploy` says so — so it stays parallel with the test job and
  # off the critical path. Only the CapRover call is gated.
  build-image:
    name: Build and Push Docker Image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: 'read'
      id-token: 'write'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      # The registry is the cache and the commit SHA is the fingerprint: an image
      # tagged with this SHA is by construction the image for this commit, so
      # rebuilding it produces the same thing at a cost of ~4 minutes. Turns a
      # re-run, a workflow_dispatch of an existing commit, or a revert to an
      # already-built SHA into a ~30-second deploy. It does nothing for a genuinely
      # new commit, which is the common case — this is for the repeat ones.
      #
      # It also lets a developer pre-build and push the image themselves (see
      # `make deploy-image`); the deploy job records who built it either way.
      - name: Is this commit's image already in the registry?
        id: probe
        run: |
          img=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          if docker manifest inspect "$img:${{ github.sha }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image for \`${{ github.sha }}\` already in the registry — skipping the build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Skipping the build must not leave :latest pointing at an older commit —
      # docker-compose.yml (self-hosters) pulls :latest. Re-point it at the image
      # we just decided to reuse; this copies a manifest, it does not rebuild.
      - name: Point :latest at the existing image
        if: steps.probe.outputs.exists == 'true'
        run: |
          img=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          docker buildx imagetools create -t "$img:latest" "$img:${{ github.sha }}"

      - name: Build and push Docker Image
        if: steps.probe.outputs.exists != 'true'
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
          # cache-from/cache-to and platforms are incompatible with docker driver.
          # Caching is handled by --mount=type=cache in Dockerfile instead.
          # Re-enable these if switching back to docker-container driver (ubuntu-latest).
          # cache-from: |
          #   type=gha
          #   type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:buildcache
          # cache-to: |
          #   type=gha,mode=max
          #   type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:buildcache,mode=max
          # platforms: linux/amd64
          provenance: false
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            GIT_HASH=${{ github.sha }}
            GIT_COMMIT_DATE=${{ github.event.head_commit.timestamp || 'unknown' }}

  # The gate. `if` is what enforces it, and it is deliberately spelled out rather
  # than left to `needs`: build-and-test is now allowed to be SKIPPED, but only
  # when the gate job says every Haskell check was already proven for this exact
  # tree. Any other skip — a failure, a cancellation, a timeout, a gate job that
  # itself failed and so has an empty output — leaves this condition false and the
  # image sits in the registry unused. Do NOT relax this to a bare `always()`;
  # that is exactly what let untested builds reach prod for months.
  deploy:
    name: Deploy to CapRover
    needs: [gate, build-image, build-and-test]
    if: >-
      always()
      && needs.build-image.result == 'success'
      && (needs.build-and-test.result == 'success'
          || (needs.build-and-test.result == 'skipped' && needs.gate.outputs.skip_haskell == 'true'))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      # An image cannot be re-derived from source to check it (a Haskell build is
      # not bit-reproducible), so the only way "what is running in prod, and who
      # built it" stays answerable is to say so here, every time.
      - name: Note why this deploy was allowed, and who built the image
        run: |
          {
            echo "build-and-test: ${{ needs.build-and-test.result }} (all Haskell checks pre-proven: ${{ needs.gate.outputs.skip_haskell }})"
            # Never fatal: this is a note about the deploy, not a condition of it.
            # A provenance lookup that cannot reach the remote must not be the
            # reason a green, gated build fails to reach production.
            scripts/ci/ci.sh image-who "${{ github.sha }}" || echo "built by: (could not read provenance)"
          } >> "$GITHUB_STEP_SUMMARY"
      # Pinned deliberately, not using caprover/deploy-from-github: that action
      # does an unpinned `npm i -g caprover` at image-build time, so an upstream
      # release lands straight in the deploy path. caprover 2.4.0 (2026-08-05)
      # bumped commander to v12, which rejects the duplicate `-t` its own deploy
      # command registers — every deploy crashed on startup for two days before
      # 2.4.3 fixed it. 2.3.1 is the last version on the permissive commander and
      # is what was deploying successfully before that. Bump it on purpose.
      - name: Deploy Image to CapRrover
        run: |
          npx -y caprover@2.3.1 deploy \
            --caproverUrl "$CAPROVER_URL" \
            --appToken "$CAPROVER_APP_TOKEN" \
            --appName "$CAPROVER_APP" \
            --imageName "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}"
        env:
          CAPROVER_URL: ${{ secrets.CAPTAINROVER_SERVER }}
          CAPROVER_APP: ${{ secrets.CAPTAINROVER_APP_NAME }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPTAINROVER_APP_TOKEN }}
