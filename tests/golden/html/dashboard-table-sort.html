<table class="dashboard-table table table-zebra table-sm w-full relative" id>
<thead class="sticky top-0 z-10 before:content-[&#39;&#39;] before:absolute before:left-0 before:right-0 before:bottom-0 before:h-px before:bg-strokeWeak">
<tr>
<th class="text-left bg-bgRaised sticky top-0 " aria-sort="none">
<button type="button" class="w-full text-left cursor-pointer hover:bg-fillWeak group" data-sort-field="duration" data-sort-direction="none" _="on click
                  set fetcher to the closest &lt;[data-table-fetch]/&gt;
                  if not fetcher halt end
                  set sort to &#39;+&#39; + my @data-sort-field
                  if my @data-sort-direction is &#39;asc&#39; set sort to &#39;-&#39; + my @data-sort-field end
                  set fetcher.dataset.tableSort to sort
                  trigger &#39;table-sort&#39; on fetcher">
<div class=" flex items-center justify-between ">
<span>Duration</span>
<span class="sort-arrow ml-1 text-iconNeutral">↕</span>
</div>
</button>
