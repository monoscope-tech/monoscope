<input type="search" class="min-w-0 grow bg-transparent max-md:text-base" placeholder="Filter services" aria-label="Filter services" hx-on:input="window.serviceMapFilter(this.value)"
<ul class="flex flex-wrap max-md:flex-nowrap gap-x-3 gap-y-1 max-md:overflow-x-auto c-scroll" aria-label="Service colors"
<li class="flex items-center gap-1.5 shrink-0" data-service-color="checkout"
<li class="flex items-center gap-1.5 shrink-0" data-service-color="gateway"
<div class="border border-strokeStrong bg-bgBase rounded-2xl w-full h-[720px] max-md:h-[460px] relative overflow-hidden touch-none select-none" id="global-service-map" data-service-map="global-service-map" hx-morph-skip data-map-base="/p/<uuid>"
<a class="flex items-center gap-2 px-3 py-1.5 text-textStrong hover:bg-fillWeak cursor-pointer" data-menu-action="repositories" href="#"
<script type="application/json" id="global-service-map-data"
<script type="application/json" id="global-service-map-colors"
<a class="rounded-md border px-2 py-0.5 border-strokeBrand-strong bg-fillBrand-weak text-textStrong font-medium" href="/p/<uuid>/service_map?env=prod"
<a class="rounded-md border px-2 py-0.5 border-strokeWeak text-textWeak hover:bg-fillWeak" href="/p/<uuid>/service_map?env=staging"
